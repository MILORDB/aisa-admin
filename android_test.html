<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIsa</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: Arial; background: #0f0f1a; color: #fff; height: 100vh; display: flex; flex-direction: column; padding: 16px; }
        .header { background: #6c3ce0; padding: 12px; border-radius: 12px; text-align: center; margin-bottom: 12px; }
        .status { font-size: 12px; padding: 4px 12px; border-radius: 12px; background: rgba(255,255,255,0.1); }
        .status.online { color: #4caf50; }
        .status.offline { color: #f44336; }
        .chat { flex: 1; overflow-y: auto; background: #1a1a2e; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
        .msg { padding: 8px 12px; border-radius: 12px; margin-bottom: 8px; max-width: 80%; }
        .msg.user { background: #6c3ce0; margin-left: auto; }
        .msg.aisa { background: #2a2a3e; }
        .input-row { display: flex; gap: 8px; }
        .input-row input { flex: 1; padding: 10px 14px; border: none; border-radius: 12px; background: #1a1a2e; color: #fff; }
        .input-row button { padding: 10px 20px; border: none; border-radius: 12px; background: #6c3ce0; color: #fff; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🤖 AIsa</h1>
        <span class="status offline" id="status">● Desconectado</span>
    </div>
    <div class="chat" id="chat"></div>
    <div class="input-row">
        <input type="text" id="input" placeholder="Mensaje..." />
        <button id="sendBtn">Enviar</button>
        <button id="connectBtn">Conectar</button>
    </div>
    <script>
        let ws = null;
        const chat = document.getElementById('chat');
        const input = document.getElementById('input');
        const statusEl = document.getElementById('status');

        function addMessage(quien, texto) {
            const div = document.createElement('div');
            div.className = `msg ${quien}`;
            div.textContent = texto;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function setStatus(texto, tipo) {
            statusEl.textContent = texto;
            statusEl.className = 'status ' + tipo;
        }

        document.getElementById('connectBtn').addEventListener('click', () => {
            const ip = prompt('IP del servidor:', '192.168.1.X');
            if (!ip) return;

            try {
                ws = new WebSocket(`ws://${ip}:8765`);

                ws.onopen = () => {
                    setStatus('● Conectado', 'online');
                    addMessage('aisa', '✅ Conectado al asistente');
                };

                ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        if (data.tipo === 'bienvenida') {
                            addMessage('aisa', data.mensaje);
                        } else {
                            addMessage('aisa', data.texto || event.data);
                        }
                    } catch {
                        addMessage('aisa', event.data);
                    }
                };

                ws.onclose = () => {
                    setStatus('● Desconectado', 'offline');
                    addMessage('aisa', '❌ Desconectado del servidor');
                };

            } catch (e) {
                addMessage('aisa', `❌ ${e.message}`);
            }
        });

        document.getElementById('sendBtn').addEventListener('click', () => {
            const texto = input.value.trim();
            if (!texto || !ws || ws.readyState !== WebSocket.OPEN) return;

            ws.send(JSON.stringify({
                tipo: 'mensaje',
                texto: texto
            }));

            addMessage('user', texto);
            input.value = '';
        });
    </script>
</body>
</html>
