<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIsa</title>
    
    <!-- ============================================ -->
    <!-- FAVICON                                      -->
    <!-- ============================================ -->
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='img/favicon.ico') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='img/favicon-16x16.png') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/favicon-32x32.png') }}">
    <link rel="icon" type="image/png" sizes="48x48" href="{{ url_for('static', filename='img/favicon-48x48.png') }}">
    <link rel="icon" type="image/png" sizes="64x64" href="{{ url_for('static', filename='img/favicon-64x64.png') }}">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f1a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: #1a1a2e;
            padding: 48px 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            border: 1px solid #2a2a3e;
        }
        .logo {
            text-align: center;
            margin-bottom: 36px;
        }
        .logo svg {
            width: 80px;
            height: 80px;
            margin-bottom: 16px;
        }
        .logo h1 {
            font-size: 32px;
            font-weight: 700;
            color: #6c3ce0;
            letter-spacing: 2px;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #888;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #2a2a3e;
            border-radius: 8px;
            background: #0f0f1a;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .form-group input:focus {
            border-color: #6c3ce0;
            box-shadow: 0 0 0 3px rgba(108, 60, 224, 0.15);
        }
        .form-group input::placeholder {
            color: #444;
        }
        .btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #6c3ce0;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            margin-top: 4px;
        }
        .btn:hover {
            background: #5a2ec0;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
            padding-top: 16px;
            border-top: 1px solid #2a2a3e;
        }
        .link a {
            color: #6c3ce0;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }
        .link a:hover {
            color: #8a5ce0;
            text-decoration: underline;
        }
        .error {
            background: #442222;
            color: #ff6b6b;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
            display: none;
            border: 1px solid #662222;
        }
        .error.show {
            display: block;
        }
        /* Animación de entrada */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .container {
            animation: fadeInUp 0.6s ease forwards;
        }
        @media (max-width: 600px) {
            .container { padding: 32px 24px; }
            .logo svg { width: 64px; height: 64px; }
            .logo h1 { font-size: 28px; }
        }
        @media (max-width: 400px) {
            .container { padding: 24px 16px; }
            .logo svg { width: 56px; height: 56px; }
            .logo h1 { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <!-- ============================================ -->
            <!-- LOGO SVG                                     -->
            <!-- ============================================ -->
            <svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="80" height="80" version="1.1" style="shape-rendering:geometricPrecision; text-rendering:geometricPrecision; image-rendering:optimizeQuality; fill-rule:evenodd; clip-rule:evenodd" viewBox="0 0 5.38 5.38">
                <defs>
                    <style type="text/css">
                        .fil0 {fill:#6c3ce0}
                    </style>
                </defs>
                <g id="Capa_x0020_1">
                    <metadata id="CorelCorpID_0Corel-Layer"/>
                    <g id="_2961275662288">
                        <rect class="fil0" x="0.69" y="0.61" width="4.1" height="4.21" rx="0.5"/>
                        <text x="2.69" y="3.2" font-family="Arial, sans-serif" font-size="1.8" font-weight="bold" fill="white" text-anchor="middle">AIsa</text>
                        <circle cx="2.69" cy="2.0" r="1.0" fill="none" stroke="white" stroke-width="0.15"/>
                        <path d="M1.69 2.0 L2.69 1.2 L3.69 2.0" fill="none" stroke="white" stroke-width="0.15"/>
                        <circle cx="2.69" cy="2.0" r="0.3" fill="white"/>
                        <line x1="0.69" y1="3.8" x2="4.79" y2="3.8" stroke="white" stroke-width="0.08" opacity="0.4"/>
                    </g>
                </g>
            </svg>
            
            <!-- ============================================ -->
            <!-- SOLO "AIsa" - SIN SUBTÍTULO                  -->
            <!-- ============================================ -->
            <h1>AIsa</h1>
        </div>
        
        <div class="error" id="error"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label>Usuario</label>
                <input type="text" id="username" placeholder="Nombre de usuario" required autofocus>
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="password" placeholder="Contraseña" required>
            </div>
            <button type="submit" class="btn">Iniciar Sesión</button>
        </form>
        
        <div class="link">
            ¿No tienes cuenta? <a href="/register">Regístrate aquí</a>
        </div>
    </div>
    
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorEl = document.getElementById('error');
            const btn = document.querySelector('.btn');
            
            errorEl.classList.remove('show');
            btn.disabled = true;
            btn.textContent = 'Cargando...';
            
            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();
                
                if (response.ok) {
                    window.location.href = '/dashboard';
                } else {
                    errorEl.textContent = data.error || 'Error al iniciar sesión';
                    errorEl.classList.add('show');
                }
            } catch (error) {
                errorEl.textContent = 'Error de conexión con el servidor';
                errorEl.classList.add('show');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Iniciar Sesión';
            }
        });
    </script>
</body>
</html>
