<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIsa - Registro</title>
    
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='img/favicon.ico') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='img/favicon-16x16.png') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/favicon-32x32.png') }}">
    <link rel="icon" type="image/png" sizes="48x48" href="{{ url_for('static', filename='img/favicon-48x48.png') }}">
    <link rel="icon" type="image/png" sizes="64x64" href="{{ url_for('static', filename='img/favicon-64x64.png') }}">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f1a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: #1a1a2e;
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            border: 1px solid #2a2a3e;
            animation: fadeInUp 0.6s ease forwards;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo h1 {
            font-size: 30px;
            font-weight: 700;
            color: #6c3ce0;
            letter-spacing: 3px;
        }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            margin-bottom: 4px;
            font-size: 12px;
            color: #888;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #2a2a3e;
            border-radius: 8px;
            background: #0f0f1a;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
            font-family: inherit;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: #6c3ce0;
            box-shadow: 0 0 0 3px rgba(108, 60, 224, 0.15);
        }
        .form-group input::placeholder, .form-group textarea::placeholder {
            color: #444;
        }
        .form-group select option {
            background: #1a1a2e;
        }
        .form-group .help-text {
            font-size: 11px;
            color: #666;
            margin-top: 3px;
            display: block;
        }
        .form-group .help-text .highlight { color: #6c3ce0; font-weight: 600; }
        .form-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .form-row .form-group {
            flex: 1;
            min-width: 140px;
        }
        .required { color: #ff6b6b; margin-left: 2px; }
        .btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #6c3ce0;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            margin-top: 4px;
        }
        .btn:hover { background: #5a2ec0; }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
            padding-top: 16px;
            border-top: 1px solid #2a2a3e;
        }
        .link a {
            color: #6c3ce0;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }
        .link a:hover { color: #8a5ce0; text-decoration: underline; }
        .error {
            background: #442222;
            color: #ff6b6b;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
            display: none;
            border: 1px solid #662222;
        }
        .error.show { display: block; }
        .success {
            background: #224422;
            color: #6bff6b;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
            display: none;
            border: 1px solid #2a6a2a;
        }
        .success.show { display: block; }
        .negocio-fields {
            display: none;
            border-top: 1px solid #2a2a3e;
            padding-top: 16px;
            margin-top: 8px;
        }
        .negocio-fields.show { display: block; }
        .info-box {
            background: rgba(108, 60, 224, 0.08);
            border: 1px solid rgba(108, 60, 224, 0.15);
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 14px;
            font-size: 12px;
            color: #888;
        }
        .info-box strong { color: #6c3ce0; }
        textarea { resize: vertical; min-height: 50px; }
        @media (max-width: 600px) {
            .container { padding: 24px; }
            .logo h1 { font-size: 26px; }
            .form-row { flex-direction: column; }
            .form-row .form-group { min-width: unset; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ============================================ -->
        <!-- SOLO "AIsa" - SIN LOGO SVG                    -->
        <!-- ============================================ -->
        <div class="logo">
            <h1>AIsa</h1>
        </div>

        <div class="error" id="error"></div>
        <div class="success" id="success"></div>

        <form id="registerForm">
            <div class="form-group">
                <label>Nombre completo <span class="required">*</span></label>
                <input type="text" id="nombre" placeholder="Tu nombre completo" required>
            </div>
            
            <div class="form-group">
                <label>Nombre de usuario <span class="required">*</span></label>
                <input type="text" id="username" placeholder="Nombre de usuario" required autofocus>
            </div>
            
            <div class="form-group">
                <label>Email <span class="required">*</span></label>
                <input type="email" id="email" placeholder="tu@email.com" required>
            </div>
            
            <div class="form-group">
                <label>Contraseña <span class="required">*</span></label>
                <input type="password" id="password" placeholder="Mínimo 6 caracteres" required minlength="6">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Provincia <span class="required">*</span></label>
                    <select id="provincia" onchange="cargarMunicipios()" required>
                        <option value="">-- Seleccionar --</option>
                        <option value="La Habana">La Habana</option>
                        <option value="Artemisa">Artemisa</option>
                        <option value="Mayabeque">Mayabeque</option>
                        <option value="Matanzas">Matanzas</option>
                        <option value="Villa Clara">Villa Clara</option>
                        <option value="Cienfuegos">Cienfuegos</option>
                        <option value="Sancti Spíritus">Sancti Spíritus</option>
                        <option value="Ciego de Ávila">Ciego de Ávila</option>
                        <option value="Camagüey">Camagüey</option>
                        <option value="Las Tunas">Las Tunas</option>
                        <option value="Granma">Granma</option>
                        <option value="Holguín">Holguín</option>
                        <option value="Santiago de Cuba">Santiago de Cuba</option>
                        <option value="Guantánamo">Guantánamo</option>
                        <option value="Pinar del Río">Pinar del Río</option>
                        <option value="Isla de la Juventud">Isla de la Juventud</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Municipio <span class="required">*</span></label>
                    <select id="municipio" required>
                        <option value="">-- Seleccionar --</option>
                    </select>
                    <span class="help-text" id="municipioHelp">Selecciona primero una provincia</span>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Teléfono <span class="required">*</span></label>
                    <input type="text" id="telefono" placeholder="+53 5555-5555" required>
                </div>
                <div class="form-group">
                    <label>Dirección</label>
                    <input type="text" id="direccion" placeholder="Tu dirección">
                </div>
            </div>

            <div class="form-group">
                <label>Tipo de cuenta <span class="required">*</span></label>
                <select id="tipoUsuario" required>
                    <option value="cliente">👤 Modo Cliente</option>
                    <option value="negocio">🏢 Modo Negocio</option>
                </select>
                <span class="help-text" id="tipoHelp">Selecciona el tipo de cuenta</span>
            </div>

            <div class="negocio-fields" id="negocioFields">
                <div class="info-box">
                    <strong>🏢 Modo Negocio</strong><br>
                    Acceso a módulos especializados para gestión empresarial.
                </div>
                <div class="form-group">
                    <label>Nombre del negocio <span class="required">*</span></label>
                    <input type="text" id="nombreNegocio" placeholder="Nombre de tu negocio">
                </div>
                <div class="form-group">
                    <label>RUC / NIT</label>
                    <input type="text" id="ruc" placeholder="Número de identificación tributaria">
                </div>
                <div class="form-group">
                    <label>Descripción</label>
                    <textarea id="descripcionNegocio" rows="2" placeholder="Breve descripción de tu negocio"></textarea>
                </div>
            </div>

            <input type="hidden" id="rol" value="usuario">

            <button type="submit" class="btn">Registrarse</button>
        </form>

        <div class="link">
            ¿Ya tienes cuenta? <a href="/login">Inicia sesión aquí</a>
        </div>
    </div>

    <script>
        const municipiosPorProvincia = {
            'La Habana': ['La Habana Vieja', 'Centro Habana', 'Cerro', 'Marianao', 'Playa', 'Plaza de la Revolución', 'Diez de Octubre', 'Arroyo Naranjo', 'Boyeros', 'La Lisa', 'San Miguel del Padrón', 'Cotorro', 'Regla', 'Guanabacoa', 'Habana del Este'],
            'Artemisa': ['Artemisa', 'Bahía Honda', 'Caimito', 'Candelaria', 'Guanajay', 'Güira de Melena', 'Mariel', 'San Antonio de los Baños', 'San Cristóbal', 'Alquízar', 'Bauta', 'Surgidero de Batabanó'],
            'Mayabeque': ['San José de las Lajas', 'Bejucal', 'Jaruco', 'Madruga', 'Melena del Sur', 'Nueva Paz', 'Quivicán', 'Santa Cruz del Norte', 'Güines', 'Batabanó', 'San Nicolás de Bari'],
            'Matanzas': ['Matanzas', 'Cárdenas', 'Colón', 'Jovellanos', 'Jagüey Grande', 'Unión de Reyes', 'Pedro Betancourt', 'Perico', 'Bolívar', 'Calimete', 'Los Arabos', 'Martí', 'Varadero', 'Ciénaga de Zapata', 'Limónar'],
            'Villa Clara': ['Santa Clara', 'Placetas', 'Remedios', 'Sagua la Grande', 'Camajuaní', 'Caibarién', 'Encrucijada', 'Manicaragua', 'Quemado de Güines', 'Ranchuelo', 'Santo Domingo', 'Cifuentes', 'Corralillo', 'Zulueta'],
            'Cienfuegos': ['Cienfuegos', 'Abreus', 'Palmira', 'Cruces', 'Cumanayagua', 'Lajas', 'Aguada de Pasajeros', 'Rodas', 'Santa Isabel de las Lajas'],
            'Sancti Spíritus': ['Sancti Spíritus', 'Cabaiguán', 'Fomento', 'Jatibonico', 'La Sierpe', 'Taguasco', 'Trinidad', 'Yaguajay', 'Zaza del Medio', 'Guayos'],
            'Ciego de Ávila': ['Ciego de Ávila', 'Morón', 'Venezuela', 'Baraguá', 'Bolivia', 'Chambas', 'Ciro Redondo', 'Florencia', 'Majagua', 'Primero de Enero'],
            'Camagüey': ['Camagüey', 'Florida', 'Nuevitas', 'Esmeralda', 'Minas', 'Sibanicú', 'Guáimaro', 'Santa Cruz del Sur', 'Vertientes', 'Jimaguayú', 'Céspedes', 'Sierra de Cubitas'],
            'Las Tunas': ['Las Tunas', 'Jobabo', 'Colombia', 'Manatí', 'Puerto Padre', 'Amancio', 'Majibacoa', 'Jesús Menéndez'],
            'Granma': ['Bayamo', 'Manzanillo', 'Jiguaní', 'Yara', 'Buey Arriba', 'Cauto Cristo', 'Guisa', 'Pilón', 'Río Cauto', 'Media Luna', 'Niquero', 'Campechuela', 'Bartolomé Masó'],
            'Holguín': ['Holguín', 'Banes', 'Antilla', 'Mayarí', 'Moa', 'Sagua de Tánamo', 'Frank País', 'Gibara', 'Cacocum', 'Calix', 'Cueto', 'Rafael Freyre', 'Urbano Noris', 'Báguanos'],
            'Santiago de Cuba': ['Santiago de Cuba', 'Palma Soriano', 'Contramaestre', 'San Luis', 'Mella', 'Segundo Frente', 'Tercer Frente', 'Guamá', 'Songo-La Maya'],
            'Guantánamo': ['Guantánamo', 'Baracoa', 'Maisí', 'Imías', 'San Antonio del Sur', 'Caimanera', 'Niceto Pérez', 'Manuel Tames', 'Yateras', 'El Salvador'],
            'Pinar del Río': ['Pinar del Río', 'San Juan y Martínez', 'San Luis', 'Consolación del Sur', 'Viñales', 'Los Palacios', 'La Palma', 'Mantua', 'Minas de Matahambre', 'Guane', 'Sandino'],
            'Isla de la Juventud': ['Nueva Gerona', 'Santa Fe', 'La Demajagua', 'Cocodrilo', 'La Victoria', 'San Juan']
        };

        function cargarMunicipios() {
            const provinciaSelect = document.getElementById('provincia');
            const municipioSelect = document.getElementById('municipio');
            const municipioHelp = document.getElementById('municipioHelp');
            const provincia = provinciaSelect.value;

            municipioSelect.innerHTML = '<option value="">-- Seleccionar --</option>';

            if (provincia && municipiosPorProvincia[provincia]) {
                const municipios = municipiosPorProvincia[provincia];
                municipios.sort();
                municipios.forEach(municipio => {
                    const option = document.createElement('option');
                    option.value = municipio;
                    option.textContent = municipio;
                    municipioSelect.appendChild(option);
                });
                municipioHelp.textContent = `📌 ${municipios.length} municipios disponibles`;
                municipioHelp.style.color = '#6c3ce0';
            } else {
                municipioHelp.textContent = 'Selecciona primero una provincia';
                municipioHelp.style.color = '#666';
            }
        }

        const tipoSelect = document.getElementById('tipoUsuario');
        const negocioFields = document.getElementById('negocioFields');
        const tipoHelp = document.getElementById('tipoHelp');

        tipoSelect.addEventListener('change', function() {
            if (this.value === 'negocio') {
                negocioFields.classList.add('show');
                tipoHelp.innerHTML = '🏢 <span class="highlight">Modo Negocio</span>: Acceso a módulos de gestión';
            } else {
                negocioFields.classList.remove('show');
                tipoHelp.innerHTML = '👤 <span class="highlight">Modo Cliente</span>: Acceso a la tienda';
            }
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const nombre = document.getElementById('nombre').value.trim();
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const tipo = document.getElementById('tipoUsuario').value;
            const provincia = document.getElementById('provincia').value;
            const municipio = document.getElementById('municipio').value;
            const telefono = document.getElementById('telefono').value.trim();
            const direccion = document.getElementById('direccion').value.trim();

            const errorEl = document.getElementById('error');
            const successEl = document.getElementById('success');
            const btn = document.querySelector('.btn');

            errorEl.classList.remove('show');
            successEl.classList.remove('show');

            if (!nombre) { errorEl.textContent = 'El nombre completo es obligatorio'; errorEl.classList.add('show'); return; }
            if (!username) { errorEl.textContent = 'El nombre de usuario es obligatorio'; errorEl.classList.add('show'); return; }
            if (!email) { errorEl.textContent = 'El email es obligatorio'; errorEl.classList.add('show'); return; }
            if (password.length < 6) { errorEl.textContent = 'La contraseña debe tener al menos 6 caracteres'; errorEl.classList.add('show'); return; }
            if (!provincia || !municipio) { errorEl.textContent = 'Selecciona provincia y municipio'; errorEl.classList.add('show'); return; }
            if (!telefono) { errorEl.textContent = 'El teléfono es obligatorio'; errorEl.classList.add('show'); return; }

            const datosUsuario = { provincia, municipio, telefono, direccion: direccion || '' };

            let datosNegocio = null;
            if (tipo === 'negocio') {
                const nombreNegocio = document.getElementById('nombreNegocio').value.trim();
                if (!nombreNegocio) {
                    errorEl.textContent = 'El nombre del negocio es obligatorio';
                    errorEl.classList.add('show');
                    return;
                }
                datosNegocio = {
                    ...datosUsuario,
                    nombre_negocio: nombreNegocio,
                    ruc: document.getElementById('ruc').value.trim(),
                    descripcion: document.getElementById('descripcionNegocio').value.trim()
                };
            } else {
                datosNegocio = datosUsuario;
            }

            btn.disabled = true;
            btn.textContent = 'Registrando...';

            try {
                const response = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nombre, username, email, password, tipo, rol: 'usuario', datos_negocio: datosNegocio
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    if (data.requires_verification) {
                        successEl.textContent = '✅ Usuario registrado. Revisa tu correo.';
                        successEl.classList.add('show');
                        setTimeout(() => {
                            window.location.href = data.redirect_url || `/verificar?email=${data.email}&user_id=${data.user_id}`;
                        }, 2000);
                    } else {
                        successEl.textContent = data.message || '¡Registro exitoso!';
                        successEl.classList.add('show');
                        setTimeout(() => window.location.href = '/login', 1500);
                    }
                } else {
                    errorEl.textContent = data.error || 'Error al registrar usuario';
                    errorEl.classList.add('show');
                }
            } catch (error) {
                errorEl.textContent = 'Error de conexión con el servidor';
                errorEl.classList.add('show');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Registrarse';
            }
        });

        document.getElementById('nombre').focus();
        document.addEventListener('DOMContentLoaded', function() {
            if (document.getElementById('provincia').value) cargarMunicipios();
        });
    </script>
</body>
</html>
