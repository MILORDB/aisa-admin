<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - AIsa</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f1a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: #1a1a2e;
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo h1 { font-size: 28px; color: #6c3ce0; }
        .logo p { color: #888; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 14px; color: #aaa; }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #2a2a3e;
            border-radius: 8px;
            background: #0f0f1a;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }
        .form-group input:focus, .form-group select:focus { border-color: #6c3ce0; }
        .form-group select option { background: #1a1a2e; }
        .form-group .help-text {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
            display: block;
        }
        .form-group .help-text .highlight {
            color: #6c3ce0;
            font-weight: 600;
        }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #6c3ce0;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn:hover { background: #5a2ec0; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .link { text-align: center; margin-top: 16px; font-size: 14px; color: #888; }
        .link a { color: #6c3ce0; text-decoration: none; }
        .link a:hover { text-decoration: underline; }
        .error {
            background: #442222;
            color: #ff6b6b;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
            display: none;
        }
        .error.show { display: block; }
        .success {
            background: #224422;
            color: #6bff6b;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
            display: none;
        }
        .success.show { display: block; }
        .negocio-fields {
            display: none;
            border-top: 1px solid #2a2a3e;
            padding-top: 16px;
            margin-top: 8px;
        }
        .negocio-fields.show { display: block; }
        .info-box {
            background: rgba(108, 60, 224, 0.08);
            border: 1px solid rgba(108, 60, 224, 0.2);
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 16px;
            font-size: 13px;
            color: #aaa;
        }
        .info-box strong { color: #6c3ce0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>🤖 AIsa</h1>
            <p>Regístrate para comenzar</p>
        </div>

        <div class="error" id="error"></div>
        <div class="success" id="success"></div>

        <form id="registerForm">
            <div class="form-group">
                <label>Nombre (opcional)</label>
                <input type="text" id="nombre" placeholder="Tu nombre">
            </div>
            <div class="form-group">
                <label>Nombre de usuario *</label>
                <input type="text" id="username" placeholder="Nombre de usuario" required autofocus>
            </div>
            <div class="form-group">
                <label>Email *</label>
                <input type="email" id="email" placeholder="tu@email.com" required>
            </div>
            <div class="form-group">
                <label>Contraseña *</label>
                <input type="password" id="password" placeholder="Mínimo 6 caracteres" required minlength="6">
            </div>

            <!-- ======================================== -->
            <!-- SELECTOR DE TIPO DE USUARIO              -->
            <!-- ======================================== -->
            <div class="form-group">
                <label>Tipo de cuenta *</label>
                <select id="tipoUsuario" required>
                    <option value="cliente">👤 Modo Cliente</option>
                    <option value="negocio">🏢 Modo Negocio</option>
                </select>
                <span class="help-text" id="tipoHelp">Selecciona el tipo de cuenta que deseas crear</span>
            </div>

            <!-- ======================================== -->
            <!-- CAMPOS ADICIONALES PARA NEGOCIO          -->
            <!-- ======================================== -->
            <div class="negocio-fields" id="negocioFields">
                <div class="info-box">
                    <strong>🏢 Modo Negocio</strong><br>
                    Como negocio, podrás acceder a módulos especializados para la gestión de tu empresa.
                    Además, podrás solicitar módulos adicionales al administrador.
                </div>
                
                <div class="form-group">
                    <label>Nombre del negocio</label>
                    <input type="text" id="nombreNegocio" placeholder="Nombre de tu negocio">
                </div>
                <div class="form-group">
                    <label>RUC / NIT</label>
                    <input type="text" id="ruc" placeholder="Número de identificación tributaria">
                </div>
                <div class="form-group">
                    <label>Teléfono de contacto</label>
                    <input type="text" id="telefono" placeholder="Teléfono de contacto">
                </div>
                <div class="form-group">
                    <label>Dirección</label>
                    <input type="text" id="direccion" placeholder="Dirección del negocio">
                </div>
                <div class="form-group">
                    <label>Descripción del negocio</label>
                    <input type="text" id="descripcionNegocio" placeholder="Breve descripción de tu negocio">
                </div>
            </div>

            <button type="submit" class="btn">Registrarse</button>
        </form>

        <div class="link">
            ¿Ya tienes cuenta? <a href="/login">Inicia sesión aquí</a>
        </div>
    </div>

    <script>
        // ============================================
        // MOSTRAR/OCULTAR CAMPOS DE NEGOCIO
        // ============================================
        const tipoSelect = document.getElementById('tipoUsuario');
        const negocioFields = document.getElementById('negocioFields');
        const tipoHelp = document.getElementById('tipoHelp');

        tipoSelect.addEventListener('change', function() {
            if (this.value === 'negocio') {
                negocioFields.classList.add('show');
                tipoHelp.innerHTML = '🏢 <span class="highlight">Modo Negocio</span>: Acceso a módulos de gestión empresarial';
            } else {
                negocioFields.classList.remove('show');
                tipoHelp.innerHTML = '👤 <span class="highlight">Modo Cliente</span>: Acceso a la tienda y funciones básicas';
            }
        });

        // ============================================
        // ENVÍO DEL FORMULARIO
        // ============================================
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const nombre = document.getElementById('nombre').value.trim();
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const tipo = document.getElementById('tipoUsuario').value;
            const errorEl = document.getElementById('error');
            const successEl = document.getElementById('success');
            const btn = document.querySelector('.btn');

            errorEl.classList.remove('show');
            successEl.classList.remove('show');

            if (password.length < 6) {
                errorEl.textContent = 'La contraseña debe tener al menos 6 caracteres';
                errorEl.classList.add('show');
                return;
            }

            // Datos adicionales para negocio
            let datosNegocio = null;
            if (tipo === 'negocio') {
                datosNegocio = {
                    nombre_negocio: document.getElementById('nombreNegocio').value.trim(),
                    ruc: document.getElementById('ruc').value.trim(),
                    telefono: document.getElementById('telefono').value.trim(),
                    direccion: document.getElementById('direccion').value.trim(),
                    descripcion: document.getElementById('descripcionNegocio').value.trim()
                };
            }

            btn.disabled = true;
            btn.textContent = 'Registrando...';

            try {
                const response = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nombre,
                        username,
                        email,
                        password,
                        tipo,
                        datos_negocio: datosNegocio
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    successEl.textContent = data.message || '¡Registro exitoso!';
                    successEl.classList.add('show');
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 1500);
                } else {
                    errorEl.textContent = data.error || 'Error al registrar usuario';
                    errorEl.classList.add('show');
                }
            } catch (error) {
                errorEl.textContent = 'Error de conexión con el servidor';
                errorEl.classList.add('show');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Registrarse';
            }
        });
    </script>
</body>
</html>
