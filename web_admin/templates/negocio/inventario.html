<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inventario - AIsa Negocio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f1a;
            color: #fff;
            min-height: 100vh;
            padding: 12px;
        }
        .card {
            background: #1a1a2e;
            border-radius: 10px;
            padding: 14px;
            border: 1px solid #2a2a3e;
            margin-bottom: 12px;
        }
        .card h2 { font-size: 15px; color: #6c3ce0; margin-bottom: 12px; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 8px;
            margin-bottom: 12px;
        }
        .stat-item {
            background: #0f0f1a;
            border: 1px solid #2a2a3e;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
        }
        .stat-item .number { font-size: 20px; font-weight: 700; color: #6c3ce0; }
        .stat-item .label { font-size: 9px; color: #888; margin-top: 2px; }
        .btn {
            padding: 6px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }
        .btn-primary { background: #6c3ce0; color: #fff; }
        .btn-primary:hover { background: #5a2ec0; }
        .btn-success { background: #4caf50; color: #fff; }
        .btn-success:hover { background: #3d8b40; }
        .btn-danger { background: #f44336; color: #fff; }
        .btn-danger:hover { background: #c62828; }
        .btn-warning { background: #ff9800; color: #fff; }
        .btn-warning:hover { background: #e68900; }
        .btn-sm { padding: 3px 8px; font-size: 10px; }
        .btn-info { background: #2196f3; color: #fff; }
        .btn-info:hover { background: #1976d2; }
        .tabla {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        .tabla th {
            text-align: left;
            padding: 6px 8px;
            color: #888;
            border-bottom: 1px solid #2a2a3e;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .tabla td {
            padding: 6px 8px;
            border-bottom: 1px solid #1a1a2e;
            vertical-align: middle;
        }
        .tabla .badge {
            padding: 1px 8px;
            border-radius: 10px;
            font-size: 9px;
        }
        .tabla .badge.bajo { background: #442222; color: #ff6b6b; }
        .tabla .badge.medio { background: #443322; color: #ffbb33; }
        .tabla .badge.alto { background: #224422; color: #6bff6b; }
        .tabla .badge.agotado { background: #442222; color: #ff6b6b; font-weight: bold; }
        .tabla .badge.ganancia { background: #1a237e; color: #6bff6b; }
        .tabla .badge.comision { background: #ff9800; color: #000; }
        .form-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }
        .form-row input, .form-row select {
            padding: 6px 10px;
            border: 1px solid #2a2a3e;
            border-radius: 6px;
            background: #0f0f1a;
            color: #fff;
            font-size: 12px;
            flex: 1;
            min-width: 100px;
        }
        .form-row input:focus, .form-row select:focus {
            border-color: #6c3ce0;
            outline: none;
        }
        .form-row select option { background: #1a1a2e; }
        .form-row .costo-field {
            border-left: 2px solid #ff9800;
            padding-left: 8px;
        }
        .form-row .costo-field label {
            font-size: 10px;
            color: #ff9800;
            display: block;
            margin-bottom: 2px;
        }
        .form-row .comision-field {
            border-left: 2px solid #2196f3;
            padding-left: 8px;
        }
        .form-row .comision-field label {
            font-size: 10px;
            color: #2196f3;
            display: block;
            margin-bottom: 2px;
        }
        .form-row .comision-field .help-text {
            font-size: 9px;
            color: #666;
            margin-top: 2px;
        }
        .form-row .ganancia-preview {
            font-size: 10px;
            color: #6bff6b;
            padding: 4px 8px;
            background: rgba(76,175,80,0.1);
            border-radius: 4px;
            border: 1px solid rgba(76,175,80,0.2);
            display: none;
        }
        .form-row .ganancia-preview.show {
            display: block;
        }
        .form-row .foto-upload {
            border: 2px dashed #2a2a3e;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.3s;
            flex: 1;
            min-width: 150px;
        }
        .form-row .foto-upload:hover {
            border-color: #6c3ce0;
        }
        .form-row .foto-upload input[type="file"] {
            display: none;
        }
        .form-row .foto-upload .foto-label {
            color: #888;
            font-size: 12px;
            cursor: pointer;
        }
        .form-row .foto-upload .foto-preview {
            max-width: 100px;
            max-height: 100px;
            margin-top: 4px;
            border-radius: 4px;
            display: none;
        }
        .form-row .foto-upload .foto-preview.show {
            display: inline-block;
        }
        .search-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .search-bar input {
            flex: 1;
            padding: 6px 10px;
            border: 1px solid #2a2a3e;
            border-radius: 6px;
            background: #0f0f1a;
            color: #fff;
            font-size: 12px;
            min-width: 120px;
        }
        .search-bar input:focus { border-color: #6c3ce0; outline: none; }
        .empty { text-align: center; color: #888; padding: 30px; font-size: 13px; }
        .loading { text-align: center; color: #888; padding: 20px; font-size: 13px; }
        .mensaje-exito {
            background: #224422;
            color: #6bff6b;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 12px;
            font-size: 12px;
            display: none;
        }
        .mensaje-exito.show { display: block; }
        .mensaje-error {
            background: #442222;
            color: #ff6b6b;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 12px;
            font-size: 12px;
            display: none;
        }
        .mensaje-error.show { display: block; }
        .categoria-tag {
            display: inline-block;
            background: rgba(108, 60, 224, 0.2);
            color: #6c3ce0;
            padding: 1px 8px;
            border-radius: 10px;
            font-size: 10px;
        }
        .acciones-cell {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin: 0 -4px;
        }
        .table-wrapper table {
            min-width: 800px;
        }
        .ganancia-indicador {
            font-size: 9px;
            padding: 1px 6px;
            border-radius: 8px;
        }
        .ganancia-indicador.alta { background: rgba(76,175,80,0.15); color: #6bff6b; }
        .ganancia-indicador.media { background: rgba(255,152,0,0.15); color: #ffbb33; }
        .ganancia-indicador.baja { background: rgba(244,67,54,0.15); color: #ff6b6b; }
        .comision-tag {
            font-size: 9px;
            padding: 1px 6px;
            border-radius: 8px;
            background: rgba(33,150,243,0.15);
            color: #2196f3;
        }
        .comision-tag.sin-comision {
            background: rgba(255,255,255,0.05);
            color: #666;
        }
        .foto-producto {
            max-width: 50px;
            max-height: 50px;
            border-radius: 4px;
            object-fit: cover;
        }
        @media (max-width: 600px) {
            body { padding: 8px; }
            .card { padding: 10px; }
            .stats-grid { grid-template-columns: 1fr 1fr; gap: 4px; }
            .stat-item { padding: 6px; }
            .stat-item .number { font-size: 16px; }
            .form-row { flex-direction: column; }
            .form-row input, .form-row select { min-width: unset; }
            .search-bar { flex-direction: column; }
            .search-bar input { min-width: unset; }
            .acciones-cell { flex-direction: row; flex-wrap: wrap; }
            .acciones-cell .btn-sm { flex: 1; text-align: center; min-width: 60px; }
            .tabla { font-size: 11px; }
            .tabla th, .tabla td { padding: 4px 6px; }
        }
        @media (max-width: 400px) {
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .tabla { font-size: 10px; }
            .tabla th, .tabla td { padding: 3px 4px; }
            .acciones-cell .btn-sm { font-size: 9px; padding: 2px 6px; min-width: 45px; }
        }
    </style>
</head>
<body>

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:6px;">
        <h1 style="font-size:18px;display:flex;align-items:center;gap:8px;">📦 Inventario <span style="font-size:12px;font-weight:normal;opacity:0.7;">Gestión de productos</span></h1>
        <button class="btn btn-info btn-sm" onclick="verificarStorage()">🔍 Verificar Almacenamiento</button>
    </div>

    <div class="mensaje-error" id="mensajeError"></div>
    <div class="mensaje-exito" id="mensajeExito"></div>

    <div class="card">
        <div class="stats-grid">
            <div class="stat-item">
                <span class="number" id="totalProductos">0</span>
                <span class="label">📦 Total</span>
            </div>
            <div class="stat-item">
                <span class="number" id="productosBajo">0</span>
                <span class="label">⚠️ Bajo stock</span>
            </div>
            <div class="stat-item">
                <span class="number" id="productosAgotados">0</span>
                <span class="label">🚫 Agotados</span>
            </div>
            <div class="stat-item">
                <span class="number" id="valorInventario">$0</span>
                <span class="label">💰 Valor venta</span>
            </div>
            <div class="stat-item">
                <span class="number" id="costoInventario">$0</span>
                <span class="label">💸 Costo total</span>
            </div>
            <div class="stat-item">
                <span class="number" id="gananciaPotencial">$0</span>
                <span class="label">📈 Ganancia potencial</span>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="🔍 Buscar producto..." oninput="filtrarProductos()">
            <button class="btn btn-primary" onclick="mostrarFormulario()">+ Nuevo</button>
        </div>

        <div id="formProducto" style="display:none;border-top:1px solid #2a2a3e;padding-top:12px;margin-top:8px;">
            <h3 style="font-size:14px;margin-bottom:8px;" id="formTitle">📦 Nuevo Producto</h3>
            <div class="form-row">
                <input type="text" id="prodNombre" placeholder="Nombre">
                <select id="prodCategoria">
                    <option value="">-- Seleccionar categoría --</option>
                    <option value="electronica">Electrónica</option>
                    <option value="ropa">Ropa</option>
                    <option value="hogar">Hogar</option>
                    <option value="belleza">Belleza</option>
                    <option value="deporte">Deporte</option>
                    <option value="otros">Otros</option>
                </select>
            </div>
            <div class="form-row">
                <input type="number" id="prodPrecio" placeholder="Precio venta" step="0.01">
                <div class="costo-field" style="flex:1;">
                    <label>💰 Costo</label>
                    <input type="number" id="prodCosto" placeholder="Costo del producto" step="0.01" oninput="calcularGanancia()">
                </div>
                <div class="comision-field" style="flex:1;">
                    <label>💵 Comisión por venta</label>
                    <input type="number" id="prodComision" placeholder="Ej: 5.00" step="0.01" min="0">
                    <div class="help-text">⚠️ Opcional - Cantidad fija por unidad vendida</div>
                </div>
            </div>
            <div class="form-row">
                <input type="number" id="prodStock" placeholder="Stock">
                <input type="number" id="prodMinimo" placeholder="Mínimo">
            </div>
            <div class="form-row">
                <div class="ganancia-preview" id="gananciaPreview">
                    <span id="gananciaTexto">📈 Ganancia: $0.00 (0%)</span>
                </div>
            </div>
            <div class="form-row">
                <div class="foto-upload" onclick="document.getElementById('prodFoto').click()">
                    <input type="file" id="prodFoto" accept="image/*" onchange="previsualizarFoto(event)">
                    <div class="foto-label">📷 Haz clic para subir una foto</div>
                    <img id="fotoPreview" class="foto-preview" alt="Vista previa">
                </div>
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <!-- ⚠️ IMPORTANTE: QUITÉ EL onclick="guardarProducto()" PARA EVITAR DUPLICADOS -->
                <button class="btn btn-success" id="btnGuardar">💾 Guardar</button>
                <button class="btn btn-danger" id="btnCancelar">✕ Cancelar</button>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="table-wrapper">
            <div id="productosContainer">
                <div class="loading">Cargando productos...</div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // VARIABLES GLOBALES
        // ============================================
        let productos = [];
        let editandoId = null;

        // ============================================
        // MOSTRAR MENSAJES
        // ============================================
        function mostrarMensaje(texto, tipo) {
            const errorEl = document.getElementById('mensajeError');
            const exitoEl = document.getElementById('mensajeExito');
            errorEl.classList.remove('show');
            exitoEl.classList.remove('show');
            if (tipo === 'error') {
                errorEl.textContent = '❌ ' + texto;
                errorEl.classList.add('show');
            } else {
                exitoEl.textContent = '✅ ' + texto;
                exitoEl.classList.add('show');
            }
            console.log(`📝 ${tipo.toUpperCase()}: ${texto}`);
            setTimeout(() => {
                errorEl.classList.remove('show');
                exitoEl.classList.remove('show');
            }, 4000);
        }

        // ============================================
        // PREVISUALIZAR FOTO
        // ============================================
        function previsualizarFoto(event) {
            const file = event.target.files[0];
            if (file) {
                console.log('📷 Foto seleccionada:', file.name, file.size, file.type);
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('fotoPreview');
                    preview.src = e.target.result;
                    preview.classList.add('show');
                };
                reader.readAsDataURL(file);
            }
        }

        // ============================================
        // VERIFICAR ALMACENAMIENTO
        // ============================================
        async function verificarStorage() {
            try {
                const response = await fetch('/api/storage/estado');
                const data = await response.json();
                console.log('📁 Estado del almacenamiento:', data);
                
                let mensaje = `📁 Almacenamiento: ${data.tipo || 'Desconocido'}\n`;
                mensaje += `🔐 Autenticado: ${data.autenticado ? '✅ Sí' : '❌ No'}\n`;
                mensaje += `📂 Usando local: ${data.use_local ? '✅ Sí' : '❌ No'}`;
                
                if (data.used_gb !== undefined) {
                    mensaje += `\n📊 Espacio usado: ${data.used_gb} GB`;
                    mensaje += `\n📊 Espacio total: ${data.total_gb} GB`;
                    mensaje += `\n📊 Espacio libre: ${data.free_gb} GB`;
                }
                
                if (data.use_local) {
                    mostrarMensaje('⚠️ Usando almacenamiento LOCAL. Google Drive no configurado.', 'error');
                } else {
                    mostrarMensaje('✅ Google Drive conectado correctamente!', 'exito');
                }
                
                alert(mensaje);
            } catch (error) {
                console.error('Error:', error);
                mostrarMensaje('❌ Error verificando almacenamiento', 'error');
            }
        }

        // ============================================
        // CALCULAR GANANCIA
        // ============================================
        function calcularGanancia() {
            const precio = parseFloat(document.getElementById('prodPrecio').value) || 0;
            const costo = parseFloat(document.getElementById('prodCosto').value) || 0;
            const preview = document.getElementById('gananciaPreview');
            const texto = document.getElementById('gananciaTexto');
            
            if (costo > 0 && precio > 0) {
                const ganancia = precio - costo;
                const porcentaje = (ganancia / costo) * 100;
                preview.classList.add('show');
                let emoji = '📈';
                let color = '#6bff6b';
                if (porcentaje < 10) { emoji = '📉'; color = '#ff6b6b'; }
                else if (porcentaje < 30) { emoji = '📊'; color = '#ffbb33'; }
                texto.innerHTML = `${emoji} Ganancia: $${ganancia.toFixed(2)} (${porcentaje.toFixed(1)}%)`;
                texto.style.color = color;
            } else if (costo > 0 && precio === 0) {
                preview.classList.add('show');
                texto.innerHTML = '⚠️ Define el precio de venta';
                texto.style.color = '#ffbb33';
            } else {
                preview.classList.remove('show');
            }
        }

        // ============================================
        // CARGAR PRODUCTOS
        // ============================================
        async function cargarProductos() {
            const container = document.getElementById('productosContainer');
            container.innerHTML = '<div class="loading">Cargando...</div>';

            try {
                const response = await fetch('/api/productos');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                productos = await response.json();
                console.log('📦 Productos cargados:', productos.length);
                renderProductos();
                actualizarEstadisticas();
            } catch (error) {
                console.error('Error cargando productos:', error);
                container.innerHTML = `<div class="empty">❌ Error al cargar: ${error.message}</div>`;
            }
        }

        // ============================================
        // RENDER PRODUCTOS
        // ============================================
        function renderProductos(filtro = '') {
            const container = document.getElementById('productosContainer');
            const filtroLower = filtro.toLowerCase();
            
            const filtrados = productos.filter(p => 
                p.nombre.toLowerCase().includes(filtroLower) ||
                (p.categoria && p.categoria.toLowerCase().includes(filtroLower))
            );

            if (filtrados.length === 0) {
                container.innerHTML = `<div class="empty">No hay productos</div>`;
                return;
            }

            let html = `<table class="tabla">
                <thead><tr>
                    <th>Foto</th>
                    <th>Producto</th>
                    <th>Categoría</th>
                    <th>Precio</th>
                    <th>Costo</th>
                    <th>Ganancia</th>
                    <th>Comisión</th>
                    <th>Stock</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr></thead><tbody>`;

            filtrados.forEach(p => {
                let estado, clase;
                if (p.stock === 0) { estado = '🚫 Agotado'; clase = 'agotado'; }
                else if (p.stock <= (p.stock_minimo || 3)) { estado = '⚠️ Bajo'; clase = 'bajo'; }
                else { estado = '✅ Normal'; clase = 'alto'; }
                
                const categoriaDisplay = p.categoria || '-';
                const costo = p.costo || 0;
                const ganancia = p.precio - costo;
                const porcentaje = costo > 0 ? (ganancia / costo) * 100 : 0;
                const comision = p.comision || 0;
                const fotoHtml = p.foto_url 
                    ? `<img src="${p.foto_url}" class="foto-producto" alt="${p.nombre}" onerror="this.style.display='none'">`
                    : `<span style="color:#666;font-size:20px;">📷</span>`;
                
                let gananciaClase = 'media';
                let gananciaLabel = '📊';
                if (porcentaje > 50) { gananciaClase = 'alta'; gananciaLabel = '📈'; }
                else if (porcentaje < 10) { gananciaClase = 'baja'; gananciaLabel = '📉'; }
                
                const comisionDisplay = comision > 0 
                    ? `<span class="comision-tag">💵 $${comision.toFixed(2)}</span>`
                    : `<span class="comision-tag sin-comision">— Sin comisión</span>`;
                
                html += `
                    <tr>
                        <td>${fotoHtml}</td>
                        <td><strong>${p.nombre}</strong></td>
                        <td><span class="categoria-tag">${categoriaDisplay}</span></td>
                        <td>$${parseFloat(p.precio).toFixed(2)}</td>
                        <td>$${costo.toFixed(2)}</td>
                        <td>
                            <span class="ganancia-indicador ${gananciaClase}">
                                ${gananciaLabel} $${ganancia.toFixed(2)} (${porcentaje.toFixed(1)}%)
                            </span>
                        </td>
                        <td>${comisionDisplay}</td>
                        <td>${p.stock}</td>
                        <td><span class="badge ${clase}">${estado}</span></td>
                        <td>
                            <div class="acciones-cell">
                                <button class="btn btn-warning btn-sm" onclick="editarProducto(${p.id})">✏️</button>
                                <button class="btn btn-danger btn-sm" onclick="eliminarProducto(${p.id}, '${p.nombre.replace(/'/g, "\\'")}')">🗑️</button>
                            </div>
                        </td>
                    </tr>
                `;
            });

            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        // ============================================
        // ACTUALIZAR ESTADÍSTICAS
        // ============================================
        function actualizarEstadisticas() {
            const total = productos.length;
            const bajo = productos.filter(p => p.stock > 0 && p.stock <= (p.stock_minimo || 3)).length;
            const agotados = productos.filter(p => p.stock === 0).length;
            const valor = productos.reduce((sum, p) => sum + (parseFloat(p.precio) * p.stock), 0);
            const costoTotal = productos.reduce((sum, p) => sum + ((p.costo || 0) * p.stock), 0);
            const gananciaPotencial = valor - costoTotal;
            
            document.getElementById('totalProductos').textContent = total;
            document.getElementById('productosBajo').textContent = bajo;
            document.getElementById('productosAgotados').textContent = agotados;
            document.getElementById('valorInventario').textContent = `$${valor.toFixed(2)}`;
            document.getElementById('costoInventario').textContent = `$${costoTotal.toFixed(2)}`;
            document.getElementById('gananciaPotencial').textContent = `$${gananciaPotencial.toFixed(2)}`;
        }

        // ============================================
        // FILTRAR PRODUCTOS
        // ============================================
        function filtrarProductos() {
            renderProductos(document.getElementById('searchInput').value);
        }

        // ============================================
        // FORMULARIO
        // ============================================
        function mostrarFormulario() {
            document.getElementById('formProducto').style.display = 'block';
            document.getElementById('prodNombre').focus();
            editandoId = null;
            document.getElementById('formTitle').textContent = '📦 Nuevo Producto';
            document.getElementById('btnGuardar').textContent = '💾 Guardar';
            document.getElementById('btnGuardar').className = 'btn btn-success';
            document.getElementById('prodNombre').value = '';
            document.getElementById('prodCategoria').value = '';
            document.getElementById('prodPrecio').value = '';
            document.getElementById('prodCosto').value = '';
            document.getElementById('prodComision').value = '';
            document.getElementById('prodStock').value = '';
            document.getElementById('prodMinimo').value = '';
            document.getElementById('gananciaPreview').classList.remove('show');
            document.getElementById('fotoPreview').classList.remove('show');
            document.getElementById('fotoPreview').src = '';
            document.getElementById('prodFoto').value = '';
            document.getElementById('formProducto').scrollIntoView({ behavior: 'smooth' });
        }

        function cancelarFormulario() {
            document.getElementById('formProducto').style.display = 'none';
            editandoId = null;
        }

        function editarProducto(id) {
            const p = productos.find(p => p.id === id);
            if (!p) return;
            
            document.getElementById('formProducto').style.display = 'block';
            document.getElementById('prodNombre').value = p.nombre;
            document.getElementById('prodCategoria').value = p.categoria || '';
            document.getElementById('prodPrecio').value = p.precio;
            document.getElementById('prodCosto').value = p.costo || 0;
            document.getElementById('prodComision').value = p.comision || 0;
            document.getElementById('prodStock').value = p.stock;
            document.getElementById('prodMinimo').value = p.stock_minimo || 3;
            
            if (p.foto_url) {
                const preview = document.getElementById('fotoPreview');
                preview.src = p.foto_url;
                preview.classList.add('show');
            }
            
            editandoId = id;
            document.getElementById('formTitle').textContent = '✏️ Editar Producto';
            document.getElementById('btnGuardar').textContent = '💾 Actualizar';
            document.getElementById('btnGuardar').className = 'btn btn-warning';
            
            calcularGanancia();
            document.getElementById('formProducto').scrollIntoView({ behavior: 'smooth' });
        }

        // ============================================
        // GUARDAR PRODUCTO (CORREGIDO - SIN onclick en HTML)
        // ============================================
        async function guardarProducto() {
            const nombre = document.getElementById('prodNombre').value.trim();
            const categoria = document.getElementById('prodCategoria').value;
            const precio = parseFloat(document.getElementById('prodPrecio').value);
            const costo = parseFloat(document.getElementById('prodCosto').value) || 0;
            const comision = parseFloat(document.getElementById('prodComision').value) || 0;
            const stock = parseInt(document.getElementById('prodStock').value) || 0;
            const stock_minimo = parseInt(document.getElementById('prodMinimo').value) || 3;

            // Validaciones
            if (!nombre || !categoria || isNaN(precio) || precio <= 0) {
                mostrarMensaje('Nombre, categoría y precio son obligatorios', 'error');
                return;
            }

            const data = { nombre, categoria, precio, costo, comision, stock, stock_minimo };
            
            const btn = document.getElementById('btnGuardar');
            const textoOriginal = btn.textContent;
            
            // Deshabilitar botón para evitar doble clic
            btn.disabled = true;
            btn.textContent = '⏳ Guardando...';

            try {
                const url = editandoId ? `/api/producto/${editandoId}` : '/api/productos';
                const method = editandoId ? 'PUT' : 'POST';
                
                console.log('📤 Enviando datos producto:', data);
                
                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                console.log('📥 Respuesta producto:', result);

                if (result.success) {
                    const productoId = result.id || editandoId;
                    
                    // Subir foto si existe
                    const fotoInput = document.getElementById('prodFoto');
                    if (fotoInput && fotoInput.files && fotoInput.files.length > 0) {
                        const formData = new FormData();
                        formData.append('foto', fotoInput.files[0]);
                        
                        console.log('📤 Subiendo foto para producto:', productoId);
                        
                        try {
                            const fotoResponse = await fetch(`/api/producto/${productoId}/foto`, {
                                method: 'POST',
                                body: formData
                            });
                            
                            const fotoResult = await fotoResponse.json();
                            console.log('📥 Respuesta foto:', fotoResult);
                            
                            if (fotoResult.success) {
                                mostrarMensaje(`✅ Producto "${nombre}" guardado con foto`, 'exito');
                            } else {
                                mostrarMensaje(`✅ Producto guardado pero error al subir foto: ${fotoResult.error || 'Error desconocido'}`, 'error');
                            }
                        } catch (fotoError) {
                            console.error('❌ Error subiendo foto:', fotoError);
                            mostrarMensaje('✅ Producto guardado pero no se pudo subir la foto', 'error');
                        }
                    } else {
                        mostrarMensaje(`✅ "${nombre}" ${editandoId ? 'actualizado' : 'agregado'} correctamente`, 'exito');
                    }
                    
                    cancelarFormulario();
                    await cargarProductos();
                } else {
                    mostrarMensaje(result.error || 'Error al guardar producto', 'error');
                }
            } catch (error) {
                console.error('❌ Error:', error);
                mostrarMensaje(`❌ Error de conexión: ${error.message}`, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = textoOriginal;
            }
        }

        // ============================================
        // ELIMINAR PRODUCTO
        // ============================================
        async function eliminarProducto(id, nombre) {
            if (!confirm(`⚠️ ¿Eliminar "${nombre}"?`)) return;
            if (!confirm(`Confirmación final: ¿Eliminar "${nombre}" definitivamente?`)) return;
            
            try {
                const response = await fetch(`/api/producto/${id}`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' }
                });

                const data = await response.json();
                
                if (data.success) {
                    mostrarMensaje(`✅ "${nombre}" eliminado correctamente`, 'exito');
                    await cargarProductos();
                } else {
                    mostrarMensaje(data.error || 'Error al eliminar', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                mostrarMensaje(`❌ Error de conexión: ${error.message}`, 'error');
            }
        }

        // ============================================
        // EVENT LISTENERS (SOLO AQUÍ, NO onclick en HTML)
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            console.log('📦 Módulo de inventario cargado');
            
            // ⚠️ IMPORTANTE: Asignar event listeners SOLO aquí
            const btnGuardar = document.getElementById('btnGuardar');
            const btnCancelar = document.getElementById('btnCancelar');
            
            if (btnGuardar) {
                // Quitar cualquier evento anterior para evitar duplicados
                btnGuardar.removeEventListener('click', guardarProducto);
                btnGuardar.addEventListener('click', guardarProducto);
                console.log('✅ Event listener de guardar asignado correctamente');
            }
            if (btnCancelar) {
                btnCancelar.removeEventListener('click', cancelarFormulario);
                btnCancelar.addEventListener('click', cancelarFormulario);
                console.log('✅ Event listener de cancelar asignado correctamente');
            }
            
            // Input listeners
            const precioInput = document.getElementById('prodPrecio');
            const costoInput = document.getElementById('prodCosto');
            if (precioInput) precioInput.addEventListener('input', calcularGanancia);
            if (costoInput) costoInput.addEventListener('input', calcularGanancia);
            
            // Cargar productos iniciales
            cargarProductos();
            
            // Actualizar cada 30 segundos
            setInterval(cargarProductos, 30000);
        });
    </script>
</body>
</html>
