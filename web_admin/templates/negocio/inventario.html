<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario - AIsa Negocio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f1a;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #2a2a3e;
            margin-bottom: 20px;
        }
        .card h2 { font-size: 18px; color: #6c3ce0; margin-bottom: 16px; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }
        .stat-item {
            background: #0f0f1a;
            border: 1px solid #2a2a3e;
            border-radius: 8px;
            padding: 16px;
            text-align: center;
        }
        .stat-item .number { font-size: 24px; font-weight: 700; color: #6c3ce0; }
        .stat-item .label { font-size: 12px; color: #888; margin-top: 4px; }
        .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }
        .btn-primary { background: #6c3ce0; color: #fff; }
        .btn-primary:hover { background: #5a2ec0; }
        .btn-success { background: #4caf50; color: #fff; }
        .btn-success:hover { background: #3d8b40; }
        .btn-danger { background: #f44336; color: #fff; }
        .btn-danger:hover { background: #c62828; }
        .btn-warning { background: #ff9800; color: #fff; }
        .btn-warning:hover { background: #e68900; }
        .btn-sm { padding: 4px 12px; font-size: 11px; }
        .tabla {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .tabla th {
            text-align: left;
            padding: 8px 12px;
            color: #888;
            border-bottom: 1px solid #2a2a3e;
        }
        .tabla td {
            padding: 8px 12px;
            border-bottom: 1px solid #1a1a2e;
            vertical-align: middle;
        }
        .tabla .badge {
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 10px;
        }
        .tabla .badge.bajo { background: #442222; color: #ff6b6b; }
        .tabla .badge.medio { background: #443322; color: #ffbb33; }
        .tabla .badge.alto { background: #224422; color: #6bff6b; }
        .form-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .form-row input, .form-row select {
            padding: 8px 14px;
            border: 1px solid #2a2a3e;
            border-radius: 8px;
            background: #0f0f1a;
            color: #fff;
            font-size: 13px;
            flex: 1;
            min-width: 120px;
        }
        .form-row input:focus, .form-row select:focus {
            border-color: #6c3ce0;
            outline: none;
        }
        .form-row select option { background: #1a1a2e; }
        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .search-bar input {
            flex: 1;
            padding: 8px 14px;
            border: 1px solid #2a2a3e;
            border-radius: 8px;
            background: #0f0f1a;
            color: #fff;
            min-width: 150px;
        }
        .search-bar input:focus { border-color: #6c3ce0; outline: none; }
        .empty { text-align: center; color: #888; padding: 40px; }
        .loading { text-align: center; color: #888; padding: 20px; }
        .mensaje-exito {
            background: #224422;
            color: #6bff6b;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
        }
        .mensaje-exito.show { display: block; }
        .mensaje-error {
            background: #442222;
            color: #ff6b6b;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
        }
        .mensaje-error.show { display: block; }
        .categoria-tag {
            display: inline-block;
            background: rgba(108, 60, 224, 0.2);
            color: #6c3ce0;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
        }
        .foto-thumb {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #2a2a3e;
        }
        .foto-thumb:hover {
            border-color: #6c3ce0;
            transform: scale(1.05);
            transition: all 0.3s;
        }
        @media (max-width: 600px) {
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .form-row { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
        <h1 style="font-size:22px;display:flex;align-items:center;gap:10px;">📦 Inventario <span style="font-size:14px;font-weight:normal;opacity:0.7;">Gestión de productos</span></h1>
    </div>

    <div class="mensaje-error" id="mensajeError"></div>
    <div class="mensaje-exito" id="mensajeExito"></div>

    <div class="card">
        <div class="stats-grid">
            <div class="stat-item">
                <span class="number" id="totalProductos">0</span>
                <span class="label">📦 Total productos</span>
            </div>
            <div class="stat-item">
                <span class="number" id="productosBajo">0</span>
                <span class="label">⚠️ Stock bajo</span>
            </div>
            <div class="stat-item">
                <span class="number" id="productosAgotados">0</span>
                <span class="label">🚫 Agotados</span>
            </div>
            <div class="stat-item">
                <span class="number" id="valorInventario">$0</span>
                <span class="label">💰 Valor total</span>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="🔍 Buscar producto..." oninput="filtrarProductos()">
            <button class="btn btn-primary" onclick="mostrarFormulario()">+ Nuevo producto</button>
        </div>

        <div id="formProducto" style="display:none;border-top:1px solid #2a2a3e;padding-top:16px;margin-top:12px;">
            <h3 style="margin-bottom:12px;" id="formTitle">📦 Nuevo Producto</h3>
            <div class="form-row">
                <input type="text" id="prodNombre" placeholder="Nombre del producto">
                <select id="prodCategoria" required>
                    <option value="">-- Seleccionar categoría --</option>
                    <optgroup label="👗 Moda y Ropa">
                        <option value="ropa_mujer">Ropa de Mujer</option>
                        <option value="ropa_hombre">Ropa de Hombre</option>
                        <option value="ropa_niños">Ropa de Niños y Bebés</option>
                    </optgroup>
                    <optgroup label="👟 Calzado y Accesorios">
                        <option value="calzado_mujer">Calzado de Mujer</option>
                        <option value="calzado_hombre">Calzado de Hombre</option>
                        <option value="calzado_niños">Calzado de Niños</option>
                        <option value="joyas">Joyas y Accesorios</option>
                    </optgroup>
                    <optgroup label="💻 Electrónica y Tecnología">
                        <option value="electronica">Electrónica de Consumo</option>
                        <option value="videojuegos">Videojuegos</option>
                        <option value="audio">Audio</option>
                    </optgroup>
                    <optgroup label="🏠 Hogar y Cocina">
                        <option value="hogar">Muebles y Hogar</option>
                        <option value="decoracion">Decoración del Hogar</option>
                        <option value="cocina">Cocina y Utensilios</option>
                        <option value="almacenamiento">Almacenamiento y Organización</option>
                        <option value="mejoras_hogar">Mejoras para el Hogar</option>
                    </optgroup>
                    <optgroup label="🌿 Jardín y Bricolaje">
                        <option value="jardin">Jardín y Bricolaje</option>
                    </optgroup>
                    <optgroup label="💄 Belleza y Salud">
                        <option value="belleza">Belleza y Salud</option>
                    </optgroup>
                    <optgroup label="🏋️ Deporte y Aire Libre">
                        <option value="deporte">Deporte y Aire Libre</option>
                    </optgroup>
                    <optgroup label="🧸 Juguetes y Entretenimiento">
                        <option value="juguetes">Juguetes y Entretenimiento</option>
                    </optgroup>
                    <optgroup label="🐾 Mascotas">
                        <option value="mascotas">Mascotas</option>
                    </optgroup>
                    <optgroup label="📚 Oficina y Escuela">
                        <option value="oficina">Oficina y Escuela</option>
                    </optgroup>
                    <optgroup label="🚗 Automotriz">
                        <option value="automotriz">Automotriz</option>
                    </optgroup>
                    <optgroup label="👶 Bebé y Maternidad">
                        <option value="bebe">Bebé y Maternidad</option>
                    </optgroup>
                    <optgroup label="🎵 Música e Instrumentos">
                        <option value="musica">Música e Instrumentos</option>
                    </optgroup>
                    <optgroup label="🛍️ Otras Categorías">
                        <option value="bolsas">Bolsas y Equipaje</option>
                        <option value="manualidades">Manualidades y Arte</option>
                        <option value="industrial">Suministros Industriales</option>
                        <option value="coleccionables">Coleccionables</option>
                        <option value="musica_fisica">CDs y Discos de Vinilo</option>
                    </optgroup>
                </select>
            </div>
            <div class="form-row">
                <input type="number" id="prodPrecio" placeholder="Precio" step="0.01">
                <input type="number" id="prodStock" placeholder="Stock">
                <input type="number" id="prodMinimo" placeholder="Stock mínimo">
            </div>
            <div class="form-row">
                <div style="flex:1;">
                    <label>📷 Foto del producto</label>
                    <input type="file" id="prodFoto" accept="image/*" onchange="previewFoto()">
                    <div id="previewFoto" style="margin-top:8px;">
                        <img id="previewImage" src="" style="max-width:150px;display:none;border-radius:8px;border:2px solid #2a2a3e;">
                    </div>
                </div>
            </div>
            <div style="display:flex;gap:10px;">
                <button class="btn btn-success" onclick="guardarProducto()" id="btnGuardar">💾 Guardar</button>
                <button class="btn btn-danger" onclick="cancelarFormulario()">✕ Cancelar</button>
            </div>
        </div>
    </div>

    <div class="card">
        <div id="productosContainer">
            <div class="loading">Cargando productos...</div>
        </div>
    </div>

    <script>
        let productos = [];
        let editandoId = null;
        let archivoFoto = null;

        const categoriasMap = {
            'ropa_mujer': '👗 Ropa de Mujer',
            'ropa_hombre': '👔 Ropa de Hombre',
            'ropa_niños': '👕 Ropa de Niños',
            'calzado_mujer': '👠 Calzado de Mujer',
            'calzado_hombre': '👞 Calzado de Hombre',
            'calzado_niños': '👟 Calzado de Niños',
            'joyas': '💍 Joyas y Accesorios',
            'electronica': '💻 Electrónica',
            'videojuegos': '🎮 Videojuegos',
            'audio': '🎧 Audio',
            'hogar': '🏠 Hogar',
            'decoracion': '🖼️ Decoración',
            'cocina': '🍳 Cocina',
            'almacenamiento': '📦 Almacenamiento',
            'mejoras_hogar': '🔧 Mejoras Hogar',
            'jardin': '🌿 Jardín',
            'belleza': '💄 Belleza',
            'deporte': '🏋️ Deporte',
            'juguetes': '🧸 Juguetes',
            'mascotas': '🐾 Mascotas',
            'oficina': '📚 Oficina',
            'automotriz': '🚗 Automotriz',
            'bebe': '👶 Bebé',
            'musica': '🎵 Música',
            'bolsas': '🛍️ Bolsas',
            'manualidades': '🎨 Manualidades',
            'industrial': '🏭 Industrial',
            'coleccionables': '🌟 Coleccionables',
            'musica_fisica': '💿 CDs/Vinilos'
        };

        function mostrarMensaje(texto, tipo) {
            const errorEl = document.getElementById('mensajeError');
            const exitoEl = document.getElementById('mensajeExito');
            errorEl.classList.remove('show');
            exitoEl.classList.remove('show');
            if (tipo === 'error') {
                errorEl.textContent = '❌ ' + texto;
                errorEl.classList.add('show');
            } else {
                exitoEl.textContent = '✅ ' + texto;
                exitoEl.classList.add('show');
            }
            setTimeout(() => {
                errorEl.classList.remove('show');
                exitoEl.classList.remove('show');
            }, 5000);
        }

        async function cargarProductos() {
            const container = document.getElementById('productosContainer');
            container.innerHTML = '<div class="loading">Cargando productos...</div>';

            try {
                const response = await fetch('/api/productos');
                if (!response.ok) throw new Error('Error al cargar productos');
                productos = await response.json();
                renderProductos();
                actualizarEstadisticas();
            } catch (error) {
                console.error('Error:', error);
                container.innerHTML = `<div class="empty">❌ Error al cargar productos</div>`;
            }
        }

        function renderProductos(filtro = '') {
            const container = document.getElementById('productosContainer');
            const filtroLower = filtro.toLowerCase();
            
            const filtrados = productos.filter(p => 
                p.nombre.toLowerCase().includes(filtroLower) ||
                (p.categoria && p.categoria.toLowerCase().includes(filtroLower))
            );

            if (filtrados.length === 0) {
                container.innerHTML = `<div class="empty">No hay productos registrados</div>`;
                return;
            }

            let html = `
                <div style="overflow-x:auto;">
                    <table class="tabla">
                        <thead>
                            <tr>
                                <th>Foto</th>
                                <th>Producto</th>
                                <th>Categoría</th>
                                <th>Precio</th>
                                <th>Stock</th>
                                <th>Stock Mínimo</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            filtrados.forEach(p => {
                const estado = p.stock === 0 ? '🚫 Agotado' : 
                              p.stock <= p.stock_minimo ? '⚠️ Bajo stock' : '✅ Normal';
                const clase = p.stock === 0 ? 'agotado' : 
                             p.stock <= p.stock_minimo ? 'bajo' : 'alto';
                const categoriaDisplay = categoriasMap[p.categoria] || p.categoria || '-';
                const fotoUrl = p.foto_url || '/static/img/default_product.png';
                
                html += `
                    <tr>
                        <td>
                            <img src="${fotoUrl}" alt="${p.nombre}" class="foto-thumb" 
                                 onerror="this.src='/static/img/default_product.png'">
                        </td>
                        <td><strong>${p.nombre}</strong></td>
                        <td><span class="categoria-tag">${categoriaDisplay}</span></td>
                        <td>$${parseFloat(p.precio).toFixed(2)}</td>
                        <td>${p.stock}</td>
                        <td>${p.stock_minimo || 3}</td>
                        <td><span class="badge ${clase}">${estado}</span></td>
                        <td>
                            <button class="btn btn-warning btn-sm" onclick="editarProducto(${p.id})">✏️</button>
                            <button class="btn btn-danger btn-sm" onclick="eliminarProducto(${p.id})">🗑️</button>
                            ${p.foto_url ? `<button class="btn btn-primary btn-sm" onclick="eliminarFoto(${p.id})">📷</button>` : ''}
                        </td>
                    </tr>
                `;
            });

            html += `
                        </tbody>
                    </table>
                </div>
            `;

            container.innerHTML = html;
        }

        function actualizarEstadisticas() {
            const total = productos.length;
            const bajo = productos.filter(p => p.stock > 0 && p.stock <= (p.stock_minimo || 3)).length;
            const agotados = productos.filter(p => p.stock === 0).length;
            const valor = productos.reduce((sum, p) => sum + (parseFloat(p.precio) * p.stock), 0);
            
            document.getElementById('totalProductos').textContent = total;
            document.getElementById('productosBajo').textContent = bajo;
            document.getElementById('productosAgotados').textContent = agotados;
            document.getElementById('valorInventario').textContent = `$${valor.toFixed(2)}`;
        }

        function filtrarProductos() {
            const filtro = document.getElementById('searchInput').value;
            renderProductos(filtro);
        }

        function previewFoto() {
            const file = document.getElementById('prodFoto').files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('previewImage').src = e.target.result;
                    document.getElementById('previewImage').style.display = 'block';
                }
                reader.readAsDataURL(file);
                archivoFoto = file;
            }
        }

        function mostrarFormulario() {
            document.getElementById('formProducto').style.display = 'block';
            document.getElementById('prodNombre').focus();
            editandoId = null;
            archivoFoto = null;
            document.getElementById('previewImage').style.display = 'none';
            document.getElementById('prodFoto').value = '';
            document.getElementById('formTitle').textContent = '📦 Nuevo Producto';
            document.getElementById('btnGuardar').textContent = '💾 Guardar';
            document.getElementById('btnGuardar').className = 'btn btn-success';
        }

        function cancelarFormulario() {
            document.getElementById('formProducto').style.display = 'none';
            document.getElementById('prodNombre').value = '';
            document.getElementById('prodCategoria').value = '';
            document.getElementById('prodPrecio').value = '';
            document.getElementById('prodStock').value = '';
            document.getElementById('prodMinimo').value = '';
            document.getElementById('prodFoto').value = '';
            document.getElementById('previewImage').style.display = 'none';
            archivoFoto = null;
            editandoId = null;
        }

        function editarProducto(id) {
            const p = productos.find(p => p.id === id);
            if (!p) return;
            
            // Mostrar formulario
            document.getElementById('formProducto').style.display = 'block';
            document.getElementById('prodNombre').value = p.nombre;
            document.getElementById('prodCategoria').value = p.categoria || '';
            document.getElementById('prodPrecio').value = p.precio;
            document.getElementById('prodStock').value = p.stock;
            document.getElementById('prodMinimo').value = p.stock_minimo || 3;
            
            editandoId = id;
            archivoFoto = null;
            document.getElementById('formTitle').textContent = '✏️ Editar Producto';
            document.getElementById('btnGuardar').textContent = '💾 Actualizar';
            document.getElementById('btnGuardar').className = 'btn btn-warning';
            
            if (p.foto_url) {
                document.getElementById('previewImage').src = p.foto_url;
                document.getElementById('previewImage').style.display = 'block';
            }
            
            // Scroll al formulario
            document.getElementById('formProducto').scrollIntoView({ behavior: 'smooth' });
        }

        async function guardarProducto() {
            const nombre = document.getElementById('prodNombre').value.trim();
            const categoria = document.getElementById('prodCategoria').value;
            const precio = parseFloat(document.getElementById('prodPrecio').value);
            const stock = parseInt(document.getElementById('prodStock').value) || 0;
            const stock_minimo = parseInt(document.getElementById('prodMinimo').value) || 3;

            if (!nombre || !categoria || isNaN(precio)) {
                mostrarMensaje('Nombre, categoría y precio son obligatorios', 'error');
                return;
            }

            const data = { nombre, categoria, precio, stock, stock_minimo };

            try {
                let response;
                let result;

                // Determinar si es edición o creación
                if (editandoId) {
                    // EDITAR - PUT
                    response = await fetch(`/api/producto/${editandoId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });
                    result = await response.json();
                    
                    if (result.success) {
                        mostrarMensaje(`✅ Producto "${nombre}" actualizado correctamente`, 'exito');
                    } else {
                        mostrarMensaje(result.error || 'Error al actualizar producto', 'error');
                        return;
                    }
                } else {
                    // CREAR - POST
                    response = await fetch('/api/productos', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });
                    result = await response.json();
                    
                    if (!result.success) {
                        mostrarMensaje(result.error || 'Error al crear producto', 'error');
                        return;
                    }
                    
                    const producto_id = result.id;

                    // Si hay foto, subirla (solo en creación)
                    if (archivoFoto) {
                        const formData = new FormData();
                        formData.append('foto', archivoFoto);

                        const fotoResponse = await fetch(`/api/producto/${producto_id}/foto`, {
                            method: 'POST',
                            body: formData
                        });

                        const fotoResult = await fotoResponse.json();
                        if (fotoResult.success) {
                            mostrarMensaje('✅ Producto creado con foto', 'exito');
                        } else {
                            mostrarMensaje('⚠️ Producto creado, pero error al subir foto', 'error');
                        }
                    } else {
                        mostrarMensaje(`✅ Producto "${nombre}" creado correctamente`, 'exito');
                    }
                }

                cancelarFormulario();
                await cargarProductos();
                
            } catch (error) {
                console.error('Error:', error);
                mostrarMensaje('Error de conexión con el servidor', 'error');
            }
        }

        async function eliminarProducto(id) {
            if (!confirm('¿Eliminar este producto?')) return;
            
            try {
                const response = await fetch(`/api/producto/${id}`, {
                    method: 'DELETE'
                });
                const data = await response.json();
                if (data.success) {
                    mostrarMensaje('Producto eliminado correctamente', 'exito');
                    await cargarProductos();
                } else {
                    mostrarMensaje(data.error || 'Error al eliminar', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                mostrarMensaje('Error de conexión', 'error');
            }
        }

        async function eliminarFoto(id) {
            if (!confirm('¿Eliminar la foto de este producto?')) return;
            
            try {
                const response = await fetch(`/api/producto/${id}/foto`, {
                    method: 'DELETE'
                });
                const data = await response.json();
                if (data.success) {
                    mostrarMensaje('Foto eliminada correctamente', 'exito');
                    await cargarProductos();
                } else {
                    mostrarMensaje(data.error || 'Error al eliminar foto', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                mostrarMensaje('Error de conexión', 'error');
            }
        }

        // Inicio
        cargarProductos();
        setInterval(cargarProductos, 30000);
    </script>
</body>
</html>
