<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inventario - AIsa Negocio</title>
    <style>
        /* ... (mismo CSS que antes) ... */
    </style>
</head>
<body>

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:6px;">
        <h1 style="font-size:18px;display:flex;align-items:center;gap:8px;">📦 Inventario <span style="font-size:12px;font-weight:normal;opacity:0.7;">Gestión de productos</span></h1>
        <button class="btn btn-info btn-sm" onclick="verificarStorage()">🔍 Verificar Almacenamiento</button>
    </div>

    <div class="mensaje-error" id="mensajeError"></div>
    <div class="mensaje-exito" id="mensajeExito"></div>

    <!-- ... (estadísticas, etc.) ... -->

    <div class="card">
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="🔍 Buscar producto..." oninput="filtrarProductos()">
            <button class="btn btn-primary" onclick="mostrarFormulario()">+ Nuevo</button>
        </div>

        <div id="formProducto" style="display:none;border-top:1px solid #2a2a3e;padding-top:12px;margin-top:8px;">
            <!-- ... (formulario) ... -->
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <!-- ELIMINÉ onclick="guardarProducto()" -->
                <button class="btn btn-success" id="btnGuardar">💾 Guardar</button>
                <button class="btn btn-danger" id="btnCancelar">✕ Cancelar</button>
            </div>
        </div>
    </div>

    <!-- ... (tabla) ... -->

    <script>
        // ============================================
        // VARIABLES GLOBALES
        // ============================================
        let productos = [];
        let editandoId = null;

        // ============================================
        // MOSTRAR MENSAJES
        // ============================================
        function mostrarMensaje(texto, tipo) {
            const errorEl = document.getElementById('mensajeError');
            const exitoEl = document.getElementById('mensajeExito');
            errorEl.classList.remove('show');
            exitoEl.classList.remove('show');
            if (tipo === 'error') {
                errorEl.textContent = '❌ ' + texto;
                errorEl.classList.add('show');
            } else {
                exitoEl.textContent = '✅ ' + texto;
                exitoEl.classList.add('show');
            }
            setTimeout(() => {
                errorEl.classList.remove('show');
                exitoEl.classList.remove('show');
            }, 4000);
        }

        // ============================================
        // PREVISUALIZAR FOTO
        // ============================================
        function previsualizarFoto(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('fotoPreview');
                    preview.src = e.target.result;
                    preview.classList.add('show');
                };
                reader.readAsDataURL(file);
            }
        }

        // ============================================
        // VERIFICAR ALMACENAMIENTO
        // ============================================
        async function verificarStorage() {
            try {
                const response = await fetch('/api/storage/estado');
                const data = await response.json();
                console.log('📁 Estado del almacenamiento:', data);
                
                let mensaje = `📁 Almacenamiento: ${data.tipo || 'Desconocido'}\n`;
                mensaje += `🔐 Autenticado: ${data.autenticado ? '✅ Sí' : '❌ No'}\n`;
                mensaje += `📂 Usando local: ${data.use_local ? '✅ Sí' : '❌ No'}`;
                
                if (data.used_gb !== undefined) {
                    mensaje += `\n📊 Espacio usado: ${data.used_gb} GB`;
                    mensaje += `\n📊 Espacio total: ${data.total_gb} GB`;
                    mensaje += `\n📊 Espacio libre: ${data.free_gb} GB`;
                }
                
                if (data.use_local) {
                    mostrarMensaje('⚠️ Usando almacenamiento LOCAL. Google Drive no configurado.', 'error');
                } else {
                    mostrarMensaje('✅ Google Drive conectado correctamente!', 'exito');
                }
                
                alert(mensaje);
            } catch (error) {
                console.error('Error:', error);
                mostrarMensaje('❌ Error verificando almacenamiento', 'error');
            }
        }

        // ============================================
        // CALCULAR GANANCIA
        // ============================================
        function calcularGanancia() {
            const precio = parseFloat(document.getElementById('prodPrecio').value) || 0;
            const costo = parseFloat(document.getElementById('prodCosto').value) || 0;
            const preview = document.getElementById('gananciaPreview');
            const texto = document.getElementById('gananciaTexto');
            
            if (costo > 0 && precio > 0) {
                const ganancia = precio - costo;
                const porcentaje = (ganancia / costo) * 100;
                preview.classList.add('show');
                let emoji = '📈';
                let color = '#6bff6b';
                if (porcentaje < 10) { emoji = '📉'; color = '#ff6b6b'; }
                else if (porcentaje < 30) { emoji = '📊'; color = '#ffbb33'; }
                texto.innerHTML = `${emoji} Ganancia: $${ganancia.toFixed(2)} (${porcentaje.toFixed(1)}%)`;
                texto.style.color = color;
            } else if (costo > 0 && precio === 0) {
                preview.classList.add('show');
                texto.innerHTML = '⚠️ Define el precio de venta';
                texto.style.color = '#ffbb33';
            } else {
                preview.classList.remove('show');
            }
        }

        // ============================================
        // CARGAR PRODUCTOS
        // ============================================
        async function cargarProductos() {
            const container = document.getElementById('productosContainer');
            container.innerHTML = '<div class="loading">Cargando...</div>';

            try {
                const response = await fetch('/api/productos');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                productos = await response.json();
                renderProductos();
                actualizarEstadisticas();
            } catch (error) {
                console.error('Error cargando productos:', error);
                container.innerHTML = `<div class="empty">❌ Error al cargar: ${error.message}</div>`;
            }
        }

        // ============================================
        // RENDER PRODUCTOS
        // ============================================
        function renderProductos(filtro = '') {
            const container = document.getElementById('productosContainer');
            const filtroLower = filtro.toLowerCase();
            
            const filtrados = productos.filter(p => 
                p.nombre.toLowerCase().includes(filtroLower) ||
                (p.categoria && p.categoria.toLowerCase().includes(filtroLower))
            );

            if (filtrados.length === 0) {
                container.innerHTML = `<div class="empty">No hay productos</div>`;
                return;
            }

            let html = `<table class="tabla">
                <thead><tr>
                    <th>Foto</th>
                    <th>Producto</th>
                    <th>Categoría</th>
                    <th>Precio</th>
                    <th>Costo</th>
                    <th>Ganancia</th>
                    <th>Comisión</th>
                    <th>Stock</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr></thead><tbody>`;

            filtrados.forEach(p => {
                let estado, clase;
                if (p.stock === 0) { estado = '🚫 Agotado'; clase = 'agotado'; }
                else if (p.stock <= (p.stock_minimo || 3)) { estado = '⚠️ Bajo'; clase = 'bajo'; }
                else { estado = '✅ Normal'; clase = 'alto'; }
                
                const categoriaDisplay = p.categoria || '-';
                const costo = p.costo || 0;
                const ganancia = p.precio - costo;
                const porcentaje = costo > 0 ? (ganancia / costo) * 100 : 0;
                const comision = p.comision || 0;
                const fotoHtml = p.foto_url 
                    ? `<img src="${p.foto_url}" class="foto-producto" alt="${p.nombre}" onerror="this.style.display='none'">`
                    : `<span style="color:#666;font-size:20px;">📷</span>`;
                
                let gananciaClase = 'media';
                let gananciaLabel = '📊';
                if (porcentaje > 50) { gananciaClase = 'alta'; gananciaLabel = '📈'; }
                else if (porcentaje < 10) { gananciaClase = 'baja'; gananciaLabel = '📉'; }
                
                const comisionDisplay = comision > 0 
                    ? `<span class="comision-tag">💵 $${comision.toFixed(2)}</span>`
                    : `<span class="comision-tag sin-comision">— Sin comisión</span>`;
                
                html += `
                    <tr>
                        <td>${fotoHtml}</td>
                        <td><strong>${p.nombre}</strong></td>
                        <td><span class="categoria-tag">${categoriaDisplay}</span></td>
                        <td>$${parseFloat(p.precio).toFixed(2)}</td>
                        <td>$${costo.toFixed(2)}</td>
                        <td>
                            <span class="ganancia-indicador ${gananciaClase}">
                                ${gananciaLabel} $${ganancia.toFixed(2)} (${porcentaje.toFixed(1)}%)
                            </span>
                        </td>
                        <td>${comisionDisplay}</td>
                        <td>${p.stock}</td>
                        <td><span class="badge ${clase}">${estado}</span></td>
                        <td>
                            <div class="acciones-cell">
                                <button class="btn btn-warning btn-sm" onclick="editarProducto(${p.id})">✏️</button>
                                <button class="btn btn-danger btn-sm" onclick="eliminarProducto(${p.id}, '${p.nombre.replace(/'/g, "\\'")}')">🗑️</button>
                            </div>
                        </td>
                    </tr>
                `;
            });

            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        // ============================================
        // ACTUALIZAR ESTADÍSTICAS
        // ============================================
        function actualizarEstadisticas() {
            const total = productos.length;
            const bajo = productos.filter(p => p.stock > 0 && p.stock <= (p.stock_minimo || 3)).length;
            const agotados = productos.filter(p => p.stock === 0).length;
            const valor = productos.reduce((sum, p) => sum + (parseFloat(p.precio) * p.stock), 0);
            const costoTotal = productos.reduce((sum, p) => sum + ((p.costo || 0) * p.stock), 0);
            const gananciaPotencial = valor - costoTotal;
            
            document.getElementById('totalProductos').textContent = total;
            document.getElementById('productosBajo').textContent = bajo;
            document.getElementById('productosAgotados').textContent = agotados;
            document.getElementById('valorInventario').textContent = `$${valor.toFixed(2)}`;
            document.getElementById('costoInventario').textContent = `$${costoTotal.toFixed(2)}`;
            document.getElementById('gananciaPotencial').textContent = `$${gananciaPotencial.toFixed(2)}`;
        }

        // ============================================
        // FILTRAR PRODUCTOS
        // ============================================
        function filtrarProductos() {
            renderProductos(document.getElementById('searchInput').value);
        }

        // ============================================
        // FORMULARIO
        // ============================================
        function mostrarFormulario() {
            document.getElementById('formProducto').style.display = 'block';
            document.getElementById('prodNombre').focus();
            editandoId = null;
            document.getElementById('formTitle').textContent = '📦 Nuevo Producto';
            document.getElementById('btnGuardar').textContent = '💾 Guardar';
            document.getElementById('btnGuardar').className = 'btn btn-success';
            document.getElementById('prodNombre').value = '';
            document.getElementById('prodCategoria').value = '';
            document.getElementById('prodPrecio').value = '';
            document.getElementById('prodCosto').value = '';
            document.getElementById('prodComision').value = '';
            document.getElementById('prodStock').value = '';
            document.getElementById('prodMinimo').value = '';
            document.getElementById('gananciaPreview').classList.remove('show');
            document.getElementById('fotoPreview').classList.remove('show');
            document.getElementById('fotoPreview').src = '';
            document.getElementById('prodFoto').value = '';
            document.getElementById('formProducto').scrollIntoView({ behavior: 'smooth' });
        }

        function cancelarFormulario() {
            document.getElementById('formProducto').style.display = 'none';
            editandoId = null;
        }

        function editarProducto(id) {
            const p = productos.find(p => p.id === id);
            if (!p) return;
            
            document.getElementById('formProducto').style.display = 'block';
            document.getElementById('prodNombre').value = p.nombre;
            document.getElementById('prodCategoria').value = p.categoria || '';
            document.getElementById('prodPrecio').value = p.precio;
            document.getElementById('prodCosto').value = p.costo || 0;
            document.getElementById('prodComision').value = p.comision || 0;
            document.getElementById('prodStock').value = p.stock;
            document.getElementById('prodMinimo').value = p.stock_minimo || 3;
            
            if (p.foto_url) {
                const preview = document.getElementById('fotoPreview');
                preview.src = p.foto_url;
                preview.classList.add('show');
            }
            
            editandoId = id;
            document.getElementById('formTitle').textContent = '✏️ Editar Producto';
            document.getElementById('btnGuardar').textContent = '💾 Actualizar';
            document.getElementById('btnGuardar').className = 'btn btn-warning';
            
            calcularGanancia();
            document.getElementById('formProducto').scrollIntoView({ behavior: 'smooth' });
        }

        // ============================================
        // GUARDAR PRODUCTO (CORREGIDO)
        // ============================================
        async function guardarProducto() {
            const nombre = document.getElementById('prodNombre').value.trim();
            const categoria = document.getElementById('prodCategoria').value;
            const precio = parseFloat(document.getElementById('prodPrecio').value);
            const costo = parseFloat(document.getElementById('prodCosto').value) || 0;
            const comision = parseFloat(document.getElementById('prodComision').value) || 0;
            const stock = parseInt(document.getElementById('prodStock').value) || 0;
            const stock_minimo = parseInt(document.getElementById('prodMinimo').value) || 3;

            if (!nombre || !categoria || isNaN(precio)) {
                mostrarMensaje('Nombre, categoría y precio son obligatorios', 'error');
                return;
            }

            const data = { nombre, categoria, precio, costo, comision, stock, stock_minimo };
            
            const btn = document.getElementById('btnGuardar');
            const textoOriginal = btn.textContent;
            
            // Deshabilitar el botón para evitar doble clic
            btn.disabled = true;
            btn.textContent = '⏳ Guardando...';

            try {
                const url = editandoId ? `/api/producto/${editandoId}` : '/api/productos';
                const method = editandoId ? 'PUT' : 'POST';
                
                console.log('📤 Enviando datos:', data);
                
                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                console.log('📥 Respuesta:', result);

                if (result.success) {
                    const productoId = result.id || editandoId;
                    
                    const fotoInput = document.getElementById('prodFoto');
                    if (fotoInput && fotoInput.files && fotoInput.files.length > 0) {
                        const formData = new FormData();
                        formData.append('foto', fotoInput.files[0]);
                        
                        try {
                            const fotoResponse = await fetch(`/api/producto/${productoId}/foto`, {
                                method: 'POST',
                                body: formData
                            });
                            const fotoResult = await fotoResponse.json();
                            if (!fotoResult.success) {
                                mostrarMensaje('Producto guardado pero error al subir foto', 'warning');
                            }
                        } catch (fotoError) {
                            console.error('Error subiendo foto:', fotoError);
                            mostrarMensaje('Producto guardado pero no se pudo subir la foto', 'warning');
                        }
                    }
                    
                    mostrarMensaje(`✅ "${nombre}" ${editandoId ? 'actualizado' : 'agregado'}`, 'exito');
                    cancelarFormulario();
                    await cargarProductos();
                } else {
                    mostrarMensaje(result.error || 'Error al guardar', 'error');
                }
            } catch (error) {
                console.error('❌ Error:', error);
                mostrarMensaje(`❌ Error de conexión: ${error.message}`, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = textoOriginal;
            }
        }

        // ============================================
        // ELIMINAR PRODUCTO
        // ============================================
        async function eliminarProducto(id, nombre) {
            if (!confirm(`⚠️ ¿Eliminar "${nombre}"?`)) return;
            if (!confirm(`Confirmación final: ¿Eliminar "${nombre}"?`)) return;
            
            const btn = event?.target;
            const textoOriginal = btn ? btn.textContent : '🗑️';
            if (btn) { btn.textContent = '⏳...'; btn.disabled = true; }
            
            try {
                const response = await fetch(`/api/producto/${id}`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' }
                });

                const data = await response.json();
                
                if (data.success) {
                    mostrarMensaje(`✅ "${nombre}" eliminado`, 'exito');
                    await cargarProductos();
                } else {
                    mostrarMensaje(data.error || 'Error al eliminar', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                mostrarMensaje(`❌ Error de conexión: ${error.message}`, 'error');
            } finally {
                if (btn) { btn.textContent = textoOriginal; btn.disabled = false; }
            }
        }

        // ============================================
        // EVENT LISTENERS (SOLO AQUÍ)
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            // Asignar event listeners
            document.getElementById('btnGuardar').addEventListener('click', guardarProducto);
            document.getElementById('btnCancelar').addEventListener('click', cancelarFormulario);
            
            // Input listeners
            document.getElementById('prodPrecio').addEventListener('input', calcularGanancia);
            document.getElementById('prodCosto').addEventListener('input', calcularGanancia);
            
            // Cargar productos iniciales
            cargarProductos();
            
            // Actualizar cada 30 segundos
            setInterval(cargarProductos, 30000);
        });
    </script>
</body>
</html>
