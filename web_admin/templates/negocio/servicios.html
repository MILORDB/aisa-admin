<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Servicios - AIsa Negocio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f1a;
            color: #fff;
            min-height: 100vh;
            padding: 12px;
        }
        .card {
            background: #1a1a2e;
            border-radius: 10px;
            padding: 14px;
            border: 1px solid #2a2a3e;
            margin-bottom: 12px;
        }
        .card h2 { font-size: 15px; color: #6c3ce0; margin-bottom: 12px; }
        .btn {
            padding: 6px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }
        .btn-primary { background: #6c3ce0; color: #fff; }
        .btn-primary:hover { background: #5a2ec0; }
        .btn-success { background: #4caf50; color: #fff; }
        .btn-success:hover { background: #3d8b40; }
        .btn-danger { background: #f44336; color: #fff; }
        .btn-danger:hover { background: #c62828; }
        .btn-warning { background: #ff9800; color: #fff; }
        .btn-warning:hover { background: #e68900; }
        .btn-sm { padding: 3px 8px; font-size: 10px; }
        
        .tabla {
            width: 100%; border-collapse: collapse; font-size: 12px;
        }
        .tabla th {
            text-align: left; padding: 6px 8px; color: #888;
            border-bottom: 1px solid #2a2a3e; font-size: 10px; text-transform: uppercase;
        }
        .tabla td { padding: 6px 8px; border-bottom: 1px solid #1a1a2e; vertical-align: middle; }
        .tabla .badge {
            padding: 1px 8px; border-radius: 10px; font-size: 9px;
        }
        .tabla .badge.activo { background: #224422; color: #6bff6b; }
        .tabla .badge.inactivo { background: #442222; color: #ff6b6b; }
        
        .form-row {
            display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px;
        }
        .form-row input, .form-row select, .form-row textarea {
            padding: 6px 10px; border: 1px solid #2a2a3e; border-radius: 6px;
            background: #0f0f1a; color: #fff; font-size: 12px;
            flex: 1; min-width: 100px;
            font-family: inherit;
        }
        .form-row input:focus, .form-row select:focus, .form-row textarea:focus {
            border-color: #6c3ce0; outline: none;
        }
        .form-row select option { background: #1a1a2e; }
        .search-bar {
            display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap;
        }
        .search-bar input {
            flex: 1; padding: 6px 10px; border: 1px solid #2a2a3e; border-radius: 6px;
            background: #0f0f1a; color: #fff; font-size: 12px; min-width: 100px;
        }
        .search-bar input:focus { border-color: #6c3ce0; outline: none; }
        
        .empty { text-align: center; color: #888; padding: 30px; font-size: 13px; }
        .loading { text-align: center; color: #888; padding: 20px; font-size: 13px; }
        .mensaje-exito {
            background: #224422; color: #6bff6b;
            padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; font-size: 12px; display: none;
        }
        .mensaje-exito.show { display: block; }
        .mensaje-error {
            background: #442222; color: #ff6b6b;
            padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; font-size: 12px; display: none;
        }
        .mensaje-error.show { display: block; }
        
        .stats-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 6px;
        }
        .stat-item {
            background: #0f0f1a; border: 1px solid #2a2a3e; border-radius: 6px; padding: 8px; text-align: center;
        }
        .stat-item .number { font-size: 18px; font-weight: 700; color: #6c3ce0; }
        .stat-item .label { font-size: 8px; color: #888; margin-top: 1px; }
        .categoria-tag {
            display: inline-block; background: rgba(108,60,224,0.2);
            color: #6c3ce0; padding: 1px 8px; border-radius: 10px; font-size: 10px;
        }
        .subcategoria-tag {
            display: inline-block; background: rgba(33,150,243,0.15);
            color: #64b5f6; padding: 1px 8px; border-radius: 10px; font-size: 9px;
        }
        .acciones-cell { display: flex; gap: 4px; flex-wrap: wrap; }
        
        .table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -4px; }
        .table-wrapper table { min-width: 600px; }

        @media (max-width: 600px) {
            body { padding: 8px; }
            .card { padding: 10px; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .form-row { flex-direction: column; }
            .search-bar { flex-direction: column; }
            .acciones-cell { flex-direction: row; flex-wrap: wrap; }
            .acciones-cell .btn-sm { flex: 1; text-align: center; min-width: 50px; }
            .tabla { font-size: 11px; }
            .tabla th, .tabla td { padding: 4px 6px; }
        }
    </style>
</head>
<body>

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:6px;">
        <h1 style="font-size:18px;display:flex;align-items:center;gap:8px;">📋 Servicios <span style="font-size:12px;font-weight:normal;opacity:0.7;">Gestión de servicios</span></h1>
    </div>

    <div class="mensaje-error" id="mensajeError"></div>
    <div class="mensaje-exito" id="mensajeExito"></div>

    <div class="card">
        <div class="stats-grid">
            <div class="stat-item">
                <span class="number" id="totalServicios">0</span>
                <span class="label">📋 Total</span>
            </div>
            <div class="stat-item">
                <span class="number" id="serviciosActivos">0</span>
                <span class="label">🟢 Activos</span>
            </div>
            <div class="stat-item">
                <span class="number" id="serviciosInactivos">0</span>
                <span class="label">🔴 Inactivos</span>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="🔍 Buscar servicio..." oninput="filtrarServicios()">
            <button class="btn btn-primary" onclick="mostrarFormulario()">+ Nuevo</button>
        </div>

        <div id="formServicio" style="display:none;border-top:1px solid #2a2a3e;padding-top:12px;margin-top:8px;">
            <h3 style="font-size:14px;margin-bottom:8px;" id="formTitle">📋 Nuevo Servicio</h3>
            <div class="form-row">
                <input type="text" id="serNombre" placeholder="Nombre" required>
            </div>
            <div class="form-row">
                <select id="serCategoria" required>
                    <option value="">-- Seleccionar categoría --</option>
                </select>
                <select id="serSubcategoria">
                    <option value="">-- Seleccionar subcategoría --</option>
                </select>
            </div>
            <div class="form-row">
                <input type="number" id="serPrecio" placeholder="Precio" step="0.01" required>
                <input type="number" id="serDuracion" placeholder="Duración (min)" value="60">
                <select id="serEstado">
                    <option value="1">Activo</option>
                    <option value="0">Inactivo</option>
                </select>
            </div>
            <div class="form-row descripcion-field">
                <textarea id="serDescripcion" placeholder="Descripción del servicio (opcional)" rows="2"></textarea>
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <button class="btn btn-success" id="btnGuardar">💾 Guardar</button>
                <button class="btn btn-danger" id="btnCancelar">✕ Cancelar</button>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="table-wrapper">
            <div id="serviciosContainer">
                <div class="loading">Cargando...</div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // VARIABLES GLOBALES
        // ============================================
        let servicios = [];
        let editandoId = null;
        let categorias = [];
        let subcategorias = [];

        // ============================================
        // MOSTRAR MENSAJES
        // ============================================
        function mostrarMensaje(texto, tipo) {
            const errorEl = document.getElementById('mensajeError');
            const exitoEl = document.getElementById('mensajeExito');
            errorEl.classList.remove('show');
            exitoEl.classList.remove('show');
            if (tipo === 'error') {
                errorEl.textContent = '❌ ' + texto;
                errorEl.classList.add('show');
            } else {
                exitoEl.textContent = '✅ ' + texto;
                exitoEl.classList.add('show');
            }
            setTimeout(() => {
                errorEl.classList.remove('show');
                exitoEl.classList.remove('show');
            }, 4000);
        }

        // ============================================
        // CARGAR CATEGORÍAS
        // ============================================
        async function cargarCategorias() {
            try {
                const response = await fetch('/api/categorias');
                if (!response.ok) throw new Error('Error al cargar categorías');
                categorias = await response.json();
                console.log('📂 Categorías cargadas:', categorias.length);
                
                const select = document.getElementById('serCategoria');
                select.innerHTML = '<option value="">-- Seleccionar categoría --</option>';
                categorias.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c.id;
                    opt.textContent = `${c.icono || '📂'} ${c.nombre}`;
                    select.appendChild(opt);
                });
            } catch (error) {
                console.error('Error cargando categorías:', error);
            }
        }

        // ============================================
        // CARGAR SUBCATEGORÍAS POR CATEGORÍA
        // ============================================
        async function cargarSubcategorias(categoriaId, seleccionarId = null) {
            const select = document.getElementById('serSubcategoria');
            select.innerHTML = '<option value="">-- Seleccionar subcategoría --</option>';
            
            if (!categoriaId) return;
            
            try {
                const response = await fetch(`/api/subcategorias?categoria_id=${categoriaId}`);
                if (!response.ok) throw new Error('Error al cargar subcategorías');
                subcategorias = await response.json();
                console.log('📁 Subcategorías cargadas:', subcategorias.length);
                
                subcategorias.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.id;
                    opt.textContent = s.nombre;
                    if (seleccionarId && s.id === seleccionarId) {
                        opt.selected = true;
                    }
                    select.appendChild(opt);
                });
            } catch (error) {
                console.error('Error cargando subcategorías:', error);
            }
        }

        // ============================================
        // EVENTO DE CAMBIO DE CATEGORÍA
        // ============================================
        document.getElementById('serCategoria').addEventListener('change', function() {
            cargarSubcategorias(this.value);
        });

        // ============================================
        // CARGAR SERVICIOS
        // ============================================
        async function cargarServicios() {
            const container = document.getElementById('serviciosContainer');
            container.innerHTML = '<div class="loading">Cargando...</div>';

            try {
                const response = await fetch('/api/servicios');
                if (!response.ok) throw new Error('Error');
                servicios = await response.json();
                console.log('📋 Servicios cargados:', servicios.length);
                renderServicios();
                actualizarEstadisticas();
            } catch (error) {
                console.error('Error:', error);
                container.innerHTML = `<div class="empty">❌ Error al cargar</div>`;
            }
        }

        // ============================================
        // RENDER SERVICIOS
        // ============================================
        function renderServicios(filtro = '') {
            const container = document.getElementById('serviciosContainer');
            const filtroLower = filtro.toLowerCase();
            
            const filtrados = servicios.filter(s => 
                s.nombre.toLowerCase().includes(filtroLower) ||
                (s.categoria && s.categoria.toLowerCase().includes(filtroLower)) ||
                (s.categoria_nombre && s.categoria_nombre.toLowerCase().includes(filtroLower)) ||
                (s.subcategoria_nombre && s.subcategoria_nombre.toLowerCase().includes(filtroLower))
            );

            if (filtrados.length === 0) {
                container.innerHTML = `<div class="empty">No hay servicios</div>`;
                return;
            }

            let html = `<table class="tabla">
                <thead><tr>
                    <th>Servicio</th>
                    <th>Categoría</th>
                    <th>Subcategoría</th>
                    <th>Precio</th>
                    <th>Duración</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr></thead><tbody>`;

            filtrados.forEach(s => {
                const categoriaDisplay = s.categoria_nombre || s.categoria || '-';
                const subcategoriaDisplay = s.subcategoria_nombre || '-';
                
                html += `
                    <tr>
                        <td><strong>${s.nombre}</strong></td>
                        <td><span class="categoria-tag">${categoriaDisplay}</span></td>
                        <td>${subcategoriaDisplay !== '-' ? `<span class="subcategoria-tag">${subcategoriaDisplay}</span>` : '-'}</td>
                        <td>$${parseFloat(s.precio).toFixed(2)}</td>
                        <td>${s.duracion} min</td>
                        <td><span class="badge ${s.activo ? 'activo' : 'inactivo'}">${s.activo ? '🟢 Activo' : '🔴 Inactivo'}</span></td>
                        <td>
                            <div class="acciones-cell">
                                <button class="btn btn-warning btn-sm" onclick="toggleServicio(${s.id}, ${s.activo ? 0 : 1})">${s.activo ? '🔴' : '🟢'}</button>
                                <button class="btn btn-danger btn-sm" onclick="eliminarServicio(${s.id})">🗑️</button>
                            </div>
                        </td>
                    </tr>
                `;
            });

            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        // ============================================
        // ACTUALIZAR ESTADÍSTICAS
        // ============================================
        function actualizarEstadisticas() {
            const total = servicios.length;
            const activos = servicios.filter(s => s.activo === 1).length;
            const inactivos = total - activos;
            
            document.getElementById('totalServicios').textContent = total;
            document.getElementById('serviciosActivos').textContent = activos;
            document.getElementById('serviciosInactivos').textContent = inactivos;
        }

        // ============================================
        // FILTRAR SERVICIOS
        // ============================================
        function filtrarServicios() {
            renderServicios(document.getElementById('searchInput').value);
        }

        // ============================================
        // FORMULARIO
        // ============================================
        function mostrarFormulario() {
            document.getElementById('formServicio').style.display = 'block';
            document.getElementById('serNombre').focus();
            editandoId = null;
            document.getElementById('formTitle').textContent = '📋 Nuevo Servicio';
            document.getElementById('btnGuardar').textContent = '💾 Guardar';
            document.getElementById('btnGuardar').className = 'btn btn-success';
            document.getElementById('serNombre').value = '';
            document.getElementById('serPrecio').value = '';
            document.getElementById('serDuracion').value = '60';
            document.getElementById('serDescripcion').value = '';
            document.getElementById('serEstado').value = '1';
            
            // Cargar categorías si no están cargadas
            if (categorias.length === 0) {
                cargarCategorias();
            } else {
                // Resetear selects
                const selectCat = document.getElementById('serCategoria');
                selectCat.innerHTML = '<option value="">-- Seleccionar categoría --</option>';
                categorias.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c.id;
                    opt.textContent = `${c.icono || '📂'} ${c.nombre}`;
                    selectCat.appendChild(opt);
                });
                document.getElementById('serSubcategoria').innerHTML = '<option value="">-- Seleccionar subcategoría --</option>';
            }
            
            document.getElementById('formServicio').scrollIntoView({ behavior: 'smooth' });
        }

        function cancelarFormulario() {
            document.getElementById('formServicio').style.display = 'none';
            editandoId = null;
        }

        function editarServicio(id) {
            const s = servicios.find(s => s.id === id);
            if (!s) return;
            
            document.getElementById('formServicio').style.display = 'block';
            document.getElementById('serNombre').value = s.nombre;
            document.getElementById('serPrecio').value = s.precio;
            document.getElementById('serDuracion').value = s.duracion || 60;
            document.getElementById('serDescripcion').value = s.descripcion || '';
            document.getElementById('serEstado').value = s.activo ? '1' : '0';
            
            // Cargar categorías
            const selectCat = document.getElementById('serCategoria');
            selectCat.innerHTML = '<option value="">-- Seleccionar categoría --</option>';
            categorias.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.id;
                opt.textContent = `${c.icono || '📂'} ${c.nombre}`;
                if (s.categoria_id && c.id === s.categoria_id) {
                    opt.selected = true;
                }
                selectCat.appendChild(opt);
            });
            
            // Cargar subcategorías
            if (s.categoria_id) {
                cargarSubcategorias(s.categoria_id, s.subcategoria_id);
            } else {
                document.getElementById('serSubcategoria').innerHTML = '<option value="">-- Seleccionar subcategoría --</option>';
            }
            
            editandoId = id;
            document.getElementById('formTitle').textContent = '✏️ Editar Servicio';
            document.getElementById('btnGuardar').textContent = '💾 Actualizar';
            document.getElementById('btnGuardar').className = 'btn btn-warning';
            
            document.getElementById('formServicio').scrollIntoView({ behavior: 'smooth' });
        }

        // ============================================
        // GUARDAR SERVICIO
        // ============================================
        async function guardarServicio() {
            const nombre = document.getElementById('serNombre').value.trim();
            const categoria_id = document.getElementById('serCategoria').value;
            const subcategoria_id = document.getElementById('serSubcategoria').value || null;
            const precio = parseFloat(document.getElementById('serPrecio').value);
            const duracion = parseInt(document.getElementById('serDuracion').value) || 60;
            const activo = parseInt(document.getElementById('serEstado').value) === 1;
            const descripcion = document.getElementById('serDescripcion').value.trim();

            if (!nombre || !categoria_id || isNaN(precio) || precio <= 0) {
                mostrarMensaje('Nombre, categoría y precio son obligatorios', 'error');
                return;
            }

            const data = { 
                nombre, 
                categoria_id: parseInt(categoria_id),
                subcategoria_id: subcategoria_id ? parseInt(subcategoria_id) : null,
                precio, 
                duracion, 
                activo, 
                descripcion 
            };
            
            const btn = document.getElementById('btnGuardar');
            const textoOriginal = btn.textContent;
            btn.disabled = true;
            btn.textContent = '⏳ Guardando...';

            try {
                const url = editandoId ? `/api/servicio/${editandoId}` : '/api/servicios';
                const method = editandoId ? 'PUT' : 'POST';
                
                console.log('📤 Enviando datos:', data);
                
                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                console.log('📥 Respuesta:', result);
                
                if (result.success) {
                    mostrarMensaje(`✅ "${nombre}" ${editandoId ? 'actualizado' : 'agregado'}`, 'exito');
                    cancelarFormulario();
                    await cargarServicios();
                } else {
                    mostrarMensaje(result.error || 'Error al guardar', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                mostrarMensaje('Error de conexión: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = textoOriginal;
            }
        }

        // ============================================
        // TOGGLE SERVICIO
        // ============================================
        async function toggleServicio(id, activo) {
            try {
                const response = await fetch(`/api/servicio/${id}/toggle`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ activo })
                });
                const data = await response.json();
                if (data.success) {
                    await cargarServicios();
                } else {
                    mostrarMensaje(data.error || 'Error', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                mostrarMensaje('Error de conexión', 'error');
            }
        }

        // ============================================
        // ELIMINAR SERVICIO
        // ============================================
        async function eliminarServicio(id) {
            if (!confirm('¿Eliminar este servicio?')) return;
            try {
                const response = await fetch(`/api/servicio/${id}`, {
                    method: 'DELETE'
                });
                const data = await response.json();
                if (data.success) {
                    mostrarMensaje('✅ Eliminado', 'exito');
                    await cargarServicios();
                } else {
                    mostrarMensaje(data.error || 'Error', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                mostrarMensaje('Error de conexión', 'error');
            }
        }

        // ============================================
        // EVENT LISTENERS
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            // Asignar event listeners
            document.getElementById('btnGuardar').addEventListener('click', guardarServicio);
            document.getElementById('btnCancelar').addEventListener('click', cancelarFormulario);
            
            // Cargar categorías al inicio
            cargarCategorias();
            cargarServicios();
            
            // Actualizar cada 30 segundos
            setInterval(cargarServicios, 30000);
        });
    </script>
</body>
</html>
