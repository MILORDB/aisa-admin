<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda - AIsa Negocio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f1a;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #2a2a3e;
            margin-bottom: 20px;
        }
        .card h2 { font-size: 18px; color: #6c3ce0; margin-bottom: 16px; }
        .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }
        .btn-primary { background: #6c3ce0; color: #fff; }
        .btn-primary:hover { background: #5a2ec0; }
        .btn-success { background: #4caf50; color: #fff; }
        .btn-success:hover { background: #3d8b40; }
        .btn-danger { background: #f44336; color: #fff; }
        .btn-danger:hover { background: #c62828; }
        .btn-warning { background: #ff9800; color: #fff; }
        .btn-warning:hover { background: #e68900; }
        .btn-sm { padding: 4px 12px; font-size: 11px; }
        .productos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
        }
        .producto-card {
            background: #0f0f1a;
            border: 1px solid #2a2a3e;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            transition: all 0.3s;
            position: relative;
        }
        .producto-card:hover {
            border-color: #6c3ce0;
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(108, 60, 224, 0.15);
        }
        .producto-card .foto {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
            background: #1a1a2e;
        }
        .producto-card .nombre {
            font-size: 14px;
            font-weight: 600;
        }
        .producto-card .precio {
            font-size: 16px;
            color: #6c3ce0;
            font-weight: 700;
            margin: 4px 0;
        }
        .producto-card .stock {
            font-size: 12px;
            color: #888;
            margin-bottom: 8px;
        }
        .producto-card .stock.bajo { color: #ff6b6b; }
        .producto-card .destacado-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #ff9800;
            color: #000;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
        }
        .producto-card .acciones {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .search-bar input {
            flex: 1;
            padding: 8px 14px;
            border: 1px solid #2a2a3e;
            border-radius: 8px;
            background: #0f0f1a;
            color: #fff;
            min-width: 150px;
        }
        .search-bar input:focus { border-color: #6c3ce0; outline: none; }
        .empty { text-align: center; color: #888; padding: 40px; }
        .loading { text-align: center; color: #888; padding: 20px; }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.show { display: flex; }
        .modal-content {
            background: #1a1a2e;
            padding: 30px;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
            border: 1px solid #2a2a3e;
        }
        .modal-content h3 { margin-bottom: 16px; }
        .modal-content .form-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .modal-content .form-row select {
            flex: 1;
            padding: 8px 14px;
            border: 1px solid #2a2a3e;
            border-radius: 8px;
            background: #0f0f1a;
            color: #fff;
            min-width: 150px;
        }
        .modal-content .form-row label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #aaa;
            font-size: 13px;
        }
        .modal-content .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }
        .mensaje-exito {
            background: #224422;
            color: #6bff6b;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
        }
        .mensaje-exito.show { display: block; }
        .mensaje-error {
            background: #442222;
            color: #ff6b6b;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
        }
        .mensaje-error.show { display: block; }
        @media (max-width: 600px) {
            .productos-grid { grid-template-columns: 1fr 1fr; }
            .modal-content { padding: 20px; }
        }
    </style>
</head>
<body>

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
        <h1 style="font-size:22px;display:flex;align-items:center;gap:10px;">🛍️ Tienda <span style="font-size:14px;font-weight:normal;opacity:0.7;">Gestión de productos en venta</span></h1>
    </div>

    <div class="mensaje-error" id="mensajeError"></div>
    <div class="mensaje-exito" id="mensajeExito"></div>

    <!-- Barra de búsqueda y botón agregar -->
    <div class="card">
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="🔍 Buscar en tienda..." oninput="filtrarProductos()">
            <button class="btn btn-primary" onclick="abrirModalAgregar()">+ Agregar producto</button>
        </div>
    </div>

    <!-- Productos en tienda -->
    <div class="card">
        <h2>📦 Productos en tu tienda</h2>
        <div id="productosContainer">
            <div class="loading">Cargando productos...</div>
        </div>
    </div>

    <!-- Modal Agregar Producto -->
    <div class="modal-overlay" id="modalAgregar">
        <div class="modal-content">
            <h3>➕ Agregar producto a la tienda</h3>
            <div class="form-row">
                <select id="selectProducto">
                    <option value="">-- Seleccionar producto --</option>
                </select>
            </div>
            <div class="form-row">
                <label>
                    <input type="checkbox" id="checkDestacado"> ⭐ Destacar producto
                </label>
            </div>
            <div class="form-actions">
                <button class="btn btn-success" onclick="agregarProductoTienda()">💾 Agregar</button>
                <button class="btn btn-danger" onclick="cerrarModal()">✕ Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        let productosTienda = [];
        let productosDisponibles = [];

        // ============================================
        // FUNCIONES DE MENSAJES
        // ============================================

        function mostrarMensaje(texto, tipo) {
            const errorEl = document.getElementById('mensajeError');
            const exitoEl = document.getElementById('mensajeExito');
            errorEl.classList.remove('show');
            exitoEl.classList.remove('show');
            if (tipo === 'error') {
                errorEl.textContent = '❌ ' + texto;
                errorEl.classList.add('show');
            } else {
                exitoEl.textContent = '✅ ' + texto;
                exitoEl.classList.add('show');
            }
            setTimeout(() => {
                errorEl.classList.remove('show');
                exitoEl.classList.remove('show');
            }, 5000);
        }

        // ============================================
        // CARGAR PRODUCTOS DE LA TIENDA
        // ============================================

        async function cargarTienda() {
            const container = document.getElementById('productosContainer');
            container.innerHTML = '<div class="loading">Cargando productos...</div>';

            try {
                const response = await fetch('/api/tienda/productos');
                if (!response.ok) throw new Error('Error al cargar tienda');
                productosTienda = await response.json();
                renderTienda();
            } catch (error) {
                console.error('Error:', error);
                container.innerHTML = `<div class="empty">❌ Error al cargar productos</div>`;
            }
        }

        // ============================================
        // RENDER TIENDA
        // ============================================

        function renderTienda(filtro = '') {
            const container = document.getElementById('productosContainer');
            const filtroLower = filtro.toLowerCase();
            
            const filtrados = productosTienda.filter(p => 
                p.nombre.toLowerCase().includes(filtroLower) ||
                (p.categoria && p.categoria.toLowerCase().includes(filtroLower))
            );

            if (filtrados.length === 0) {
                container.innerHTML = `<div class="empty">No hay productos en tu tienda</div>`;
                return;
            }

            let html = '<div class="productos-grid">';
            filtrados.forEach(p => {
                const stockClass = p.stock < 5 ? 'bajo' : '';
                const stockText = p.stock > 0 ? `📦 ${p.stock} unidades` : '🚫 Agotado';
                const fotoUrl = p.foto_url || '/static/img/default_product.png';
                const destacadoHtml = p.destacado ? '<span class="destacado-badge">⭐ Destacado</span>' : '';
                
                html += `
                    <div class="producto-card">
                        ${destacadoHtml}
                        <img src="${fotoUrl}" alt="${p.nombre}" class="foto" 
                             onerror="this.src='/static/img/default_product.png'">
                        <div class="nombre">${p.nombre}</div>
                        <div class="precio">$${parseFloat(p.precio).toFixed(2)}</div>
                        <div class="stock ${stockClass}">${stockText}</div>
                        <div class="acciones">
                            <button class="btn btn-warning btn-sm" onclick="toggleDestacado(${p.id}, ${p.destacado ? 0 : 1})">
                                ${p.destacado ? '⭐' : '☆'}
                            </button>
                            <button class="btn btn-danger btn-sm" onclick="eliminarDeTienda(${p.id})">🗑️</button>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        // ============================================
        // FILTRAR
        // ============================================

        function filtrarProductos() {
            const filtro = document.getElementById('searchInput').value;
            renderTienda(filtro);
        }

        // ============================================
        // MODAL AGREGAR PRODUCTO
        // ============================================

        async function abrirModalAgregar() {
            // Cargar productos disponibles (los que no están en la tienda)
            try {
                const response = await fetch('/api/productos');
                const productos = await response.json();
                const idsEnTienda = productosTienda.map(p => p.producto_id);
                productosDisponibles = productos.filter(p => !idsEnTienda.includes(p.id));
                
                const select = document.getElementById('selectProducto');
                select.innerHTML = '<option value="">-- Seleccionar producto --</option>';
                
                if (productosDisponibles.length === 0) {
                    select.innerHTML = '<option value="">-- No hay productos disponibles --</option>';
                } else {
                    productosDisponibles.forEach(p => {
                        const opt = document.createElement('option');
                        opt.value = p.id;
                        opt.textContent = `${p.nombre} (Stock: ${p.stock})`;
                        select.appendChild(opt);
                    });
                }
                
                document.getElementById('modalAgregar').classList.add('show');
            } catch (error) {
                console.error('Error:', error);
                mostrarMensaje('Error al cargar productos disponibles', 'error');
            }
        }

        function cerrarModal() {
            document.getElementById('modalAgregar').classList.remove('show');
        }

        // ============================================
        // AGREGAR PRODUCTO A LA TIENDA
        // ============================================

        async function agregarProductoTienda() {
            const productoId = document.getElementById('selectProducto').value;
            const destacado = document.getElementById('checkDestacado').checked ? 1 : 0;

            if (!productoId) {
                mostrarMensaje('Selecciona un producto', 'error');
                return;
            }

            try {
                const response = await fetch('/api/tienda/producto/agregar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ producto_id: productoId, destacado })
                });
                const data = await response.json();

                if (data.success) {
                    mostrarMensaje('✅ Producto agregado a la tienda', 'exito');
                    cerrarModal();
                    cargarTienda();
                } else {
                    mostrarMensaje(data.error || 'Error al agregar', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                mostrarMensaje('Error de conexión', 'error');
            }
        }

        // ============================================
        // TOGGLE DESTACADO
        // ============================================

        async function toggleDestacado(tiendaId, destacado) {
            try {
                const response = await fetch(`/api/tienda/producto/${tiendaId}/destacar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ destacado })
                });
                const data = await response.json();

                if (data.success) {
                    mostrarMensaje(`Producto ${destacado ? 'destacado' : 'no destacado'}`, 'exito');
                    cargarTienda();
                } else {
                    mostrarMensaje(data.error || 'Error', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                mostrarMensaje('Error de conexión', 'error');
            }
        }

        // ============================================
        // ELIMINAR DE LA TIENDA
        // ============================================

        async function eliminarDeTienda(tiendaId) {
            if (!confirm('¿Eliminar este producto de la tienda?')) return;

            try {
                const response = await fetch(`/api/tienda/producto/${tiendaId}`, {
                    method: 'DELETE'
                });
                const data = await response.json();

                if (data.success) {
                    mostrarMensaje('✅ Producto eliminado de la tienda', 'exito');
                    cargarTienda();
                } else {
                    mostrarMensaje(data.error || 'Error al eliminar', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                mostrarMensaje('Error de conexión', 'error');
            }
        }

        // ============================================
        // INICIO
        // ============================================

        cargarTienda();
        setInterval(cargarTienda, 30000);
    </script>
</body>
</html>
