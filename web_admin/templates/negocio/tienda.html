<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tienda - AIsa Negocio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f1a;
            color: #fff;
            min-height: 100vh;
            padding: 12px;
        }
        .card {
            background: #1a1a2e;
            border-radius: 10px;
            padding: 14px;
            border: 1px solid #2a2a3e;
            margin-bottom: 12px;
        }
        .card h2 { font-size: 15px; color: #6c3ce0; margin-bottom: 12px; }
        .btn {
            padding: 6px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }
        .btn-primary { background: #6c3ce0; color: #fff; }
        .btn-primary:hover { background: #5a2ec0; }
        .btn-success { background: #4caf50; color: #fff; }
        .btn-success:hover { background: #3d8b40; }
        .btn-danger { background: #f44336; color: #fff; }
        .btn-danger:hover { background: #c62828; }
        .btn-warning { background: #ff9800; color: #fff; }
        .btn-warning:hover { background: #e68900; }
        .btn-sm { padding: 3px 8px; font-size: 10px; }
        
        .productos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 10px;
        }
        .producto-card {
            background: #0f0f1a;
            border: 1px solid #2a2a3e;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            transition: all 0.3s;
            position: relative;
        }
        .producto-card:hover {
            border-color: #6c3ce0;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(108,60,224,0.1);
        }
        .producto-card .foto-placeholder {
            width: 100%; height: 100px;
            border-radius: 6px; margin-bottom: 6px;
            background: #1a1a2e; display: flex;
            align-items: center; justify-content: center;
            font-size: 32px; color: #444;
            border: 1px dashed #2a2a3e;
        }
        .producto-card .nombre { font-size: 12px; font-weight: 600; }
        .producto-card .precio { font-size: 14px; color: #6c3ce0; font-weight: 700; margin: 2px 0; }
        .producto-card .stock { font-size: 10px; color: #888; margin-bottom: 4px; }
        .producto-card .stock.bajo { color: #ff6b6b; }
        .producto-card .destacado-badge {
            position: absolute; top: 4px; right: 4px;
            background: #ff9800; color: #000;
            padding: 1px 8px; border-radius: 10px;
            font-size: 8px; font-weight: 600;
        }
        .producto-card .acciones {
            display: flex; gap: 4px; justify-content: center; margin-top: 6px; flex-wrap: wrap;
        }
        .search-bar {
            display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap;
        }
        .search-bar input {
            flex: 1; padding: 6px 10px; border: 1px solid #2a2a3e; border-radius: 6px;
            background: #0f0f1a; color: #fff; font-size: 12px; min-width: 100px;
        }
        .search-bar input:focus { border-color: #6c3ce0; outline: none; }
        .search-bar select {
            padding: 6px 10px; border: 1px solid #2a2a3e; border-radius: 6px;
            background: #0f0f1a; color: #fff; font-size: 12px;
        }
        .empty { text-align: center; color: #888; padding: 30px; font-size: 13px; }
        .loading { text-align: center; color: #888; padding: 20px; font-size: 13px; }
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.7);
            z-index: 1000; align-items: center; justify-content: center; padding: 16px;
        }
        .modal-overlay.show { display: flex; }
        .modal-content {
            background: #1a1a2e; padding: 20px; border-radius: 10px;
            max-width: 400px; width: 100%; border: 1px solid #2a2a3e;
        }
        .modal-content h3 { font-size: 16px; margin-bottom: 8px; }
        .modal-content .form-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
        .modal-content .form-row select { flex: 1; padding: 6px 10px; border: 1px solid #2a2a3e; border-radius: 6px; background: #0f0f1a; color: #fff; font-size: 12px; min-width: 120px; }
        .modal-content .form-row label { display: flex; align-items: center; gap: 6px; color: #aaa; font-size: 12px; }
        .modal-content .form-actions { display: flex; gap: 8px; margin-top: 12px; }
        .modal-content .form-actions .btn { flex: 1; }
        .mensaje-exito {
            background: #224422; color: #6bff6b;
            padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; font-size: 12px; display: none;
        }
        .mensaje-exito.show { display: block; }
        .mensaje-error {
            background: #442222; color: #ff6b6b;
            padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; font-size: 12px; display: none;
        }
        .mensaje-error.show { display: block; }
        .stats-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 6px;
        }
        .stat-item {
            background: #0f0f1a; border: 1px solid #2a2a3e; border-radius: 6px; padding: 8px; text-align: center;
        }
        .stat-item .number { font-size: 18px; font-weight: 700; color: #6c3ce0; }
        .stat-item .label { font-size: 8px; color: #888; margin-top: 1px; }
        @media (max-width: 600px) {
            body { padding: 8px; }
            .card { padding: 10px; }
            .productos-grid { grid-template-columns: 1fr 1fr; gap: 6px; }
            .producto-card { padding: 8px; }
            .producto-card .foto-placeholder { height: 80px; font-size: 24px; }
            .search-bar { flex-direction: column; }
            .modal-content { padding: 16px; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 400px) {
            .productos-grid { grid-template-columns: 1fr; }
            .producto-card .foto-placeholder { height: 100px; }
        }
    </style>
</head>
<body>

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:6px;">
        <h1 style="font-size:18px;display:flex;align-items:center;gap:8px;">🛍️ Mi Tienda <span style="font-size:12px;font-weight:normal;opacity:0.7;">Productos en venta</span></h1>
    </div>

    <div class="mensaje-error" id="mensajeError"></div>
    <div class="mensaje-exito" id="mensajeExito"></div>

    <div class="card">
        <div class="stats-grid">
            <div class="stat-item">
                <span class="number" id="totalProductos">0</span>
                <span class="label">📦 Total</span>
            </div>
            <div class="stat-item">
                <span class="number" id="productosDestacados">0</span>
                <span class="label">⭐ Destacados</span>
            </div>
            <div class="stat-item">
                <span class="number" id="productosDisponibles">0</span>
                <span class="label">✅ Disponibles</span>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="🔍 Buscar..." oninput="filtrarProductos()">
            <select id="filtroDestacado" onchange="filtrarProductos()">
                <option value="todos">Todos</option>
                <option value="destacados">⭐ Destacados</option>
                <option value="normales">📦 Normales</option>
            </select>
            <button class="btn btn-primary" onclick="abrirModalAgregar()">+ Agregar</button>
        </div>
    </div>

    <div class="card">
        <div id="productosContainer">
            <div class="loading">Cargando...</div>
        </div>
    </div>

    <!-- Modal Agregar -->
    <div class="modal-overlay" id="modalAgregar">
        <div class="modal-content">
            <h3>➕ Agregar a la tienda</h3>
            <p style="color:#888;font-size:12px;margin-bottom:10px;">Selecciona un producto de tu inventario</p>
            <div class="form-row">
                <select id="selectProducto">
                    <option value="">-- Seleccionar --</option>
                </select>
            </div>
            <div class="form-row">
                <label><input type="checkbox" id="checkDestacado"> ⭐ Destacar</label>
            </div>
            <div class="form-actions">
                <button class="btn btn-success" onclick="agregarProductoTienda()">💾 Agregar</button>
                <button class="btn btn-danger" onclick="cerrarModal()">✕ Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        let productosTienda = [];
        let productosDisponibles = [];

        function mostrarMensaje(texto, tipo) {
            const errorEl = document.getElementById('mensajeError');
            const exitoEl = document.getElementById('mensajeExito');
            errorEl.classList.remove('show');
            exitoEl.classList.remove('show');
            if (tipo === 'error') {
                errorEl.textContent = '❌ ' + texto;
                errorEl.classList.add('show');
            } else {
                exitoEl.textContent = '✅ ' + texto;
                exitoEl.classList.add('show');
            }
            setTimeout(() => {
                errorEl.classList.remove('show');
                exitoEl.classList.remove('show');
            }, 4000);
        }

        async function cargarTienda() {
            const container = document.getElementById('productosContainer');
            container.innerHTML = '<div class="loading">Cargando...</div>';

            try {
                const response = await fetch('/api/tienda/productos');
                if (!response.ok) throw new Error('Error');
                productosTienda = await response.json();
                renderTienda();
                actualizarEstadisticas();
            } catch (error) {
                console.error('Error:', error);
                container.innerHTML = `<div class="empty">❌ Error al cargar</div>`;
            }
        }

        function renderTienda(filtro = '', destacadoFiltro = 'todos') {
            const container = document.getElementById('productosContainer');
            const filtroLower = filtro.toLowerCase();
            
            let filtrados = productosTienda.filter(p => 
                p.nombre.toLowerCase().includes(filtroLower) ||
                (p.categoria && p.categoria.toLowerCase().includes(filtroLower))
            );

            if (destacadoFiltro === 'destacados') {
                filtrados = filtrados.filter(p => p.destacado === 1);
            } else if (destacadoFiltro === 'normales') {
                filtrados = filtrados.filter(p => p.destacado === 0);
            }

            if (filtrados.length === 0) {
                container.innerHTML = `<div class="empty">No hay productos</div>`;
                return;
            }

            let html = '<div class="productos-grid">';
            filtrados.forEach(p => {
                const stockClass = p.stock < 5 ? 'bajo' : '';
                const stockText = p.stock > 0 ? `📦 ${p.stock}` : '🚫 Agotado';
                const destacadoHtml = p.destacado ? '<span class="destacado-badge">⭐</span>' : '';
                
                html += `
                    <div class="producto-card">
                        ${destacadoHtml}
                        <div class="foto-placeholder">📷</div>
                        <div class="nombre">${p.nombre}</div>
                        <div class="precio">$${parseFloat(p.precio).toFixed(2)}</div>
                        <div class="stock ${stockClass}">${stockText}</div>
                        <div class="acciones">
                            <button class="btn btn-warning btn-sm" onclick="toggleDestacado(${p.id}, ${p.destacado ? 0 : 1})">${p.destacado ? '⭐' : '☆'}</button>
                            <button class="btn btn-danger btn-sm" onclick="eliminarDeTienda(${p.id})">🗑️</button>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        function actualizarEstadisticas() {
            const total = productosTienda.length;
            const destacados = productosTienda.filter(p => p.destacado === 1).length;
            const disponibles = productosTienda.filter(p => p.stock > 0).length;
            
            document.getElementById('totalProductos').textContent = total;
            document.getElementById('productosDestacados').textContent = destacados;
            document.getElementById('productosDisponibles').textContent = disponibles;
        }

        function filtrarProductos() {
            const filtro = document.getElementById('searchInput').value;
            const destacado = document.getElementById('filtroDestacado').value;
            renderTienda(filtro, destacado);
        }

        async function abrirModalAgregar() {
            try {
                const response = await fetch('/api/productos/stock');
                if (!response.ok) throw new Error('Error');
                const productos = await response.json();
                
                const idsEnTienda = productosTienda.map(p => p.producto_id);
                productosDisponibles = productos.filter(p => !idsEnTienda.includes(p.id));
                
                const select = document.getElementById('selectProducto');
                select.innerHTML = '<option value="">-- Seleccionar --</option>';
                
                if (productosDisponibles.length === 0) {
                    select.innerHTML = '<option value="">-- Sin productos --</option>';
                } else {
                    productosDisponibles.forEach(p => {
                        const opt = document.createElement('option');
                        opt.value = p.id;
                        opt.textContent = `${p.nombre} (${p.stock})`;
                        select.appendChild(opt);
                    });
                }
                
                document.getElementById('checkDestacado').checked = false;
                document.getElementById('modalAgregar').classList.add('show');
            } catch (error) {
                console.error('Error:', error);
                mostrarMensaje('Error al cargar productos', 'error');
            }
        }

        function cerrarModal() {
            document.getElementById('modalAgregar').classList.remove('show');
        }

        document.getElementById('modalAgregar').addEventListener('click', function(e) {
            if (e.target === this) { cerrarModal(); }
        });

        async function agregarProductoTienda() {
            const productoId = document.getElementById('selectProducto').value;
            const destacado = document.getElementById('checkDestacado').checked ? 1 : 0;

            if (!productoId) {
                mostrarMensaje('Selecciona un producto', 'error');
                return;
            }

            try {
                const response = await fetch('/api/tienda/producto/agregar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ producto_id: parseInt(productoId), destacado })
                });
                
                const data = await response.json();
                if (data.success) {
                    mostrarMensaje('✅ Producto agregado', 'exito');
                    cerrarModal();
                    await cargarTienda();
                } else {
                    mostrarMensaje(data.error || 'Error', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                mostrarMensaje('Error de conexión', 'error');
            }
        }

        async function toggleDestacado(tiendaId, destacado) {
            try {
                const response = await fetch(`/api/tienda/producto/${tiendaId}/destacar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ destacado })
                });
                const data = await response.json();
                if (data.success) {
                    await cargarTienda();
                } else {
                    mostrarMensaje(data.error || 'Error', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                mostrarMensaje('Error de conexión', 'error');
            }
        }

        async function eliminarDeTienda(tiendaId) {
            if (!confirm('¿Eliminar de la tienda?')) return;

            try {
                const response = await fetch(`/api/tienda/producto/${tiendaId}`, {
                    method: 'DELETE'
                });
                const data = await response.json();
                if (data.success) {
                    mostrarMensaje('✅ Eliminado', 'exito');
                    await cargarTienda();
                } else {
                    mostrarMensaje(data.error || 'Error', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                mostrarMensaje('Error de conexión', 'error');
            }
        }

        cargarTienda();
        setInterval(cargarTienda, 30000);
    </script>
</body>
</html>
