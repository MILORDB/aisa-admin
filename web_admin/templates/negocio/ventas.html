<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventas - AIsa Negocio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f1a;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #2a2a3e;
            margin-bottom: 20px;
        }
        .card h2 { font-size: 18px; color: #6c3ce0; margin-bottom: 16px; }
        .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }
        .btn-primary { background: #6c3ce0; color: #fff; }
        .btn-primary:hover { background: #5a2ec0; }
        .btn-success { background: #4caf50; color: #fff; }
        .btn-success:hover { background: #3d8b40; }
        .btn-danger { background: #f44336; color: #fff; }
        .btn-danger:hover { background: #c62828; }
        .btn-warning { background: #ff9800; color: #fff; }
        .btn-warning:hover { background: #e68900; }
        .btn-sm { padding: 4px 12px; font-size: 11px; }
        .btn-add { 
            background: rgba(108, 60, 224, 0.2); 
            color: #6c3ce0; 
            border: 1px dashed #6c3ce0;
            padding: 4px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 36px;
            height: 36px;
            margin: 0 auto;
        }
        .btn-add:hover { 
            background: rgba(108, 60, 224, 0.4); 
            transform: scale(1.05);
        }
        .btn-remove-item {
            background: rgba(244, 67, 54, 0.15);
            color: #f44336;
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .btn-remove-item:hover {
            background: rgba(244, 67, 54, 0.3);
            transform: scale(1.1);
        }
        .tabla {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .tabla th {
            text-align: left;
            padding: 8px 12px;
            color: #888;
            border-bottom: 1px solid #2a2a3e;
        }
        .tabla td {
            padding: 8px 12px;
            border-bottom: 1px solid #1a1a2e;
            vertical-align: middle;
        }
        .tabla .badge {
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 10px;
        }
        .tabla .badge.pagado { background: #224422; color: #6bff6b; }
        .tabla .badge.pendiente { background: #443322; color: #ffbb33; }
        .tabla .badge.cancelado { background: #442222; color: #ff6b6b; }
        .form-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 12px;
            align-items: center;
        }
        .form-row input, .form-row select {
            padding: 8px 14px;
            border: 1px solid #2a2a3e;
            border-radius: 8px;
            background: #0f0f1a;
            color: #fff;
            font-size: 13px;
            flex: 1;
            min-width: 120px;
        }
        .form-row input:focus, .form-row select:focus {
            border-color: #6c3ce0;
            outline: none;
        }
        .form-row select option { background: #1a1a2e; }
        .form-row .campo-opcional label {
            font-size: 11px;
            color: #888;
            display: block;
            margin-bottom: 2px;
        }
        .form-row label {
            font-size: 12px;
            color: #aaa;
            display: block;
            margin-bottom: 2px;
        }
        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .search-bar input {
            flex: 1;
            padding: 8px 14px;
            border: 1px solid #2a2a3e;
            border-radius: 8px;
            background: #0f0f1a;
            color: #fff;
            min-width: 150px;
        }
        .search-bar input:focus { border-color: #6c3ce0; outline: none; }
        .search-bar select {
            padding: 8px 14px;
            border: 1px solid #2a2a3e;
            border-radius: 8px;
            background: #0f0f1a;
            color: #fff;
        }
        .empty { text-align: center; color: #888; padding: 40px; }
        .loading { text-align: center; color: #888; padding: 20px; }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.show { display: flex; }
        .modal-content {
            background: #1a1a2e;
            padding: 30px;
            border-radius: 12px;
            max-width: 650px;
            width: 95%;
            border: 1px solid #2a2a3e;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-content h3 { margin-bottom: 16px; }
        .modal-content .modal-subtitle {
            font-size: 12px;
            color: #888;
            margin-bottom: 16px;
        }
        .info-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .info-header .trabajador-info { font-size: 13px; color: #888; }
        .mensaje-exito {
            background: #224422;
            color: #6bff6b;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
        }
        .mensaje-exito.show { display: block; }
        .mensaje-error {
            background: #442222;
            color: #ff6b6b;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
        }
        .mensaje-error.show { display: block; }
        .stock-info {
            font-size: 11px;
            color: #888;
            margin-top: 2px;
        }
        .resumen-venta {
            background: #0f0f1a;
            border-radius: 8px;
            padding: 12px 16px;
            border: 1px solid #2a2a3e;
            margin-top: 8px;
        }
        .resumen-venta .fila {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 13px;
        }
        .resumen-venta .fila .label { color: #888; }
        .resumen-venta .fila .value { font-weight: 600; }
        .resumen-venta .fila .value.total { color: #6c3ce0; font-size: 16px; }
        .seccion-items {
            border: 1px solid #2a2a3e;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            background: #0f0f1a;
        }
        .seccion-items .seccion-titulo {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .seccion-items .seccion-titulo .badge-count {
            font-size: 11px;
            background: #2a2a3e;
            padding: 0 10px;
            border-radius: 12px;
            color: #888;
        }
        .item-line {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 6px;
            padding: 4px 8px;
            background: #1a1a2e;
            border-radius: 6px;
            flex-wrap: wrap;
        }
        .item-line .item-tipo {
            font-size: 10px;
            padding: 1px 8px;
            border-radius: 10px;
            background: rgba(108, 60, 224, 0.15);
            color: #6c3ce0;
            flex-shrink: 0;
        }
        .item-line .item-tipo.servicio {
            background: rgba(255, 152, 0, 0.15);
            color: #ff9800;
        }
        .item-line select {
            flex: 2;
            min-width: 120px;
        }
        .item-line .input-cantidad {
            width: 70px;
            flex: none;
        }
        .item-line .item-precio {
            flex: 1;
            font-size: 13px;
            text-align: right;
            color: #6c3ce0;
            font-weight: 600;
            min-width: 60px;
        }
        .item-line .item-subtotal {
            flex: 1;
            font-size: 13px;
            text-align: right;
            color: #fff;
            min-width: 60px;
        }
        .acciones-cell {
            display: flex; gap: 4px; flex-wrap: wrap;
        }
        .estado-select {
            background: #1a1a2e;
            color: #fff;
            border: 1px solid #2a2a3e;
            border-radius: 6px;
            padding: 2px 6px;
            font-size: 11px;
        }
        .total-venta {
            text-align: right;
            padding: 12px;
            border-top: 2px solid #6c3ce0;
            margin-top: 8px;
            font-size: 18px;
            font-weight: 700;
            color: #6c3ce0;
        }
        @media (max-width: 600px) {
            .form-row { flex-direction: column; }
            .search-bar { flex-direction: column; }
            .acciones-cell { flex-direction: column; }
            .acciones-cell .btn-sm { width: 100%; text-align: center; }
            .modal-content { padding: 16px; }
            .item-line { flex-wrap: wrap; }
            .item-line select { flex: 1 1 100%; }
        }
    </style>
</head>
<body>

    <div class="info-header">
        <h1 style="font-size:22px;display:flex;align-items:center;gap:10px;">💰 Ventas <span style="font-size:14px;font-weight:normal;opacity:0.7;">Gestión de ventas</span></h1>
        <div id="infoTrabajador" class="trabajador-info"></div>
    </div>

    <div class="mensaje-error" id="mensajeError"></div>
    <div class="mensaje-exito" id="mensajeExito"></div>

    <!-- Resumen de ventas por estado -->
    <div class="card">
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;">
            <div style="background:#0f0f1a;border:1px solid #2a2a3e;border-radius:8px;padding:12px;text-align:center;">
                <div style="font-size:24px;font-weight:700;color:#6c3ce0;" id="totalVentas">0</div>
                <div style="font-size:12px;color:#888;">📊 Total ventas</div>
            </div>
            <div style="background:#0f0f1a;border:1px solid #2a2a3e;border-radius:8px;padding:12px;text-align:center;">
                <div style="font-size:24px;font-weight:700;color:#6bff6b;" id="totalPagado">0</div>
                <div style="font-size:12px;color:#888;">✅ Pagadas</div>
            </div>
            <div style="background:#0f0f1a;border:1px solid #2a2a3e;border-radius:8px;padding:12px;text-align:center;">
                <div style="font-size:24px;font-weight:700;color:#ffbb33;" id="totalPendiente">0</div>
                <div style="font-size:12px;color:#888;">⏳ Pendientes</div>
            </div>
            <div style="background:#0f0f1a;border:1px solid #2a2a3e;border-radius:8px;padding:12px;text-align:center;">
                <div style="font-size:24px;font-weight:700;color:#ff6b6b;" id="totalCancelado">0</div>
                <div style="font-size:12px;color:#888;">❌ Canceladas</div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="🔍 Buscar venta..." oninput="filtrarVentas()">
            <select id="filtroEstado" onchange="filtrarVentas()">
                <option value="todos">Todos los estados</option>
                <option value="pagado">✅ Pagado</option>
                <option value="pendiente">⏳ Pendiente</option>
                <option value="cancelado">❌ Cancelado</option>
            </select>
            <button class="btn btn-primary" onclick="nuevaVenta()">+ Nueva venta</button>
        </div>
    </div>

    <!-- Modal Nueva Venta -->
    <div class="modal-overlay" id="modalVenta">
        <div class="modal-content">
            <h3>💰 Nueva Venta</h3>
            <div class="modal-subtitle">Agrega productos y/o servicios a la venta</div>

            <!-- Empresa (opcional) -->
            <div class="form-row campo-opcional">
                <div style="flex:1;">
                    <label>🏢 Empresa / TCP / MIPYME <span style="color:#666;">(opcional)</span></label>
                    <input type="text" id="ventaEmpresa" placeholder="Nombre de la empresa o TCP">
                </div>
            </div>

            <!-- Productos -->
            <div class="seccion-items">
                <div class="seccion-titulo">
                    <span>📦 Productos</span>
                    <span class="badge-count" id="countProductos">0</span>
                </div>
                <div id="productosContainer">
                    <!-- Los productos se agregan aquí dinámicamente -->
                </div>
                <div style="display:flex;justify-content:center;margin-top:8px;">
                    <button class="btn-add" onclick="agregarLineaProducto()" title="Agregar producto">➕</button>
                </div>
            </div>

            <!-- Servicios -->
            <div class="seccion-items">
                <div class="seccion-titulo">
                    <span>📋 Servicios</span>
                    <span class="badge-count" id="countServicios">0</span>
                </div>
                <div id="serviciosContainer">
                    <!-- Los servicios se agregan aquí dinámicamente -->
                </div>
                <div style="display:flex;justify-content:center;margin-top:8px;">
                    <button class="btn-add" onclick="agregarLineaServicio()" title="Agregar servicio">➕</button>
                </div>
            </div>

            <!-- Resumen de la venta -->
            <div class="resumen-venta">
                <div class="fila">
                    <span class="label">📌 Estado:</span>
                    <span class="value" id="resumenEstado">✅ Pagado</span>
                </div>
                <div class="fila" style="border-top:1px solid #2a2a3e;padding-top:8px;margin-top:4px;">
                    <span class="label">💰 Total:</span>
                    <span class="value total" id="resumenTotal">$0.00</span>
                </div>
            </div>

            <div class="form-row" style="border-top:1px solid #2a2a3e;padding-top:12px;margin-top:8px;">
                <div style="flex:1;min-width:150px;">
                    <label>📌 Estado de pago</label>
                    <select id="ventaEstado" onchange="actualizarResumen()">
                        <option value="pagado" style="color:#6bff6b;">✅ Pagado</option>
                        <option value="pendiente" style="color:#ffbb33;">⏳ Pendiente</option>
                        <option value="cancelado" style="color:#ff6b6b;">❌ Cancelado</option>
                    </select>
                </div>
            </div>

            <input type="hidden" id="ventaTrabajador" value="">

            <div style="display:flex;gap:10px;margin-top:12px;border-top:1px solid #2a2a3e;padding-top:12px;">
                <button class="btn btn-success" onclick="guardarVenta()" style="flex:1;" id="btnGuardarVenta">💾 Guardar venta</button>
                <button class="btn btn-danger" onclick="cerrarModal()" style="flex:1;">✕ Cancelar</button>
            </div>
        </div>
    </div>

    <!-- Tabla de ventas -->
    <div class="card">
        <div id="ventasContainer">
            <div class="loading">Cargando ventas...</div>
        </div>
    </div>

    <script>
        let ventas = [];
        let productos = [];
        let servicios = [];
        let trabajadorId = null;
        let lineasProductos = [];
        let lineasServicios = [];
        let nextId = 1;
        let datosCargados = false;

        // ============================================
        // INICIALIZACIÓN
        // ============================================

        function getTrabajadorId() {
            const params = new URLSearchParams(window.location.search);
            return params.get('trabajador_id');
        }

        function mostrarInfoTrabajador() {
            const id = getTrabajadorId();
            if (id) {
                trabajadorId = id;
                document.getElementById('infoTrabajador').textContent = '👤 Trabajador ID: ' + id;
                document.getElementById('ventaTrabajador').value = id;
            }
        }

        function mostrarMensaje(texto, tipo) {
            const errorEl = document.getElementById('mensajeError');
            const exitoEl = document.getElementById('mensajeExito');
            errorEl.classList.remove('show');
            exitoEl.classList.remove('show');
            if (tipo === 'error') {
                errorEl.textContent = '❌ ' + texto;
                errorEl.classList.add('show');
            } else {
                exitoEl.textContent = '✅ ' + texto;
                exitoEl.classList.add('show');
            }
            setTimeout(() => {
                errorEl.classList.remove('show');
                exitoEl.classList.remove('show');
            }, 5000);
        }

        // ============================================
        // CARGAR PRODUCTOS Y SERVICIOS (FUNCIONES GLOBALES)
        // ============================================

        async function cargarProductos() {
            try {
                const response = await fetch('/api/productos/stock');
                if (!response.ok) throw new Error('Error al cargar productos');
                productos = await response.json();
                console.log('✅ Productos cargados:', productos.length);
                return true;
            } catch (error) {
                console.error('Error al cargar productos:', error);
                return false;
            }
        }

        async function cargarServicios() {
            try {
                const response = await fetch('/api/servicios');
                if (!response.ok) throw new Error('Error al cargar servicios');
                servicios = await response.json();
                servicios = servicios.filter(s => s.activo === 1);
                console.log('✅ Servicios cargados:', servicios.length);
                return true;
            } catch (error) {
                console.error('Error al cargar servicios:', error);
                return false;
            }
        }

        function actualizarSelectoresProductos() {
            console.log('🔄 Actualizando selectores de productos...');
            document.querySelectorAll('.select-producto').forEach(select => {
                const valorActual = select.value;
                while (select.options.length > 1) {
                    select.remove(1);
                }
                
                const productosConStock = productos.filter(p => p.stock > 0);
                if (productosConStock.length === 0) {
                    const opt = document.createElement('option');
                    opt.value = '';
                    opt.textContent = '-- Sin productos con stock --';
                    opt.disabled = true;
                    select.appendChild(opt);
                    return;
                }
                
                productosConStock.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p.id;
                    opt.textContent = `${p.nombre} (Stock: ${p.stock})`;
                    opt.dataset.precio = p.precio;
                    opt.dataset.stock = p.stock;
                    select.appendChild(opt);
                });
                
                if (valorActual) {
                    select.value = valorActual;
                }
            });
            
            // Actualizar precios de líneas existentes
            document.querySelectorAll('.select-producto').forEach(select => {
                const id = select.dataset.lineaId;
                if (id) {
                    actualizarLineaProducto(parseInt(id));
                }
            });
        }

        function actualizarSelectoresServicios() {
            console.log('🔄 Actualizando selectores de servicios...');
            document.querySelectorAll('.select-servicio').forEach(select => {
                const valorActual = select.value;
                while (select.options.length > 1) {
                    select.remove(1);
                }
                
                if (servicios.length === 0) {
                    const opt = document.createElement('option');
                    opt.value = '';
                    opt.textContent = '-- Sin servicios activos --';
                    opt.disabled = true;
                    select.appendChild(opt);
                    return;
                }
                
                servicios.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.id;
                    opt.textContent = s.nombre;
                    opt.dataset.precio = s.precio;
                    select.appendChild(opt);
                });
                
                if (valorActual) {
                    select.value = valorActual;
                }
            });
            
            // Actualizar precios de líneas existentes
            document.querySelectorAll('.select-servicio').forEach(select => {
                const id = select.dataset.lineaId;
                if (id) {
                    actualizarLineaServicio(parseInt(id));
                }
            });
        }

        // ============================================
        // AGREGAR LÍNEAS DE PRODUCTOS Y SERVICIOS
        // ============================================

        function agregarLineaProducto() {
            console.log('➕ Agregando línea de producto...');
            const container = document.getElementById('productosContainer');
            const id = nextId++;
            const html = `
                <div class="item-line" id="producto-line-${id}">
                    <span class="item-tipo">📦</span>
                    <select class="select-producto" data-linea-id="${id}" onchange="actualizarLineaProducto(${id})">
                        <option value="">-- Seleccionar --</option>
                    </select>
                    <input type="number" class="input-cantidad" data-linea-id="${id}" value="1" min="1" onchange="actualizarLineaProducto(${id})" style="width:70px;flex:none;">
                    <span class="item-precio" id="producto-precio-${id}">$0.00</span>
                    <span class="item-subtotal" id="producto-subtotal-${id}">$0.00</span>
                    <button class="btn-remove-item" onclick="eliminarLinea('producto', ${id})">✕</button>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', html);
            
            // Actualizar selectores con datos si ya están cargados
            if (productos.length > 0) {
                actualizarSelectoresProductos();
            } else {
                console.log('⏳ Productos no cargados aún, se actualizarán cuando estén listos');
            }
            
            lineasProductos.push({ id, tipo: 'producto' });
            document.getElementById('countProductos').textContent = lineasProductos.length;
            actualizarResumen();
        }

        function agregarLineaServicio() {
            console.log('➕ Agregando línea de servicio...');
            const container = document.getElementById('serviciosContainer');
            const id = nextId++;
            const html = `
                <div class="item-line" id="servicio-line-${id}">
                    <span class="item-tipo servicio">📋</span>
                    <select class="select-servicio" data-linea-id="${id}" onchange="actualizarLineaServicio(${id})">
                        <option value="">-- Seleccionar --</option>
                    </select>
                    <span class="item-precio" id="servicio-precio-${id}">$0.00</span>
                    <span class="item-subtotal" id="servicio-subtotal-${id}">$0.00</span>
                    <button class="btn-remove-item" onclick="eliminarLinea('servicio', ${id})">✕</button>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', html);
            
            if (servicios.length > 0) {
                actualizarSelectoresServicios();
            } else {
                console.log('⏳ Servicios no cargados aún, se actualizarán cuando estén listos');
            }
            
            lineasServicios.push({ id, tipo: 'servicio' });
            document.getElementById('countServicios').textContent = lineasServicios.length;
            actualizarResumen();
        }

        // ============================================
        // ACTUALIZAR LÍNEA
        // ============================================

        function actualizarLineaProducto(id) {
            const select = document.querySelector(`.select-producto[data-linea-id="${id}"]`);
            const cantidadInput = document.querySelector(`.input-cantidad[data-linea-id="${id}"]`);
            const precioSpan = document.getElementById(`producto-precio-${id}`);
            const subtotalSpan = document.getElementById(`producto-subtotal-${id}`);
            
            if (!select) return;
            
            const selected = select.options[select.selectedIndex];
            const cantidad = parseInt(cantidadInput ? cantidadInput.value : 1) || 1;
            
            if (selected && selected.value) {
                const precio = parseFloat(selected.dataset.precio) || 0;
                const stock = parseInt(selected.dataset.stock) || 0;
                const subtotal = precio * cantidad;
                
                precioSpan.textContent = `$${precio.toFixed(2)}`;
                subtotalSpan.textContent = `$${subtotal.toFixed(2)}`;
                
                if (cantidad > stock) {
                    mostrarMensaje(`⚠️ Stock insuficiente. Disponible: ${stock} unidades`, 'error');
                }
            } else {
                precioSpan.textContent = '$0.00';
                subtotalSpan.textContent = '$0.00';
            }
            
            actualizarResumen();
        }

        function actualizarLineaServicio(id) {
            const select = document.querySelector(`.select-servicio[data-linea-id="${id}"]`);
            const precioSpan = document.getElementById(`servicio-precio-${id}`);
            const subtotalSpan = document.getElementById(`servicio-subtotal-${id}`);
            
            if (!select) return;
            
            const selected = select.options[select.selectedIndex];
            
            if (selected && selected.value) {
                const precio = parseFloat(selected.dataset.precio) || 0;
                precioSpan.textContent = `$${precio.toFixed(2)}`;
                subtotalSpan.textContent = `$${precio.toFixed(2)}`;
            } else {
                precioSpan.textContent = '$0.00';
                subtotalSpan.textContent = '$0.00';
            }
            
            actualizarResumen();
        }

        // ============================================
        // ELIMINAR LÍNEA
        // ============================================

        function eliminarLinea(tipo, id) {
            const lineId = `${tipo}-line-${id}`;
            const line = document.getElementById(lineId);
            if (line) {
                line.remove();
                
                if (tipo === 'producto') {
                    lineasProductos = lineasProductos.filter(l => l.id !== id);
                    document.getElementById('countProductos').textContent = lineasProductos.length;
                } else {
                    lineasServicios = lineasServicios.filter(l => l.id !== id);
                    document.getElementById('countServicios').textContent = lineasServicios.length;
                }
            }
            actualizarResumen();
        }

        // ============================================
        // ACTUALIZAR RESUMEN
        // ============================================

        function actualizarResumen() {
            let total = 0;
            
            document.querySelectorAll('#productosContainer .item-line').forEach(line => {
                const subtotalSpan = line.querySelector('.item-subtotal');
                if (subtotalSpan) {
                    const valor = parseFloat(subtotalSpan.textContent.replace('$', '')) || 0;
                    total += valor;
                }
            });
            
            document.querySelectorAll('#serviciosContainer .item-line').forEach(line => {
                const subtotalSpan = line.querySelector('.item-subtotal');
                if (subtotalSpan) {
                    const valor = parseFloat(subtotalSpan.textContent.replace('$', '')) || 0;
                    total += valor;
                }
            });
            
            document.getElementById('resumenTotal').textContent = `$${total.toFixed(2)}`;
            
            const estado = document.getElementById('ventaEstado').value;
            const estados = {
                'pagado': '✅ Pagado',
                'pendiente': '⏳ Pendiente',
                'cancelado': '❌ Cancelado'
            };
            const colores = {
                'pagado': '#6bff6b',
                'pendiente': '#ffbb33',
                'cancelado': '#ff6b6b'
            };
            document.getElementById('resumenEstado').innerHTML = `<span style="color:${colores[estado]}">${estados[estado]}</span>`;
        }

        // ============================================
        // CARGAR VENTAS
        // ============================================

        async function cargarVentas() {
            const container = document.getElementById('ventasContainer');
            container.innerHTML = '<div class="loading">Cargando ventas...</div>';

            try {
                const url = trabajadorId ? `/api/ventas?trabajador_id=${trabajadorId}` : '/api/ventas';
                const response = await fetch(url);
                if (!response.ok) throw new Error('Error al cargar ventas');
                ventas = await response.json();
                renderVentas();
                actualizarResumenVentas();
            } catch (error) {
                console.error('Error:', error);
                container.innerHTML = `<div class="empty">❌ Error al cargar ventas</div>`;
            }
        }

        // ============================================
        // RENDER VENTAS
        // ============================================

        function renderVentas(filtro = '', estadoFiltro = 'todos') {
            const container = document.getElementById('ventasContainer');
            const filtroLower = filtro.toLowerCase();
            
            let filtrados = ventas.filter(v => 
                v.cliente.toLowerCase().includes(filtroLower) ||
                v.producto.toLowerCase().includes(filtroLower) ||
                String(v.id).includes(filtroLower) ||
                (v.empresa && v.empresa.toLowerCase().includes(filtroLower))
            );

            if (estadoFiltro !== 'todos') {
                filtrados = filtrados.filter(v => v.estado === estadoFiltro);
            }

            if (filtrados.length === 0) {
                container.innerHTML = `<div class="empty">No hay ventas registradas</div>`;
                return;
            }

            let html = `
                <div style="overflow-x:auto;">
                    <table class="tabla">
                        <thead>
                            <tr>
                                <th># Venta</th>
                                <th>Cliente</th>
                                <th>Empresa</th>
                                <th>Productos/Servicios</th>
                                <th>Total</th>
                                <th>Fecha</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            filtrados.forEach(v => {
                const estados = { 
                    'pagado': '✅ Pagado', 
                    'pendiente': '⏳ Pendiente', 
                    'cancelado': '❌ Cancelado' 
                };
                const clases = { 
                    'pagado': 'pagado', 
                    'pendiente': 'pendiente', 
                    'cancelado': 'cancelado' 
                };
                
                html += `
                    <tr>
                        <td><strong>#${v.id}</strong></td>
                        <td>${v.cliente}</td>
                        <td>${v.empresa || '-'}</td>
                        <td>${v.producto}</td>
                        <td>$${parseFloat(v.total).toFixed(2)}</td>
                        <td>${v.fecha}</td>
                        <td><span class="badge ${clases[v.estado]}">${estados[v.estado]}</span></td>
                        <td>
                            <div class="acciones-cell">
                                <select onchange="cambiarEstadoVenta(${v.id}, this.value)" class="estado-select">
                                    <option value="pagado" ${v.estado === 'pagado' ? 'selected' : ''}>✅ Pagado</option>
                                    <option value="pendiente" ${v.estado === 'pendiente' ? 'selected' : ''}>⏳ Pendiente</option>
                                    <option value="cancelado" ${v.estado === 'cancelado' ? 'selected' : ''}>❌ Cancelado</option>
                                </select>
                                <button class="btn btn-danger btn-sm" onclick="eliminarVenta(${v.id})">🗑️</button>
                            </div>
                        </td>
                    </tr>
                `;
            });

            html += `
                        </tbody>
                    </table>
                </div>
            `;

            container.innerHTML = html;
        }

        // ============================================
        // ACTUALIZAR RESUMEN DE VENTAS
        // ============================================

        function actualizarResumenVentas() {
            const total = ventas.length;
            const pagado = ventas.filter(v => v.estado === 'pagado').length;
            const pendiente = ventas.filter(v => v.estado === 'pendiente').length;
            const cancelado = ventas.filter(v => v.estado === 'cancelado').length;
            
            document.getElementById('totalVentas').textContent = total;
            document.getElementById('totalPagado').textContent = pagado;
            document.getElementById('totalPendiente').textContent = pendiente;
            document.getElementById('totalCancelado').textContent = cancelado;
        }

        // ============================================
        // FILTRAR
        // ============================================

        function filtrarVentas() {
            const filtro = document.getElementById('searchInput').value;
            const estado = document.getElementById('filtroEstado').value;
            renderVentas(filtro, estado);
        }

        // ============================================
        // NUEVA VENTA - ABRIR MODAL (CORREGIDO)
        // ============================================

        async function nuevaVenta() {
            console.log('🔄 Abriendo modal de nueva venta...');
            
            // Mostrar loading en el botón
            const btn = event ? event.target : document.querySelector('.btn-primary');
            if (btn) {
                btn.disabled = true;
                btn.textContent = '⏳ Cargando...';
            }
            
            // Resetear
            document.getElementById('ventaEmpresa').value = '';
            document.getElementById('ventaEstado').value = 'pagado';
            
            // Limpiar contenedores
            document.getElementById('productosContainer').innerHTML = '';
            document.getElementById('serviciosContainer').innerHTML = '';
            lineasProductos = [];
            lineasServicios = [];
            document.getElementById('countProductos').textContent = '0';
            document.getElementById('countServicios').textContent = '0';
            nextId = 1;
            
            // Cargar productos y servicios ANTES de abrir el modal
            console.log('📦 Cargando productos...');
            await cargarProductos();
            console.log('📋 Cargando servicios...');
            await cargarServicios();
            
            // Agregar una línea por defecto DESPUÉS de cargar los datos
            console.log('➕ Agregando línea de producto por defecto...');
            agregarLineaProducto();
            
            // Forzar actualización de selectores
            if (productos.length > 0) {
                actualizarSelectoresProductos();
            }
            if (servicios.length > 0) {
                actualizarSelectoresServicios();
            }
            
            actualizarResumen();
            
            // Abrir modal
            document.getElementById('modalVenta').classList.add('show');
            document.getElementById('ventaEmpresa').focus();
            
            // Restaurar botón
            if (btn) {
                btn.disabled = false;
                btn.textContent = '+ Nueva venta';
            }
            
            console.log('✅ Modal abierto correctamente');
        }

        function cerrarModal() {
            document.getElementById('modalVenta').classList.remove('show');
        }

        // ============================================
        // GUARDAR VENTA
        // ============================================

        function guardarVenta() {
            const empresa = document.getElementById('ventaEmpresa').value.trim();
            const estado = document.getElementById('ventaEstado').value;
            
            let items = [];
            
            document.querySelectorAll('#productosContainer .item-line').forEach(line => {
                const select = line.querySelector('.select-producto');
                const cantidadInput = line.querySelector('.input-cantidad');
                if (select && select.value) {
                    const selected = select.options[select.selectedIndex];
                    const cantidad = parseInt(cantidadInput ? cantidadInput.value : 1) || 1;
                    const precio = parseFloat(selected.dataset.precio) || 0;
                    items.push({
                        tipo: 'producto',
                        id: parseInt(select.value),
                        nombre: selected.text.split('(')[0].trim(),
                        cantidad: cantidad,
                        precio: precio,
                        subtotal: precio * cantidad
                    });
                }
            });
            
            document.querySelectorAll('#serviciosContainer .item-line').forEach(line => {
                const select = line.querySelector('.select-servicio');
                if (select && select.value) {
                    const selected = select.options[select.selectedIndex];
                    const precio = parseFloat(selected.dataset.precio) || 0;
                    items.push({
                        tipo: 'servicio',
                        id: parseInt(select.value),
                        nombre: selected.text,
                        cantidad: 1,
                        precio: precio,
                        subtotal: precio
                    });
                }
            });
            
            if (items.length === 0) {
                mostrarMensaje('❌ Agrega al menos un producto o servicio', 'error');
                return;
            }
            
            const total = items.reduce((sum, item) => sum + item.subtotal, 0);
            const cliente = empresa || 'Cliente sin empresa';
            const nombres = items.map(item => `${item.cantidad}x ${item.nombre}`).join(', ');
            const primerItem = items[0];
            
            const data = {
                cliente: cliente,
                producto: nombres,
                producto_id: primerItem.id,
                cantidad: items.reduce((sum, item) => sum + item.cantidad, 0),
                precio: total,
                total: total,
                empresa: empresa || null,
                tipo: items.length === 1 && items[0].tipo === 'servicio' ? 'servicio' : 'producto',
                trabajador_id: trabajadorId || null,
                estado: estado
            };

            fetch('/api/ventas', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    mostrarMensaje(`✅ Venta registrada correctamente`, 'exito');
                    cerrarModal();
                    cargarVentas();
                    cargarProductos();
                } else {
                    mostrarMensaje(data.error || 'Error al registrar la venta', 'error');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                mostrarMensaje('Error de conexión con el servidor', 'error');
            });
        }

        // ============================================
        // CAMBIAR ESTADO DE VENTA
        // ============================================

        function cambiarEstadoVenta(id, estado) {
            const venta = ventas.find(v => v.id === id);
            if (!venta) return;
            
            if (venta.estado === estado) return;
            
            const estados = {
                'pagado': '✅ Pagado',
                'pendiente': '⏳ Pendiente',
                'cancelado': '❌ Cancelado'
            };
            
            if (!confirm(`¿Cambiar el estado de la venta #${id} de "${estados[venta.estado]}" a "${estados[estado]}"?`)) {
                cargarVentas();
                return;
            }

            fetch(`/api/venta/${id}/estado`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ estado: estado })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    mostrarMensaje(`✅ Estado actualizado a "${estados[estado]}"`, 'exito');
                    cargarVentas();
                } else {
                    mostrarMensaje(data.error || 'Error al actualizar estado', 'error');
                    cargarVentas();
                }
            })
            .catch(error => {
                console.error('Error:', error);
                mostrarMensaje('Error de conexión con el servidor', 'error');
                cargarVentas();
            });
        }

        // ============================================
        // ELIMINAR VENTA
        // ============================================

        async function eliminarVenta(id) {
            const venta = ventas.find(v => v.id === id);
            if (!venta) return;
            
            const estados = {
                'pagado': '✅ Pagado',
                'pendiente': '⏳ Pendiente',
                'cancelado': '❌ Cancelado'
            };
            
            if (!confirm(`⚠️ ¿Estás seguro de eliminar esta venta?\n\n📋 Cliente: ${venta.cliente}\n📦 Producto: ${venta.producto}\n💰 Total: $${parseFloat(venta.total).toFixed(2)}\n📌 Estado: ${estados[venta.estado]}`)) {
                return;
            }
            
            try {
                const response = await fetch(`/api/venta/${id}`, {
                    method: 'DELETE'
                });
                
                const data = await response.json();
                
                if (data.success) {
                    mostrarMensaje(`✅ Venta #${id} eliminada. Stock reintegrado.`, 'exito');
                    await cargarVentas();
                    await cargarProductos();
                } else {
                    mostrarMensaje(`❌ Error: ${data.error || 'Error desconocido'}`, 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                mostrarMensaje('❌ Error de conexión', 'error');
            }
        }

        // ============================================
        // INICIO
        // ============================================

        mostrarInfoTrabajador();
        cargarVentas();
        
        // Cargar productos y servicios en segundo plano para tenerlos listos
        cargarProductos();
        cargarServicios();
        
        setInterval(() => {
            cargarProductos();
            cargarServicios();
            cargarVentas();
        }, 30000);
    </script>
</body>
</html>
