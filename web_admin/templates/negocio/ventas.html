<script>
    let ventas = [];
    let trabajadorId = null;
    let editandoId = null;

    // ============================================
    // OBTENER TRABAJADOR ID
    // ============================================
    function getTrabajadorId() {
        const params = new URLSearchParams(window.location.search);
        return params.get('trabajador_id');
    }

    // Inicializar variables
    trabajadorId = getTrabajadorId();

    // ============================================
    // MOSTRAR MENSAJES
    // ============================================
    function mostrarMensaje(texto, tipo) {
        const errorEl = document.getElementById('mensajeError');
        const exitoEl = document.getElementById('mensajeExito');
        errorEl.classList.remove('show');
        exitoEl.classList.remove('show');
        if (tipo === 'error') {
            errorEl.textContent = '❌ ' + texto;
            errorEl.classList.add('show');
        } else {
            exitoEl.textContent = '✅ ' + texto;
            exitoEl.classList.add('show');
        }
        setTimeout(() => {
            errorEl.classList.remove('show');
            exitoEl.classList.remove('show');
        }, 4000);
    }

    // ============================================
    // CARGAR VENTAS
    // ============================================
    async function cargarVentas() {
        const container = document.getElementById('ventasContainer');
        container.innerHTML = '<div class="loading">Cargando...</div>';
        try {
            const url = trabajadorId ? `/api/ventas?trabajador_id=${trabajadorId}` : '/api/ventas';
            console.log('📊 Cargando ventas desde:', url); // Para depurar
            
            const response = await fetch(url);
            if (!response.ok) throw new Error('Error al cargar ventas');
            ventas = await response.json();
            console.log('📊 Ventas cargadas:', ventas.length); // Para depurar
            
            renderVentas();
            actualizarResumenVentas();
        } catch (error) {
            console.error('Error cargando ventas:', error);
            container.innerHTML = `<div class="empty">❌ Error al cargar: ${error.message}</div>`;
        }
    }

    // ============================================
    // RENDER VENTAS
    // ============================================
    function renderVentas(filtro = '', estadoFiltro = 'todos') {
        const container = document.getElementById('ventasContainer');
        const filtroLower = filtro.toLowerCase();
        
        let filtrados = ventas.filter(v => 
            v.cliente.toLowerCase().includes(filtroLower) || 
            v.producto.toLowerCase().includes(filtroLower) || 
            String(v.id).includes(filtroLower) || 
            (v.empresa && v.empresa.toLowerCase().includes(filtroLower))
        );
        
        if (estadoFiltro !== 'todos') {
            filtrados = filtrados.filter(v => v.estado === estadoFiltro);
        }
        
        if (filtrados.length === 0) {
            container.innerHTML = `<div class="empty">No hay ventas</div>`;
            return;
        }
        
        const estados = { 
            'pagado': '✅ Pagado', 
            'pendiente': '⏳ Pendiente', 
            'cancelado': '❌ Cancelado', 
            'transferencia': '💳 Transferencia', 
            'oferta': '📄 Oferta' 
        };
        const clases = { 
            'pagado': 'pagado', 
            'pendiente': 'pendiente', 
            'cancelado': 'cancelado', 
            'transferencia': 'transferencia', 
            'oferta': 'oferta' 
        };
        
        let html = `<table class="tabla"><thead><tr>
            <th>#</th><th>Factura</th><th>Cliente</th><th>Producto</th><th>Total</th><th>Fecha</th><th>Estado</th><th>Acciones</th>
        </tr></thead><tbody>`;
        
        filtrados.forEach(v => {
            const facturaDisplay = v.estado === 'oferta' 
                ? '<span class="badge-oferta">📄 OFERTA</span>' 
                : `<span class="badge-numero">${v.factura || '-'}</span>`;
            
            html += `<tr>
                <td>#${v.id}</td>
                <td>${facturaDisplay}</td>
                <td>${v.cliente}</td>
                <td>${v.producto}</td>
                <td>$${parseFloat(v.total).toFixed(2)}</td>
                <td>${v.fecha}</td>
                <td><span class="badge ${clases[v.estado]}">${estados[v.estado]}</span></td>
                <td>
                    <div class="acciones-cell">
                        <select onchange="cambiarEstadoVenta(${v.id}, this.value)" class="estado-select">
                            <option value="pagado" ${v.estado==='pagado'?'selected':''}>✅ Pagado</option>
                            <option value="pendiente" ${v.estado==='pendiente'?'selected':''}>⏳ Pendiente</option>
                            <option value="cancelado" ${v.estado==='cancelado'?'selected':''}>❌ Cancelado</option>
                            <option value="transferencia" ${v.estado==='transferencia'?'selected':''}>💳 Transferencia</option>
                            <option value="oferta" ${v.estado==='oferta'?'selected':''}>📄 Oferta</option>
                        </select>
                        <button class="btn btn-info btn-sm" onclick="generarFactura(${v.id})">📄</button>
                        <button class="btn btn-danger btn-sm" onclick="eliminarVenta(${v.id})">🗑️</button>
                    </div>
                </td>
            </tr>`;
        });
        
        html += `</tbody></table>`;
        container.innerHTML = html;
    }

    // ============================================
    // ACTUALIZAR RESUMEN DE VENTAS
    // ============================================
    function actualizarResumenVentas() {
        const total = ventas.length;
        const pagado = ventas.filter(v => v.estado === 'pagado' || v.estado === 'transferencia').length;
        const pendiente = ventas.filter(v => v.estado === 'pendiente').length;
        const cancelado = ventas.filter(v => v.estado === 'cancelado').length;
        const oferta = ventas.filter(v => v.estado === 'oferta').length;
        
        document.getElementById('totalVentas').textContent = total;
        document.getElementById('totalPagado').textContent = pagado;
        document.getElementById('totalPendiente').textContent = pendiente;
        document.getElementById('totalCancelado').textContent = cancelado;
        document.getElementById('totalOfertas').textContent = oferta;
    }

    // ============================================
    // FILTRAR VENTAS
    // ============================================
    function filtrarVentas() {
        const filtro = document.getElementById('searchInput').value;
        const estado = document.getElementById('filtroEstado').value;
        renderVentas(filtro, estado);
    }

    // ============================================
    // CAMBIAR ESTADO DE VENTA
    // ============================================
    function cambiarEstadoVenta(id, estado) {
        const v = ventas.find(v => v.id === id);
        if (!v || v.estado === estado) return;
        
        if (!confirm(`¿Cambiar estado a "${estado}"?`)) { 
            cargarVentas(); 
            return; 
        }
        
        fetch(`/api/venta/${id}/estado`, { 
            method:'PUT', 
            headers:{'Content-Type':'application/json'}, 
            body:JSON.stringify({estado}) 
        })
        .then(r => r.json())
        .then(data => {
            if (data.success) { 
                mostrarMensaje(`✅ Estado actualizado`, 'exito'); 
                cargarVentas(); 
            } else { 
                mostrarMensaje(data.error || 'Error', 'error'); 
                cargarVentas(); 
            }
        })
        .catch(error => { 
            console.error(error); 
            mostrarMensaje('Error de conexión', 'error'); 
            cargarVentas(); 
        });
    }

    // ============================================
    // ELIMINAR VENTA
    // ============================================
    function eliminarVenta(id) {
        const v = ventas.find(v => v.id === id);
        if (!v) {
            mostrarMensaje('Venta no encontrada', 'error');
            return;
        }
        
        if (!confirm(`⚠️ ¿Eliminar venta #${id} de ${v.cliente} por $${parseFloat(v.total).toFixed(2)}?`)) {
            return;
        }
        
        const btn = event?.target;
        const textoOriginal = btn ? btn.textContent : '🗑️';
        if (btn) { btn.textContent = '⏳'; btn.disabled = true; }
        
        fetch(`/api/venta/${id}`, { method: 'DELETE' })
        .then(r => r.json())
        .then(data => {
            if (data.success) {
                mostrarMensaje('✅ Venta eliminada', 'exito');
                cargarVentas();
            } else {
                mostrarMensaje(data.error || 'Error', 'error');
            }
        })
        .catch(error => {
            console.error(error);
            mostrarMensaje('Error de conexión', 'error');
        })
        .finally(() => {
            if (btn) { btn.textContent = textoOriginal; btn.disabled = false; }
        });
    }

    // ============================================
    // GENERAR FACTURA PDF
    // ============================================
    function generarFactura(id) {
        const v = ventas.find(v => v.id === id);
        if (!v) return;
        
        if (!confirm(`📄 ¿Generar factura #${id}?`)) return;
        
        const btn = event?.target;
        const orig = btn ? btn.textContent : '📄';
        if (btn) { btn.textContent = '⏳'; btn.disabled = true; }
        
        const esOferta = v.estado === 'oferta';
        const url = esOferta ? `/api/venta/${id}/factura?oferta=true` : `/api/venta/${id}/factura`;
        
        fetch(url)
        .then(r => {
            if (!r.ok) return r.json().then(d => { throw new Error(d.error || 'Error'); });
            return r.blob().then(blob => {
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; 
                a.download = esOferta ? `oferta_${id}.pdf` : `factura_${id}.pdf`;
                document.body.appendChild(a); 
                a.click(); 
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
                mostrarMensaje(`✅ ${esOferta ? 'Oferta' : 'Factura'} #${id} descargada`, 'exito');
            });
        })
        .catch(error => { 
            console.error(error); 
            mostrarMensaje('Error: '+error.message, 'error'); 
        })
        .finally(() => { 
            if (btn) { btn.textContent = orig; btn.disabled = false; } 
        });
    }

    // ============================================
    // INICIO - Cargar ventas al cargar la página
    // ============================================
    document.addEventListener('DOMContentLoaded', function() {
        console.log('📊 Iniciando módulo de ventas...');
        console.log('📊 Trabajador ID:', trabajadorId);
        cargarVentas();
        
        // Actualizar cada 30 segundos
        setInterval(cargarVentas, 30000);
    });
</script>
