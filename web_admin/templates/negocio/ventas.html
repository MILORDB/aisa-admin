<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventas - AIsa Negocio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f1a;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #2a2a3e;
            margin-bottom: 20px;
        }
        .card h2 { font-size: 18px; color: #6c3ce0; margin-bottom: 16px; }
        .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }
        .btn-primary { background: #6c3ce0; color: #fff; }
        .btn-primary:hover { background: #5a2ec0; }
        .btn-success { background: #4caf50; color: #fff; }
        .btn-success:hover { background: #3d8b40; }
        .btn-danger { background: #f44336; color: #fff; }
        .btn-danger:hover { background: #c62828; }
        .btn-warning { background: #ff9800; color: #fff; }
        .btn-warning:hover { background: #e68900; }
        .btn-sm { padding: 4px 12px; font-size: 11px; }
        .tabla {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .tabla th {
            text-align: left;
            padding: 8px 12px;
            color: #888;
            border-bottom: 1px solid #2a2a3e;
        }
        .tabla td {
            padding: 8px 12px;
            border-bottom: 1px solid #1a1a2e;
            vertical-align: middle;
        }
        .tabla .badge {
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 10px;
        }
        .tabla .badge.pagado { background: #224422; color: #6bff6b; }
        .tabla .badge.pendiente { background: #443322; color: #ffbb33; }
        .tabla .badge.cancelado { background: #442222; color: #ff6b6b; }
        .form-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .form-row input, .form-row select {
            padding: 8px 14px;
            border: 1px solid #2a2a3e;
            border-radius: 8px;
            background: #0f0f1a;
            color: #fff;
            font-size: 13px;
            flex: 1;
            min-width: 120px;
        }
        .form-row input:focus, .form-row select:focus {
            border-color: #6c3ce0;
            outline: none;
        }
        .form-row select option { background: #1a1a2e; }
        .form-row .campo-opcional {
            opacity: 0.7;
        }
        .form-row .campo-opcional label {
            font-size: 11px;
            color: #888;
            display: block;
            margin-bottom: 2px;
        }
        .form-row .campo-deshabilitado {
            opacity: 0.4;
            pointer-events: none;
        }
        .form-row label {
            font-size: 12px;
            color: #aaa;
            display: block;
            margin-bottom: 2px;
        }
        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .search-bar input {
            flex: 1;
            padding: 8px 14px;
            border: 1px solid #2a2a3e;
            border-radius: 8px;
            background: #0f0f1a;
            color: #fff;
            min-width: 150px;
        }
        .search-bar input:focus { border-color: #6c3ce0; outline: none; }
        .search-bar select {
            padding: 8px 14px;
            border: 1px solid #2a2a3e;
            border-radius: 8px;
            background: #0f0f1a;
            color: #fff;
        }
        .empty { text-align: center; color: #888; padding: 40px; }
        .loading { text-align: center; color: #888; padding: 20px; }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.show { display: flex; }
        .modal-content {
            background: #1a1a2e;
            padding: 30px;
            border-radius: 12px;
            max-width: 550px;
            width: 90%;
            border: 1px solid #2a2a3e;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-content h3 { margin-bottom: 16px; }
        .info-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .info-header .trabajador-info { font-size: 13px; color: #888; }
        .mensaje-exito {
            background: #224422;
            color: #6bff6b;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
        }
        .mensaje-exito.show { display: block; }
        .mensaje-error {
            background: #442222;
            color: #ff6b6b;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
        }
        .mensaje-error.show { display: block; }
        .stock-info {
            font-size: 12px;
            color: #888;
            margin-top: 2px;
        }
        .stock-info .bajo { color: #ff6b6b; }
        .stock-info .normal { color: #6bff6b; }
        .precio-info {
            font-size: 14px;
            color: #6c3ce0;
            font-weight: 600;
            margin-top: 2px;
        }
        .acciones-cell {
            display: flex; gap: 4px; flex-wrap: wrap;
        }
        .estado-select {
            background: #1a1a2e;
            color: #fff;
            border: 1px solid #2a2a3e;
            border-radius: 6px;
            padding: 2px 6px;
            font-size: 11px;
        }
        .resumen-venta {
            background: #0f0f1a;
            border-radius: 8px;
            padding: 12px 16px;
            border: 1px solid #2a2a3e;
            margin-top: 8px;
        }
        .resumen-venta .fila {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 13px;
        }
        .resumen-venta .fila .label { color: #888; }
        .resumen-venta .fila .value { font-weight: 600; }
        .resumen-venta .fila .value.total { color: #6c3ce0; font-size: 16px; }
        @media (max-width: 600px) {
            .form-row { flex-direction: column; }
            .search-bar { flex-direction: column; }
            .acciones-cell { flex-direction: column; }
            .acciones-cell .btn-sm { width: 100%; text-align: center; }
        }
    </style>
</head>
<body>

    <div class="info-header">
        <h1 style="font-size:22px;display:flex;align-items:center;gap:10px;">💰 Ventas <span style="font-size:14px;font-weight:normal;opacity:0.7;">Gestión de ventas</span></h1>
        <div id="infoTrabajador" class="trabajador-info"></div>
    </div>

    <div class="mensaje-error" id="mensajeError"></div>
    <div class="mensaje-exito" id="mensajeExito"></div>

    <!-- Resumen de ventas por estado -->
    <div class="card">
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;">
            <div style="background:#0f0f1a;border:1px solid #2a2a3e;border-radius:8px;padding:12px;text-align:center;">
                <div style="font-size:24px;font-weight:700;color:#6c3ce0;" id="totalVentas">0</div>
                <div style="font-size:12px;color:#888;">📊 Total ventas</div>
            </div>
            <div style="background:#0f0f1a;border:1px solid #2a2a3e;border-radius:8px;padding:12px;text-align:center;">
                <div style="font-size:24px;font-weight:700;color:#6bff6b;" id="totalPagado">0</div>
                <div style="font-size:12px;color:#888;">✅ Pagadas</div>
            </div>
            <div style="background:#0f0f1a;border:1px solid #2a2a3e;border-radius:8px;padding:12px;text-align:center;">
                <div style="font-size:24px;font-weight:700;color:#ffbb33;" id="totalPendiente">0</div>
                <div style="font-size:12px;color:#888;">⏳ Pendientes</div>
            </div>
            <div style="background:#0f0f1a;border:1px solid #2a2a3e;border-radius:8px;padding:12px;text-align:center;">
                <div style="font-size:24px;font-weight:700;color:#ff6b6b;" id="totalCancelado">0</div>
                <div style="font-size:12px;color:#888;">❌ Canceladas</div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="🔍 Buscar venta..." oninput="filtrarVentas()">
            <select id="filtroEstado" onchange="filtrarVentas()">
                <option value="todos">Todos los estados</option>
                <option value="pagado">✅ Pagado</option>
                <option value="pendiente">⏳ Pendiente</option>
                <option value="cancelado">❌ Cancelado</option>
            </select>
            <button class="btn btn-primary" onclick="nuevaVenta()">+ Nueva venta</button>
        </div>
    </div>

    <!-- Modal Nueva Venta -->
    <div class="modal-overlay" id="modalVenta">
        <div class="modal-content">
            <h3>💰 Nueva Venta</h3>
            <div style="font-size:12px;color:#888;margin-bottom:16px;">
                <span class="tipo-venta-label">📦 Producto o 📋 Servicio</span>
            </div>

            <div class="form-row campo-opcional">
                <div style="flex:1;">
                    <label>🏢 Empresa / TCP / MIPYME <span style="color:#666;">(opcional)</span></label>
                    <input type="text" id="ventaEmpresa" placeholder="Nombre de la empresa o TCP">
                </div>
            </div>

            <div class="form-row" style="border-top:1px solid #2a2a3e;padding-top:12px;margin-top:4px;">
                <div style="flex:1;min-width:150px;">
                    <label>📦 Producto</label>
                    <select id="ventaProducto">
                        <option value="">-- Seleccionar --</option>
                    </select>
                    <div id="productoStockInfo" class="stock-info" style="display:none;"></div>
                </div>
                <div style="flex:1;min-width:100px;">
                    <label>🔢 Cantidad</label>
                    <input type="number" id="ventaCantidad" placeholder="1" value="1" min="1">
                </div>
            </div>

            <div class="form-row" style="border-top:1px solid #2a2a3e;padding-top:12px;margin-top:4px;">
                <div style="flex:1;min-width:150px;">
                    <label>📋 Servicio</label>
                    <select id="ventaServicio">
                        <option value="">-- Seleccionar --</option>
                    </select>
                </div>
                <div style="flex:1;min-width:120px;">
                    <label>💰 Precio del servicio</label>
                    <input type="text" id="ventaPrecioServicio" placeholder="$0.00" readonly style="background:#0a0a14;color:#6c3ce0;font-weight:600;">
                </div>
            </div>

            <div class="form-row" style="border-top:1px solid #2a2a3e;padding-top:12px;margin-top:4px;">
                <div style="flex:1;min-width:150px;">
                    <label>💵 Precio unitario</label>
                    <input type="number" id="ventaPrecio" placeholder="0.00" step="0.01">
                </div>
                <div style="flex:1;min-width:120px;">
                    <label>📌 Estado de pago</label>
                    <select id="ventaEstado">
                        <option value="pagado" style="color:#6bff6b;">✅ Pagado</option>
                        <option value="pendiente" style="color:#ffbb33;">⏳ Pendiente</option>
                        <option value="cancelado" style="color:#ff6b6b;">❌ Cancelado</option>
                    </select>
                </div>
            </div>

            <div class="resumen-venta" id="resumenVenta" style="display:none;">
                <div class="fila">
                    <span class="label">📦 Producto/Servicio:</span>
                    <span class="value" id="resumenProducto">-</span>
                </div>
                <div class="fila">
                    <span class="label">🔢 Cantidad:</span>
                    <span class="value" id="resumenCantidad">-</span>
                </div>
                <div class="fila">
                    <span class="label">💵 Precio unitario:</span>
                    <span class="value" id="resumenPrecio">-</span>
                </div>
                <div class="fila">
                    <span class="label">📌 Estado:</span>
                    <span class="value" id="resumenEstado">-</span>
                </div>
                <div class="fila" style="border-top:1px solid #2a2a3e;padding-top:8px;margin-top:4px;">
                    <span class="label">💰 Total:</span>
                    <span class="value total" id="resumenTotal">$0.00</span>
                </div>
            </div>

            <input type="hidden" id="ventaTrabajador" value="">
            <input type="hidden" id="ventaTipo" value="producto">

            <div style="display:flex;gap:10px;margin-top:12px;border-top:1px solid #2a2a3e;padding-top:12px;">
                <button class="btn btn-success" onclick="guardarVenta()" style="flex:1;">💾 Guardar venta</button>
                <button class="btn btn-danger" onclick="cerrarModal()" style="flex:1;">✕ Cancelar</button>
            </div>
        </div>
    </div>

    <!-- Tabla de ventas -->
    <div class="card">
        <div id="ventasContainer">
            <div class="loading">Cargando ventas...</div>
        </div>
    </div>

    <script>
        let ventas = [];
        let productos = [];
        let servicios = [];
        let trabajadorId = null;

        // ============================================
        // INICIALIZACIÓN
        // ============================================

        function getTrabajadorId() {
            const params = new URLSearchParams(window.location.search);
            return params.get('trabajador_id');
        }

        function mostrarInfoTrabajador() {
            const id = getTrabajadorId();
            if (id) {
                trabajadorId = id;
                document.getElementById('infoTrabajador').textContent = '👤 Trabajador ID: ' + id;
                document.getElementById('ventaTrabajador').value = id;
            }
        }

        function mostrarMensaje(texto, tipo) {
            const errorEl = document.getElementById('mensajeError');
            const exitoEl = document.getElementById('mensajeExito');
            errorEl.classList.remove('show');
            exitoEl.classList.remove('show');
            if (tipo === 'error') {
                errorEl.textContent = '❌ ' + texto;
                errorEl.classList.add('show');
            } else {
                exitoEl.textContent = '✅ ' + texto;
                exitoEl.classList.add('show');
            }
            setTimeout(() => {
                errorEl.classList.remove('show');
                exitoEl.classList.remove('show');
            }, 5000);
        }

        // ============================================
        // CARGAR PRODUCTOS Y SERVICIOS
        // ============================================

        async function cargarProductos() {
            try {
                const response = await fetch('/api/productos/stock');
                if (!response.ok) throw new Error('Error al cargar productos');
                productos = await response.json();
                actualizarSelectorProductos();
            } catch (error) {
                console.error('Error al cargar productos:', error);
            }
        }

        async function cargarServicios() {
            try {
                const response = await fetch('/api/servicios');
                if (!response.ok) throw new Error('Error al cargar servicios');
                servicios = await response.json();
                servicios = servicios.filter(s => s.activo === 1);
                actualizarSelectorServicios();
            } catch (error) {
                console.error('Error al cargar servicios:', error);
            }
        }

        function actualizarSelectorProductos() {
            const select = document.getElementById('ventaProducto');
            
            while (select.options.length > 1) {
                select.remove(1);
            }
            
            const productosConStock = productos.filter(p => p.stock > 0);
            if (productosConStock.length === 0) {
                const opt = document.createElement('option');
                opt.value = '';
                opt.textContent = '-- Sin productos con stock --';
                opt.disabled = true;
                select.appendChild(opt);
                return;
            }
            
            productosConStock.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.id;
                opt.textContent = `${p.nombre} (Stock: ${p.stock})`;
                opt.dataset.precio = p.precio;
                opt.dataset.stock = p.stock;
                select.appendChild(opt);
            });
        }

        function actualizarSelectorServicios() {
            const select = document.getElementById('ventaServicio');
            
            while (select.options.length > 1) {
                select.remove(1);
            }
            
            if (servicios.length === 0) {
                const opt = document.createElement('option');
                opt.value = '';
                opt.textContent = '-- Sin servicios activos --';
                opt.disabled = true;
                select.appendChild(opt);
                return;
            }
            
            servicios.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.id;
                opt.textContent = `${s.nombre}`;
                opt.dataset.precio = s.precio;
                select.appendChild(opt);
            });
        }

        // ============================================
        // ACTUALIZAR RESUMEN DE VENTA
        // ============================================

        function actualizarResumen() {
            const productoSelect = document.getElementById('ventaProducto');
            const servicioSelect = document.getElementById('ventaServicio');
            const cantidad = parseInt(document.getElementById('ventaCantidad').value) || 1;
            const precio = parseFloat(document.getElementById('ventaPrecio').value) || 0;
            const estado = document.getElementById('ventaEstado').value;
            const resumen = document.getElementById('resumenVenta');

            let nombreItem = '';
            let precioUnitario = precio;

            if (productoSelect.value) {
                const selected = productoSelect.options[productoSelect.selectedIndex];
                nombreItem = selected.text.split('(')[0].trim();
                precioUnitario = parseFloat(selected.dataset.precio) || 0;
                document.getElementById('ventaPrecio').value = precioUnitario.toFixed(2);
            } else if (servicioSelect.value) {
                const selected = servicioSelect.options[servicioSelect.selectedIndex];
                nombreItem = selected.text;
                precioUnitario = parseFloat(selected.dataset.precio) || 0;
                document.getElementById('ventaPrecio').value = precioUnitario.toFixed(2);
            }

            if (nombreItem && precioUnitario > 0) {
                resumen.style.display = 'block';
                document.getElementById('resumenProducto').textContent = nombreItem;
                document.getElementById('resumenCantidad').textContent = cantidad;
                document.getElementById('resumenPrecio').textContent = `$${precioUnitario.toFixed(2)}`;
                document.getElementById('resumenTotal').textContent = `$${(precioUnitario * cantidad).toFixed(2)}`;
                
                const estados = {
                    'pagado': '✅ Pagado',
                    'pendiente': '⏳ Pendiente',
                    'cancelado': '❌ Cancelado'
                };
                const colores = {
                    'pagado': '#6bff6b',
                    'pendiente': '#ffbb33',
                    'cancelado': '#ff6b6b'
                };
                document.getElementById('resumenEstado').innerHTML = `<span style="color:${colores[estado]}">${estados[estado]}</span>`;
            } else {
                resumen.style.display = 'none';
            }
        }

        document.getElementById('ventaProducto').addEventListener('change', function() {
            const servicioSelect = document.getElementById('ventaServicio');
            const stockInfo = document.getElementById('productoStockInfo');

            if (this.value) {
                const selected = this.options[this.selectedIndex];
                const precio = parseFloat(selected.dataset.precio) || 0;
                const stock = parseInt(selected.dataset.stock) || 0;
                document.getElementById('ventaPrecio').value = precio.toFixed(2);
                document.getElementById('ventaTipo').value = 'producto';
                
                servicioSelect.disabled = true;
                servicioSelect.classList.add('campo-deshabilitado');
                servicioSelect.value = '';
                
                stockInfo.style.display = 'block';
                stockInfo.innerHTML = `📦 Stock disponible: ${stock} unidades ${stock < 5 ? '⚠️ Stock bajo' : '✅'}`;
                stockInfo.className = stock < 5 ? 'stock-info bajo' : 'stock-info normal';
                
                document.getElementById('ventaPrecioServicio').value = '';
            } else {
                document.getElementById('ventaPrecio').value = '';
                stockInfo.style.display = 'none';
                servicioSelect.disabled = false;
                servicioSelect.classList.remove('campo-deshabilitado');
                document.getElementById('ventaTipo').value = 'producto';
            }
            actualizarResumen();
        });

        document.getElementById('ventaServicio').addEventListener('change', function() {
            const productoSelect = document.getElementById('ventaProducto');

            if (this.value) {
                const selected = this.options[this.selectedIndex];
                const precio = parseFloat(selected.dataset.precio) || 0;
                document.getElementById('ventaPrecio').value = precio.toFixed(2);
                document.getElementById('ventaPrecioServicio').value = `$${precio.toFixed(2)}`;
                document.getElementById('ventaTipo').value = 'servicio';
                
                productoSelect.disabled = true;
                productoSelect.classList.add('campo-deshabilitado');
                document.getElementById('productoStockInfo').style.display = 'none';
            } else {
                document.getElementById('ventaPrecio').value = '';
                document.getElementById('ventaPrecioServicio').value = '';
                productoSelect.disabled = false;
                productoSelect.classList.remove('campo-deshabilitado');
                document.getElementById('ventaTipo').value = 'producto';
            }
            actualizarResumen();
        });

        document.getElementById('ventaCantidad').addEventListener('input', actualizarResumen);
        document.getElementById('ventaEstado').addEventListener('change', actualizarResumen);

        // ============================================
        // CARGAR VENTAS
        // ============================================

        async function cargarVentas() {
            const container = document.getElementById('ventasContainer');
            container.innerHTML = '<div class="loading">Cargando ventas...</div>';

            try {
                const url = trabajadorId ? `/api/ventas?trabajador_id=${trabajadorId}` : '/api/ventas';
                const response = await fetch(url);
                if (!response.ok) throw new Error('Error al cargar ventas');
                ventas = await response.json();
                renderVentas();
                actualizarResumenVentas();
            } catch (error) {
                console.error('Error:', error);
                container.innerHTML = `<div class="empty">❌ Error al cargar ventas</div>`;
            }
        }

        // ============================================
        // RENDER VENTAS
        // ============================================

        function renderVentas(filtro = '', estadoFiltro = 'todos') {
            const container = document.getElementById('ventasContainer');
            const filtroLower = filtro.toLowerCase();
            
            let filtrados = ventas.filter(v => 
                v.cliente.toLowerCase().includes(filtroLower) ||
                v.producto.toLowerCase().includes(filtroLower) ||
                String(v.id).includes(filtroLower) ||
                (v.empresa && v.empresa.toLowerCase().includes(filtroLower))
            );

            if (estadoFiltro !== 'todos') {
                filtrados = filtrados.filter(v => v.estado === estadoFiltro);
            }

            if (filtrados.length === 0) {
                container.innerHTML = `<div class="empty">No hay ventas registradas</div>`;
                return;
            }

            let html = `
                <div style="overflow-x:auto;">
                    <table class="tabla">
                        <thead>
                            <tr>
                                <th># Venta</th>
                                <th>Cliente</th>
                                <th>Empresa</th>
                                <th>Producto/Servicio</th>
                                <th>Cantidad</th>
                                <th>Total</th>
                                <th>Fecha</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            filtrados.forEach(v => {
                const estados = { 
                    'pagado': '✅ Pagado', 
                    'pendiente': '⏳ Pendiente', 
                    'cancelado': '❌ Cancelado' 
                };
                const clases = { 
                    'pagado': 'pagado', 
                    'pendiente': 'pendiente', 
                    'cancelado': 'cancelado' 
                };
                const tipoVenta = v.tipo || (v.producto_id ? 'producto' : 'servicio');
                const iconoTipo = tipoVenta === 'producto' ? '📦' : '📋';
                
                html += `
                    <tr>
                        <td><strong>#${v.id}</strong></td>
                        <td>${v.cliente}</td>
                        <td>${v.empresa || '-'}</td>
                        <td>${iconoTipo} ${v.producto}</td>
                        <td>${v.cantidad}</td>
                        <td>$${parseFloat(v.total).toFixed(2)}</td>
                        <td>${v.fecha}</td>
                        <td><span class="badge ${clases[v.estado]}">${estados[v.estado]}</span></td>
                        <td>
                            <div class="acciones-cell">
                                <select onchange="cambiarEstadoVenta(${v.id}, this.value)" class="estado-select">
                                    <option value="pagado" ${v.estado === 'pagado' ? 'selected' : ''}>✅ Pagado</option>
                                    <option value="pendiente" ${v.estado === 'pendiente' ? 'selected' : ''}>⏳ Pendiente</option>
                                    <option value="cancelado" ${v.estado === 'cancelado' ? 'selected' : ''}>❌ Cancelado</option>
                                </select>
                                <button class="btn btn-danger btn-sm" onclick="eliminarVenta(${v.id})">🗑️</button>
                            </div>
                        </td>
                    </tr>
                `;
            });

            html += `
                        </tbody>
                    </table>
                </div>
            `;

            container.innerHTML = html;
        }

        // ============================================
        // ACTUALIZAR RESUMEN DE VENTAS
        // ============================================

        function actualizarResumenVentas() {
            const total = ventas.length;
            const pagado = ventas.filter(v => v.estado === 'pagado').length;
            const pendiente = ventas.filter(v => v.estado === 'pendiente').length;
            const cancelado = ventas.filter(v => v.estado === 'cancelado').length;
            
            document.getElementById('totalVentas').textContent = total;
            document.getElementById('totalPagado').textContent = pagado;
            document.getElementById('totalPendiente').textContent = pendiente;
            document.getElementById('totalCancelado').textContent = cancelado;
        }

        // ============================================
        // FILTRAR
        // ============================================

        function filtrarVentas() {
            const filtro = document.getElementById('searchInput').value;
            const estado = document.getElementById('filtroEstado').value;
            renderVentas(filtro, estado);
        }

        // ============================================
        // NUEVA VENTA - ABRIR MODAL
        // ============================================

        function nuevaVenta() {
            document.getElementById('ventaEmpresa').value = '';
            document.getElementById('ventaCantidad').value = '1';
            document.getElementById('ventaPrecio').value = '';
            document.getElementById('ventaPrecioServicio').value = '';
            document.getElementById('productoStockInfo').style.display = 'none';
            document.getElementById('resumenVenta').style.display = 'none';
            document.getElementById('ventaEstado').value = 'pagado';
            
            const productoSelect = document.getElementById('ventaProducto');
            productoSelect.disabled = false;
            productoSelect.classList.remove('campo-deshabilitado');
            productoSelect.value = '';
            
            const servicioSelect = document.getElementById('ventaServicio');
            servicioSelect.disabled = false;
            servicioSelect.classList.remove('campo-deshabilitado');
            servicioSelect.value = '';
            
            document.getElementById('ventaTipo').value = 'producto';
            
            cargarProductos();
            cargarServicios();
            document.getElementById('modalVenta').classList.add('show');
            document.getElementById('ventaEmpresa').focus();
        }

        function cerrarModal() {
            document.getElementById('modalVenta').classList.remove('show');
        }

        // ============================================
        // GUARDAR VENTA
        // ============================================

        function guardarVenta() {
            const empresa = document.getElementById('ventaEmpresa').value.trim();
            const productoId = document.getElementById('ventaProducto').value;
            const servicioId = document.getElementById('ventaServicio').value;
            const cantidad = parseInt(document.getElementById('ventaCantidad').value) || 1;
            const precio = parseFloat(document.getElementById('ventaPrecio').value);
            const tipo = document.getElementById('ventaTipo').value;
            const estado = document.getElementById('ventaEstado').value;

            if (!productoId && !servicioId) {
                mostrarMensaje('❌ Selecciona un producto o un servicio', 'error');
                return;
            }

            if (isNaN(precio) || precio <= 0) {
                mostrarMensaje('❌ Ingresa un precio válido', 'error');
                return;
            }

            let nombreItem = '';
            let idItem = null;

            if (productoId) {
                const producto = productos.find(p => p.id == productoId);
                if (!producto) {
                    mostrarMensaje('❌ Producto no encontrado', 'error');
                    return;
                }
                if (producto.stock < cantidad) {
                    mostrarMensaje(`❌ Stock insuficiente. Disponible: ${producto.stock} unidades`, 'error');
                    return;
                }
                nombreItem = producto.nombre;
                idItem = productoId;
            } else if (servicioId) {
                const servicio = servicios.find(s => s.id == servicioId);
                if (!servicio) {
                    mostrarMensaje('❌ Servicio no encontrado', 'error');
                    return;
                }
                nombreItem = servicio.nombre;
                idItem = servicioId;
            }

            const cliente = empresa || 'Cliente sin empresa';

            const data = {
                cliente: cliente,
                producto: nombreItem,
                producto_id: idItem,
                cantidad: cantidad,
                precio: precio,
                total: precio * cantidad,
                empresa: empresa || null,
                tipo: tipo,
                trabajador_id: trabajadorId || null,
                estado: estado
            };

            fetch('/api/ventas', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    mostrarMensaje(`✅ Venta registrada correctamente`, 'exito');
                    cerrarModal();
                    cargarVentas();
                    cargarProductos();
                } else {
                    mostrarMensaje(data.error || 'Error al registrar la venta', 'error');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                mostrarMensaje('Error de conexión con el servidor', 'error');
            });
        }

        // ============================================
        // CAMBIAR ESTADO DE VENTA (GUARDAR EN BD)
        // ============================================

        function cambiarEstadoVenta(id, estado) {
            const venta = ventas.find(v => v.id === id);
            if (!venta) return;
            
            if (venta.estado === estado) return;
            
            const estados = {
                'pagado': '✅ Pagado',
                'pendiente': '⏳ Pendiente',
                'cancelado': '❌ Cancelado'
            };
            
            if (!confirm(`¿Cambiar el estado de la venta #${id} de "${estados[venta.estado]}" a "${estados[estado]}"?`)) {
                cargarVentas();
                return;
            }

            fetch(`/api/venta/${id}/estado`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ estado: estado })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    mostrarMensaje(`✅ Estado actualizado a "${estados[estado]}"`, 'exito');
                    cargarVentas();
                } else {
                    mostrarMensaje(data.error || 'Error al actualizar estado', 'error');
                    cargarVentas();
                }
            })
            .catch(error => {
                console.error('Error:', error);
                mostrarMensaje('Error de conexión con el servidor', 'error');
                cargarVentas();
            });
        }

        // ============================================
        // ELIMINAR VENTA
        // ============================================

        async function eliminarVenta(id) {
            const venta = ventas.find(v => v.id === id);
            if (!venta) return;
            
            const estados = {
                'pagado': '✅ Pagado',
                'pendiente': '⏳ Pendiente',
                'cancelado': '❌ Cancelado'
            };
            
            if (!confirm(`⚠️ ¿Estás seguro de eliminar esta venta?\n\n📋 Cliente: ${venta.cliente}\n📦 Producto: ${venta.producto}\n📦 Cantidad: ${venta.cantidad}\n💰 Total: $${parseFloat(venta.total).toFixed(2)}\n📌 Estado: ${estados[venta.estado]}`)) {
                return;
            }
            
            try {
                const response = await fetch(`/api/venta/${id}`, {
                    method: 'DELETE'
                });
                
                const data = await response.json();
                
                if (data.success) {
                    mostrarMensaje(`✅ Venta #${id} eliminada. Stock reintegrado.`, 'exito');
                    await cargarVentas();
                    await cargarProductos();
                } else {
                    mostrarMensaje(`❌ Error: ${data.error || 'Error desconocido'}`, 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                mostrarMensaje('❌ Error de conexión', 'error');
            }
        }

        // ============================================
        // INICIO
        // ============================================

        mostrarInfoTrabajador();
        cargarProductos();
        cargarServicios();
        cargarVentas();
        
        setInterval(() => {
            cargarProductos();
            cargarServicios();
            cargarVentas();
        }, 30000);
    </script>
</body>
</html>
