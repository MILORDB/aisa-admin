<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Contratos - AIsa Negocio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f1a;
            color: #fff;
            min-height: 100vh;
            padding: 12px;
        }
        .card {
            background: #1a1a2e;
            border-radius: 10px;
            padding: 14px;
            border: 1px solid #2a2a3e;
            margin-bottom: 12px;
        }
        .card h2 { font-size: 15px; color: #6c3ce0; margin-bottom: 12px; }
        .btn {
            padding: 6px 14px; border: none; border-radius: 6px; cursor: pointer;
            font-size: 12px; transition: all 0.3s;
        }
        .btn-primary { background: #6c3ce0; color: #fff; }
        .btn-primary:hover { background: #5a2ec0; }
        .btn-success { background: #4caf50; color: #fff; }
        .btn-success:hover { background: #3d8b40; }
        .btn-danger { background: #f44336; color: #fff; }
        .btn-danger:hover { background: #c62828; }
        .btn-warning { background: #ff9800; color: #fff; }
        .btn-warning:hover { background: #e68900; }
        .btn-sm { padding: 3px 8px; font-size: 10px; }
        
        .tabla {
            width: 100%; border-collapse: collapse; font-size: 12px;
        }
        .tabla th {
            text-align: left; padding: 6px 8px; color: #888;
            border-bottom: 1px solid #2a2a3e; font-size: 10px; text-transform: uppercase;
        }
        .tabla td { padding: 6px 8px; border-bottom: 1px solid #1a1a2e; vertical-align: middle; }
        .tabla .badge {
            padding: 1px 8px; border-radius: 10px; font-size: 9px;
        }
        .tabla .badge.activo { background: #224422; color: #6bff6b; }
        .tabla .badge.pendiente { background: #443322; color: #ffbb33; }
        .tabla .badge.finalizado { background: #2a2a3e; color: #aaa; }
        .tabla .badge.cancelado { background: #442222; color: #ff6b6b; }
        .tabla .badge.vencido { background: #442222; color: #ff6b6b; }
        .tabla .badge.ventas { background: #6c3ce0; color: #fff; }
        .tabla .badge.servicios { background: #ff9800; color: #000; }
        .tabla .badge.ambos { background: #4caf50; color: #fff; }
        
        .form-row {
            display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px;
        }
        .form-row input, .form-row select, .form-row textarea {
            padding: 6px 10px; border: 1px solid #2a2a3e; border-radius: 6px;
            background: #0f0f1a; color: #fff; font-size: 12px;
            flex: 1; min-width: 100px;
        }
        .form-row input:focus, .form-row select:focus, .form-row textarea:focus {
            border-color: #6c3ce0; outline: none;
        }
        .form-row label { font-size: 11px; color: #aaa; display: block; margin-bottom: 2px; }
        
        .search-bar {
            display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap;
        }
        .search-bar input {
            flex: 1; padding: 6px 10px; border: 1px solid #2a2a3e; border-radius: 6px;
            background: #0f0f1a; color: #fff; font-size: 12px; min-width: 100px;
        }
        .search-bar input:focus { border-color: #6c3ce0; outline: none; }
        .search-bar select {
            padding: 6px 10px; border: 1px solid #2a2a3e; border-radius: 6px;
            background: #0f0f1a; color: #fff; font-size: 12px;
        }
        
        .empty { text-align: center; color: #888; padding: 30px; font-size: 13px; }
        .loading { text-align: center; color: #888; padding: 20px; font-size: 13px; }
        .mensaje-exito {
            background: #224422; color: #6bff6b;
            padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; font-size: 12px; display: none;
        }
        .mensaje-exito.show { display: block; }
        .mensaje-error {
            background: #442222; color: #ff6b6b;
            padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; font-size: 12px; display: none;
        }
        .mensaje-error.show { display: block; }
        
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.7);
            z-index: 1000; align-items: center; justify-content: center; padding: 16px;
        }
        .modal-overlay.show { display: flex; }
        .modal-content {
            background: #1a1a2e; padding: 16px; border-radius: 10px;
            max-width: 500px; width: 100%; border: 1px solid #2a2a3e;
            max-height: 95vh; overflow-y: auto;
        }
        .modal-content h3 { font-size: 16px; margin-bottom: 4px; }
        .modal-content .modal-subtitle { font-size: 11px; color: #888; margin-bottom: 12px; }
        .modal-content .form-actions { display: flex; gap: 8px; margin-top: 12px; border-top: 1px solid #2a2a3e; padding-top: 12px; }
        .modal-content .form-actions .btn { flex: 1; }
        
        .contrato-numero { font-weight: 700; color: #6c3ce0; font-family: monospace; font-size: 13px; }
        .info-fecha-fin { font-size: 11px; color: #888; margin-top: 2px; }
        .info-fecha-fin .activo { color: #6bff6b; }
        .info-fecha-fin .vencido { color: #ff6b6b; }
        .info-fecha-fin .proximo { color: #ffbb33; }
        .duracion-info { font-size: 10px; color: #666; margin-top: 2px; }
        .duracion-info .duracion-tag { display: inline-block; background: rgba(108,60,224,0.15); color: #6c3ce0; padding: 0 6px; border-radius: 8px; font-size: 9px; }
        
        .stats-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 6px;
        }
        .stat-item {
            background: #0f0f1a; border: 1px solid #2a2a3e; border-radius: 6px; padding: 8px; text-align: center;
        }
        .stat-item .number { font-size: 18px; font-weight: 700; color: #6c3ce0; }
        .stat-item .label { font-size: 8px; color: #888; margin-top: 1px; }
        
        .acciones-cell { display: flex; gap: 4px; flex-wrap: wrap; }
        .estado-select {
            background: #1a1a2e; color: #fff; border: 1px solid #2a2a3e;
            border-radius: 4px; padding: 1px 4px; font-size: 9px;
        }
        
        .table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -4px; }
        .table-wrapper table { min-width: 700px; }
        
        .duracion-selector { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        .duracion-selector select { flex: 0 0 70px; min-width: 70px; }
        .duracion-selector span { color: #888; font-size: 12px; }
        .numero-contrato {
            background: #0a0a14; color: #6c3ce0; font-weight: 700; font-size: 16px;
            text-align: center; border: 2px solid #6c3ce0;
        }
        .tipo-option { display: flex; gap: 8px; flex: 1; flex-wrap: wrap; }
        .tipo-option label {
            display: flex; align-items: center; gap: 4px; font-size: 12px;
            cursor: pointer; padding: 4px 10px; border-radius: 6px;
            border: 1px solid #2a2a3e; transition: all 0.3s;
        }
        .tipo-option label:hover { border-color: #6c3ce0; }
        .tipo-option input[type="radio"] { width: auto; accent-color: #6c3ce0; }
        .tipo-option label.seleccionado { border-color: #6c3ce0; background: rgba(108,60,224,0.15); }

        @media (max-width: 600px) {
            body { padding: 8px; }
            .card { padding: 10px; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .form-row { flex-direction: column; }
            .search-bar { flex-direction: column; }
            .acciones-cell { flex-direction: row; flex-wrap: wrap; }
            .acciones-cell .btn-sm { flex: 1; text-align: center; min-width: 40px; }
            .modal-content { padding: 12px; }
            .tabla { font-size: 11px; }
            .tabla th, .tabla td { padding: 4px 6px; }
            .duracion-selector { flex-wrap: wrap; }
            .tipo-option { flex-wrap: wrap; }
        }
        @media (max-width: 400px) {
            .tabla { font-size: 10px; }
            .tabla th, .tabla td { padding: 3px 4px; }
            .tipo-option label { font-size: 10px; padding: 3px 6px; }
        }
    </style>
</head>
<body>

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:6px;">
        <h1 style="font-size:18px;display:flex;align-items:center;gap:8px;">📄 Contratos <span style="font-size:12px;font-weight:normal;opacity:0.7;">Gestión de contratos</span></h1>
    </div>

    <div class="mensaje-error" id="mensajeError"></div>
    <div class="mensaje-exito" id="mensajeExito"></div>

    <div class="card">
        <div class="stats-grid">
            <div class="stat-item"><span class="number" id="totalContratos">0</span><span class="label">📄 Total</span></div>
            <div class="stat-item"><span class="number" id="contratosActivos">0</span><span class="label">🟢 Activos</span></div>
            <div class="stat-item"><span class="number" id="contratosVencidos">0</span><span class="label">⏰ Vencidos</span></div>
        </div>
    </div>

    <div class="card">
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="🔍 Buscar..." oninput="filtrarContratos()">
            <select id="filtroEstado" onchange="filtrarContratos()">
                <option value="todos">Todos</option>
                <option value="activo">🟢 Activo</option>
                <option value="pendiente">⏳ Pendiente</option>
                <option value="finalizado">📌 Finalizado</option>
                <option value="cancelado">❌ Cancelado</option>
            </select>
            <button class="btn btn-primary" onclick="nuevoContrato()">+ Nuevo</button>
        </div>
    </div>

    <div class="modal-overlay" id="modalContrato">
        <div class="modal-content">
            <h3 id="modalTitle">📄 Nuevo Contrato</h3>
            <div class="modal-subtitle">Complete los datos del contrato</div>

            <div class="form-row">
                <div style="flex:1;">
                    <label>🏢 Empresa</label>
                    <input type="text" id="contratoEmpresa" placeholder="Nombre de la empresa" required>
                </div>
            </div>

            <div class="form-row">
                <div style="flex:1;">
                    <label>🔢 N° Contrato <span style="color:#666;">(automático)</span></label>
                    <input type="text" id="contratoNumero" class="numero-contrato" readonly disabled>
                </div>
            </div>

            <div class="form-row">
                <div style="flex:1;">
                    <label>📅 Fecha Inicio</label>
                    <input type="date" id="contratoFechaInicio" required onchange="calcularFechaFin()">
                </div>
            </div>

            <div class="form-row">
                <div style="flex:1;">
                    <label>⏳ Duración</label>
                    <div class="duracion-selector">
                        <select id="contratoDuracion" onchange="calcularFechaFin()">
                            <option value="1">1 año</option>
                            <option value="2" selected>2 años</option>
                            <option value="3">3 años</option>
                            <option value="4">4 años</option>
                            <option value="5">5 años</option>
                        </select>
                        <span>→</span>
                        <span style="flex:1;font-weight:600;color:#6c3ce0;font-size:12px;" id="textoFechaFin">Fecha Fin: -</span>
                    </div>
                    <div class="duracion-info">
                        <span class="duracion-tag">📌 Renovación automática al cumplir la duración</span>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <div style="flex:1;">
                    <label>📅 Fecha Fin <span style="color:#666;">(automática)</span></label>
                    <input type="date" id="contratoFechaFin" readonly disabled style="background:#0a0a14;color:#888;">
                    <div class="info-fecha-fin" id="infoFechaFin">📌 Se calcula automáticamente</div>
                </div>
            </div>

            <div class="form-row">
                <div style="flex:1;">
                    <label>📋 Tipo</label>
                    <div class="tipo-option">
                        <label id="tipoVentas" onclick="seleccionarTipo('ventas')">
                            <input type="radio" name="tipoContrato" value="ventas"> 💰 Ventas
                        </label>
                        <label id="tipoServicios" onclick="seleccionarTipo('servicios')">
                            <input type="radio" name="tipoContrato" value="servicios"> 📋 Servicios
                        </label>
                        <label id="tipoAmbos" onclick="seleccionarTipo('ambos')">
                            <input type="radio" name="tipoContrato" value="ambos"> 🔄 Ambas
                        </label>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <div style="flex:1;">
                    <label>💰 Monto <span style="color:#666;">(opcional)</span></label>
                    <input type="number" id="contratoMonto" placeholder="0.00" step="0.01" min="0">
                </div>
            </div>

            <div class="form-row">
                <div style="flex:1;">
                    <label>📝 Descripción <span style="color:#666;">(opcional)</span></label>
                    <textarea id="contratoDescripcion" placeholder="Descripción adicional" rows="2"></textarea>
                </div>
            </div>

            <input type="hidden" id="contratoId" value="">
            <div class="form-actions">
                <button class="btn btn-success" onclick="guardarContrato()" id="btnGuardar">💾 Guardar</button>
                <button class="btn btn-danger" onclick="cerrarModal()">✕ Cancelar</button>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="table-wrapper">
            <div id="contratosContainer">
                <div class="loading">Cargando...</div>
            </div>
        </div>
    </div>

    <script>
        let contratos = [], editandoId = null, ultimoNumeroContrato = 0;

        function mostrarMensaje(texto, tipo) {
            const errorEl = document.getElementById('mensajeError');
            const exitoEl = document.getElementById('mensajeExito');
            errorEl.classList.remove('show');
            exitoEl.classList.remove('show');
            if (tipo === 'error') {
                errorEl.textContent = '❌ ' + texto;
                errorEl.classList.add('show');
            } else {
                exitoEl.textContent = '✅ ' + texto;
                exitoEl.classList.add('show');
            }
            setTimeout(() => {
                errorEl.classList.remove('show');
                exitoEl.classList.remove('show');
            }, 4000);
        }

        function seleccionarTipo(tipo) {
            document.querySelectorAll('.tipo-option label').forEach(el => el.classList.remove('seleccionado'));
            const map = { 'ventas': 'tipoVentas', 'servicios': 'tipoServicios', 'ambos': 'tipoAmbos' };
            const el = document.getElementById(map[tipo]);
            if (el) { el.classList.add('seleccionado'); el.querySelector('input').checked = true; }
        }

        function calcularFechaFin() {
            const fechaInicio = document.getElementById('contratoFechaInicio').value;
            const duracion = parseInt(document.getElementById('contratoDuracion').value) || 1;
            if (fechaInicio) {
                const fecha = new Date(fechaInicio);
                fecha.setFullYear(fecha.getFullYear() + duracion);
                const finStr = fecha.toISOString().split('T')[0];
                document.getElementById('contratoFechaFin').value = finStr;
                const meses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
                const fechaObj = new Date(finStr);
                document.getElementById('textoFechaFin').textContent = `📅 ${fechaObj.getDate()} de ${meses[fechaObj.getMonth()]} de ${fechaObj.getFullYear()} (${duracion} año${duracion>1?'s':''})`;
                document.getElementById('infoFechaFin').innerHTML = `📌 Finaliza: ${finStr}`;
            }
        }

        async function obtenerUltimoNumeroContrato() {
            try {
                const response = await fetch('/api/contratos/ultimo_numero');
                if (!response.ok) return 0;
                const data = await response.json();
                ultimoNumeroContrato = data.ultimo_numero || 0;
                return ultimoNumeroContrato;
            } catch (error) { console.error(error); return 0; }
        }

        function generarNumeroContrato() {
            ultimoNumeroContrato++;
            const year = new Date().getFullYear();
            return `CON-${year}-${String(ultimoNumeroContrato).padStart(4,'0')}`;
        }

        async function actualizarNumeroContrato() {
            await obtenerUltimoNumeroContrato();
            document.getElementById('contratoNumero').value = generarNumeroContrato();
        }

        async function cargarContratos() {
            const container = document.getElementById('contratosContainer');
            container.innerHTML = '<div class="loading">Cargando...</div>';
            try {
                const response = await fetch('/api/contratos');
                if (!response.ok) throw new Error('Error');
                contratos = await response.json();
                renderContratos();
                actualizarEstadisticas();
            } catch (error) {
                console.error(error);
                container.innerHTML = `<div class="empty">❌ Error al cargar</div>`;
            }
        }

        function renderContratos(filtro = '', estadoFiltro = 'todos') {
            const container = document.getElementById('contratosContainer');
            const filtroLower = filtro.toLowerCase();
            let filtrados = contratos.filter(c => 
                c.empresa.toLowerCase().includes(filtroLower) ||
                c.numero_contrato.toLowerCase().includes(filtroLower) ||
                String(c.id).includes(filtroLower)
            );
            if (estadoFiltro !== 'todos') filtrados = filtrados.filter(c => c.estado === estadoFiltro);
            if (filtrados.length === 0) { container.innerHTML = `<div class="empty">No hay contratos</div>`; return; }
            
            const estados = { 'activo':'🟢 Activo','pendiente':'⏳ Pendiente','finalizado':'📌 Finalizado','cancelado':'❌ Cancelado' };
            const clases = { 'activo':'activo','pendiente':'pendiente','finalizado':'finalizado','cancelado':'cancelado' };
            const tipos = { 'ventas':'<span class="badge ventas">💰 Ventas</span>','servicios':'<span class="badge servicios">📋 Servicios</span>','ambos':'<span class="badge ambos">🔄 Ambas</span>' };
            
            let html = `<table class="tabla"><thead><tr>
                <th>#</th><th>N° Contrato</th><th>Empresa</th><th>Inicio</th><th>Fin</th><th>Tipo</th><th>Estado</th><th>Acciones</th>
            </tr></thead><tbody>`;
            
            filtrados.forEach(c => {
                html += `<tr>
                    <td>#${c.id}</td>
                    <td><span class="contrato-numero">${c.numero_contrato}</span></td>
                    <td><strong>${c.empresa}</strong></td>
                    <td>${c.fecha_inicio}</td>
                    <td>${c.fecha_fin}</td>
                    <td>${tipos[c.tipo] || tipos['ventas']}</td>
                    <td><span class="badge ${clases[c.estado]}">${estados[c.estado]}</span></td>
                    <td>
                        <div class="acciones-cell">
                            <button class="btn btn-warning btn-sm" onclick="editarContrato(${c.id})">✏️</button>
                            <button class="btn btn-danger btn-sm" onclick="eliminarContrato(${c.id})">🗑️</button>
                            <select onchange="cambiarEstado(${c.id}, this.value)" class="estado-select">
                                <option value="activo" ${c.estado==='activo'?'selected':''}>Activo</option>
                                <option value="pendiente" ${c.estado==='pendiente'?'selected':''}>Pendiente</option>
                                <option value="finalizado" ${c.estado==='finalizado'?'selected':''}>Finalizado</option>
                                <option value="cancelado" ${c.estado==='cancelado'?'selected':''}>Cancelado</option>
                            </select>
                        </div>
                    </td>
                </tr>`;
            });
            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        function actualizarEstadisticas() {
            const total = contratos.length;
            const activos = contratos.filter(c => c.estado === 'activo' || c.estado === 'pendiente').length;
            const vencidos = contratos.filter(c => c.estado === 'cancelado').length;
            document.getElementById('totalContratos').textContent = total;
            document.getElementById('contratosActivos').textContent = activos;
            document.getElementById('contratosVencidos').textContent = vencidos;
        }

        function filtrarContratos() {
            renderContratos(document.getElementById('searchInput').value, document.getElementById('filtroEstado').value);
        }

        async function nuevoContrato() {
            document.getElementById('modalContrato').classList.add('show');
            document.getElementById('modalTitle').textContent = '📄 Nuevo Contrato';
            document.getElementById('contratoId').value = '';
            document.getElementById('contratoEmpresa').value = '';
            document.getElementById('contratoFechaInicio').value = '';
            document.getElementById('contratoFechaFin').value = '';
            document.getElementById('contratoMonto').value = '';
            document.getElementById('contratoDescripcion').value = '';
            document.getElementById('contratoDuracion').value = '2';
            document.getElementById('infoFechaFin').innerHTML = '📌 Se calcula automáticamente';
            document.getElementById('textoFechaFin').textContent = 'Fecha Fin: -';
            document.getElementById('btnGuardar').textContent = '💾 Guardar';
            document.querySelectorAll('.tipo-option label').forEach(el => el.classList.remove('seleccionado'));
            document.querySelectorAll('input[name="tipoContrato"]').forEach(el => el.checked = false);
            editandoId = null;
            await actualizarNumeroContrato();
            const hoy = new Date().toISOString().split('T')[0];
            document.getElementById('contratoFechaInicio').value = hoy;
            calcularFechaFin();
        }

        function editarContrato(id) {
            const c = contratos.find(c => c.id === id);
            if (!c) return;
            document.getElementById('modalContrato').classList.add('show');
            document.getElementById('modalTitle').textContent = '✏️ Editar Contrato';
            document.getElementById('contratoId').value = c.id;
            document.getElementById('contratoEmpresa').value = c.empresa;
            document.getElementById('contratoNumero').value = c.numero_contrato;
            document.getElementById('contratoFechaInicio').value = c.fecha_inicio;
            document.getElementById('contratoFechaFin').value = c.fecha_fin;
            document.getElementById('contratoMonto').value = c.monto || '';
            document.getElementById('contratoDescripcion').value = c.descripcion || '';
            document.getElementById('btnGuardar').textContent = '💾 Actualizar';
            if (c.fecha_inicio && c.fecha_fin) {
                const diffYears = new Date(c.fecha_fin).getFullYear() - new Date(c.fecha_inicio).getFullYear();
                if (diffYears >= 1 && diffYears <= 5) document.getElementById('contratoDuracion').value = diffYears;
                else document.getElementById('contratoDuracion').value = '2';
            }
            calcularFechaFin();
            document.querySelectorAll('.tipo-option label').forEach(el => el.classList.remove('seleccionado'));
            document.querySelectorAll('input[name="tipoContrato"]').forEach(el => el.checked = false);
            if (c.tipo) {
                const map = { 'ventas':'tipoVentas','servicios':'tipoServicios','ambos':'tipoAmbos' };
                const el = document.getElementById(map[c.tipo]);
                if (el) { el.classList.add('seleccionado'); el.querySelector('input').checked = true; }
            }
            editandoId = id;
        }

        function cerrarModal() { document.getElementById('modalContrato').classList.remove('show'); }
        document.getElementById('modalContrato').addEventListener('click', function(e) { if (e.target === this) cerrarModal(); });

  async function guardarContrato() {
    const btn = document.getElementById('btnGuardar');
    btn.disabled = true;
    btn.textContent = '⏳ Guardando...';
    
    try {
        const empresa = document.getElementById('contratoEmpresa').value.trim();
        const numero_contrato = document.getElementById('contratoNumero').value.trim();
        const fecha_inicio = document.getElementById('contratoFechaInicio').value;
        const fecha_fin = document.getElementById('contratoFechaFin').value;
        const monto = parseFloat(document.getElementById('contratoMonto').value) || 0;
        const descripcion = document.getElementById('contratoDescripcion').value.trim();
        const tipo = document.querySelector('input[name="tipoContrato"]:checked')?.value || '';
        const estado = document.getElementById('contratoEstado') ? document.getElementById('contratoEstado').value : 'activo';
        
        // ✅ Validaciones
        if (!empresa) {
            mostrarMensaje('La empresa es obligatoria', 'error');
            btn.disabled = false;
            btn.textContent = '💾 Guardar';
            return;
        }
        
        if (!fecha_inicio) {
            mostrarMensaje('La fecha de inicio es obligatoria', 'error');
            btn.disabled = false;
            btn.textContent = '💾 Guardar';
            return;
        }
        
        if (!tipo) {
            mostrarMensaje('El tipo de contrato es obligatorio', 'error');
            btn.disabled = false;
            btn.textContent = '💾 Guardar';
            return;
        }
        
        // ✅ Enviar datos correctos al backend
        const data = {
            empresa: empresa,
            numero_contrato: numero_contrato,
            fecha_inicio: fecha_inicio,
            fecha_fin: fecha_fin,
            tipo: tipo,
            monto: monto,
            descripcion: descripcion,
            estado: estado
        };
        
        console.log('📤 Enviando datos:', data);
        
        const url = editandoId ? `/api/contrato/${editandoId}` : '/api/contratos';
        const method = editandoId ? 'PUT' : 'POST';
        
        const response = await fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        
        const result = await response.json();
        console.log('📥 Respuesta:', result);
        
        if (response.ok && result.success) {
            mostrarMensaje(`✅ Contrato ${editandoId ? 'actualizado' : 'creado'} correctamente`, 'exito');
            cerrarModal();
            await cargarContratos();
            if (!editandoId) await obtenerUltimoNumeroContrato();
        } else {
            mostrarMensaje(result.error || 'Error al guardar el contrato', 'error');
        }
    } catch (error) {
        console.error('Error:', error);
        mostrarMensaje('Error: ' + error.message, 'error');
    } finally {
        btn.disabled = false;
        btn.textContent = editandoId ? '💾 Actualizar' : '💾 Guardar';
    }
}   

        function cambiarEstado(id, estado) {
            if (!confirm(`¿Cambiar estado a "${estado}"?`)) { cargarContratos(); return; }
            fetch(`/api/contrato/${id}/estado`, { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({estado}) })
                .then(r => r.json()).then(data => {
                    if (data.success) { mostrarMensaje(`✅ Estado actualizado`, 'exito'); cargarContratos(); }
                    else { mostrarMensaje(data.error || 'Error', 'error'); }
                }).catch(error => { console.error(error); mostrarMensaje('Error de conexión', 'error'); });
        }

        function eliminarContrato(id) {
            const c = contratos.find(c => c.id === id);
            if (!c) return;
            if (!confirm(`⚠️ ¿Eliminar contrato #${id} de "${c.empresa}"?`)) return;
            fetch(`/api/contrato/${id}`, { method:'DELETE' })
                .then(r => r.json()).then(data => {
                    if (data.success) { mostrarMensaje('✅ Eliminado', 'exito'); cargarContratos(); }
                    else { mostrarMensaje(data.error || 'Error', 'error'); }
                }).catch(error => { console.error(error); mostrarMensaje('Error de conexión', 'error'); });
        }

        document.getElementById('contratoFechaInicio').addEventListener('change', calcularFechaFin);
        document.getElementById('contratoDuracion').addEventListener('change', calcularFechaFin);

        cargarContratos();
        setInterval(cargarContratos, 30000);
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && document.getElementById('modalContrato').classList.contains('show')) {
                e.preventDefault(); guardarContrato();
            }
            if (e.key === 'Escape') cerrarModal();
        });
    </script>
</body>
</html>
