<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIsa - Cliente</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f1a;
            color: #fff;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #6c3ce0, #4a1a9e);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { font-size: 22px; display: flex; align-items: center; gap: 10px; }
        .header .user a {
            color: #fff;
            text-decoration: none;
            opacity: 0.7;
            padding: 4px 12px;
            border-radius: 12px;
            background: rgba(255,255,255,0.1);
        }
        .header .user a:hover { opacity: 1; }
        .container { padding: 24px; max-width: 1200px; margin: 0 auto; }
        .card {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 24px;
            border: 1px solid #2a2a3e;
            margin-bottom: 20px;
        }
        .card h2 { font-size: 18px; color: #6c3ce0; margin-bottom: 16px; }
        .welcome { font-size: 20px; margin-bottom: 8px; }
        .subtitle { color: #888; font-size: 14px; }
        
        .productos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 12px;
        }
        .producto-card {
            background: #0f0f1a;
            border: 1px solid #2a2a3e;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            transition: all 0.3s;
            position: relative;
        }
        .producto-card:hover {
            border-color: #6c3ce0;
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(108, 60, 224, 0.15);
        }
        .producto-card .destacado-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #ff9800;
            color: #000;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
        }
        .producto-card .foto {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 12px;
            background: #1a1a2e;
        }
        .producto-card .nombre {
            font-size: 15px;
            font-weight: 600;
            margin: 8px 0 4px;
        }
        .producto-card .categoria {
            font-size: 11px;
            color: #888;
            margin-bottom: 4px;
        }
        .producto-card .precio {
            font-size: 18px;
            color: #6c3ce0;
            font-weight: 700;
        }
        .producto-card .stock {
            font-size: 12px;
            color: #888;
            margin: 4px 0 8px;
        }
        .producto-card .stock.bajo { color: #ff6b6b; }
        .producto-card .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }
        .producto-card .btn-primary { background: #6c3ce0; color: #fff; }
        .producto-card .btn-primary:hover { background: #5a2ec0; }
        .producto-card .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .producto-card .negocio-nombre {
            font-size: 11px;
            color: #666;
            margin-top: 4px;
        }
        
        .loading-productos { text-align: center; color: #888; padding: 40px; }
        .empty-productos { text-align: center; color: #888; padding: 40px; }
        
        @media (max-width: 600px) {
            .productos-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

    <header class="header">
        <h1>🛍️ AIsa <span style="font-size:14px;font-weight:normal;opacity:0.7;">Modo Cliente</span></h1>
        <div class="user">
            <span>👤 {{ usuario.nombre or usuario.username }}</span>
            <a href="/logout">Cerrar sesión</a>
        </div>
    </header>

    <div class="container">
        <div class="card">
            <div class="welcome">👋 ¡Bienvenido, {{ usuario.nombre or usuario.username }}!</div>
            <div class="subtitle">Explora productos disponibles en la tienda</div>
        </div>

        <!-- Tienda -->
        <div class="card">
            <h2>🛒 Tienda</h2>
            <div id="productosContainer">
                <div class="loading-productos">Cargando productos...</div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // CARGAR PRODUCTOS DE LA TIENDA PÚBLICA
        // ============================================
        
        async function cargarProductosTienda() {
            const container = document.getElementById('productosContainer');
            container.innerHTML = '<div class="loading-productos">Cargando productos...</div>';
            
            try {
                const response = await fetch('/api/tienda/public');
                if (!response.ok) throw new Error('Error al cargar productos');
                const productos = await response.json();
                
                if (productos.length === 0) {
                    container.innerHTML = '<div class="empty-productos">No hay productos disponibles en la tienda</div>';
                    return;
                }
                
                let html = '<div class="productos-grid">';
                productos.forEach(p => {
                    const stockClass = p.stock < 5 ? 'bajo' : '';
                    const stockText = p.stock > 0 ? `📦 ${p.stock} unidades` : '🚫 Agotado';
                    const disabled = p.stock <= 0 ? 'disabled' : '';
                    const fotoUrl = p.foto_url || '/static/img/default_product.png';
                    const destacadoHtml = p.destacado ? '<span class="destacado-badge">⭐ Destacado</span>' : '';
                    const negocioNombre = p.negocio_nombre || p.negocio_username || 'Negocio';
                    
                    html += `
                        <div class="producto-card">
                            ${destacadoHtml}
                            <img src="${fotoUrl}" alt="${p.nombre}" class="foto" 
                                 onerror="this.src='/static/img/default_product.png'">
                            <div class="nombre">${p.nombre}</div>
                            <div class="categoria">${p.categoria || ''}</div>
                            <div class="precio">$${parseFloat(p.precio).toFixed(2)}</div>
                            <div class="stock ${stockClass}">${stockText}</div>
                            <div class="negocio-nombre">🏢 ${negocioNombre}</div>
                            <button class="btn btn-primary" ${disabled} onclick="agregarCarrito(${p.id}, '${p.nombre}', ${p.precio})">
                                🛒 Agregar al carrito
                            </button>
                        </div>
                    `;
                });
                html += '</div>';
                container.innerHTML = html;
                
            } catch (error) {
                console.error('Error:', error);
                container.innerHTML = '<div class="empty-productos">❌ Error al cargar productos</div>';
            }
        }
        
        function agregarCarrito(id, nombre, precio) {
            alert(`🛒 Producto "${nombre}" agregado al carrito\n💰 Precio: $${precio.toFixed(2)}`);
        }

        // ============================================
        // INICIO
        // ============================================
        
        cargarProductosTienda();
        setInterval(cargarProductosTienda, 30000);
    </script>
</body>
</html>
